        Leer el documento</summary>
        <div class="doc-cuerpo" style="margin-top:.6rem">${(d.cuerpo || []).map(x =>
          `<h4>${esc(x.h)}</h4><ul>${(x.l || []).map(y => `<li>${esc(y)}</li>`).join("")}</ul>`).join("")}</div></details>
      <div class="acciones-admin">
        <button class="btn btn-oro btn-mini" data-editar-doc="${esc(d.id)}">Editar</button>
        <button class="btn btn-2 btn-mini" data-borrar-doc="${esc(d.id)}">Borrar</button></div>
    </article>`;
  }).join("")}`;
}

/* El cuerpo se escribe en texto: "# Título" abre una sección, lo demás son puntos. */
const cuerpoATexto = cuerpo => (cuerpo || [])
  .map(s => `# ${s.h}\n` + (s.l || []).join("\n")).join("\n\n");
function textoACuerpo(texto) {
  const secciones = [];
  for (const linea of String(texto).split("\n").map(x => x.trim())) {
    if (!linea) continue;
    if (linea.startsWith("#")) secciones.push({ h: linea.replace(/^#+\s*/, ""), l: [] });
    else { if (!secciones.length) secciones.push({ h: "", l: [] }); secciones[secciones.length - 1].l.push(linea); }
  }
  return secciones;
}

function editarDocumento(id) {
  const d = id ? documento(id) : { titulo:"", version:"1.0", vigente:"", audiencia:"todos",
    obligatorio:true, resumen:"", cuerpo:[] };
  if (!d) return;
  const AUD = { todos:"Todos", jinete:"Jinetes", propietario:"Propietarios", menor:"Menores de edad" };
  abrirHoja(id ? "Editar documento" : "Nuevo documento", `
    <form id="form-doc" style="display:grid; gap:.7rem">
      <label class="campo">Título<input type="text" name="titulo" required value="${esc(d.titulo)}"></label>
      <div class="dos-campos">
        <label class="campo">Versión<input type="text" name="version" required value="${esc(d.version)}"></label>
        <label class="campo">Vigente desde<input type="text" name="vigente" value="${esc(d.vigente || "")}"
          placeholder="1 de julio de 2026"></label></div>
      <label class="campo">¿A quién le toca?<select name="audiencia">${
        Object.entries(AUD).map(([k, v]) =>
          `<option value="${k}" ${d.audiencia === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label style="display:flex; gap:.5rem; align-items:center; font-size:.82rem">
        <input type="checkbox" name="obligatorio" ${d.obligatorio ? "checked" : ""} style="width:auto">
        <span>Hay que firmarlo antes de poder reservar</span></label>
      <label class="campo">Resumen de una línea
        <input type="text" name="resumen" value="${esc(d.resumen || "")}"></label>
      <label class="campo">Texto del documento — una línea que empiece con # abre una sección
        <textarea name="cuerpo" style="min-height:11rem">${esc(cuerpoATexto(d.cuerpo))}</textarea></label>
      <p style="font-size:.76rem; color:var(--oro-tinta)">
        Si subes la versión, a quienes ya lo firmaron se les vuelve a pedir la firma.</p>
      <button class="btn btn-oro btn-bloque" type="submit">${id ? "Guardar" : "Crear documento"}</button>
    </form>`,
    cerrar => {
      $("#form-doc").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        const titulo = String(f.get("titulo")).trim();
        const nuevoId = id || titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "doc-" + Date.now();
        try {
          await Datos.poner("documentos", nuevoId, {
            titulo, version:String(f.get("version")).trim(), vigente:String(f.get("vigente") || ""),
            audiencia:String(f.get("audiencia")), obligatorio:f.get("obligatorio") === "on",
            resumen:String(f.get("resumen") || ""), cuerpo:textoACuerpo(f.get("cuerpo") || ""),
            orden: id ? (documento(id).orden || 0) : documentos().length,
          });
          avisar(id ? "Documento actualizado." : "Documento creado."); cerrar(); pintar();
        } catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
      });
    });
}

/* ---------------------------------------------------------------- ANUNCIOS
   Los escribe dirección y le salen a los perfiles que elija (M10). */
const PERFILES_ANUNCIO = { todos:"Todos", jinete:"Jinetes", propietario:"Propietarios", tutor:"Tutores" };

function anunciosParaMi() {
  const hoy = ymd(ahora());
  return Datos.todo("anuncios")
    .filter(a => !a.expira || a.expira >= hoy)
    .filter(a => {
      if (esAdmin()) return true;
      const aud = a.audiencia || ["todos"];
      if (aud.includes("todos")) return true;
      if (aud.includes(cuenta.rol)) return true;
      return cuenta.rol === "tutor" && aud.includes("jinete");
    })
    .sort((a,b) => (b.fijado ? 1 : 0) - (a.fijado ? 1 : 0) ||
      (b.publicado || "").localeCompare(a.publicado || ""));
}

function editarAnuncio(id) {
  const a = id ? Datos.todo("anuncios").find(x => x.id === id) : { titulo:"", cuerpo:"",
    audiencia:["todos"], fijado:false, expira:"" };
  if (!a) return;
  abrirHoja(id ? "Editar anuncio" : "Nuevo anuncio", `
    <form id="form-anuncio" style="display:grid; gap:.7rem">
      <label class="campo">Título<input type="text" name="titulo" required value="${esc(a.titulo)}"
        placeholder="Cierre por lluvia"></label>
      <label class="campo">Aviso
        <textarea name="cuerpo" required style="min-height:5rem"
          placeholder="No hay clases el miércoles por el estado de la pista.">${esc(a.cuerpo || "")}</textarea></label>
      <div class="campo">¿A quién le sale?
        <div class="casillas">${Object.entries(PERFILES_ANUNCIO).map(([k, v]) =>
          `<label><input type="checkbox" name="audiencia" value="${k}"
            ${(a.audiencia || []).includes(k) ? "checked" : ""}>${v}</label>`).join("")}</div></div>
      <label class="campo">Deja de mostrarse el (opcional)
        <input type="date" name="expira" value="${esc(a.expira || "")}"></label>
      <label style="display:flex; gap:.5rem; align-items:center; font-size:.82rem">
        <input type="checkbox" name="fijado" ${a.fijado ? "checked" : ""} style="width:auto">
        <span>Fijar arriba de todo</span></label>
      <button class="btn btn-oro btn-bloque" type="submit">${id ? "Guardar" : "Publicar anuncio"}</button>
      ${id ? '<button class="btn btn-2 btn-bloque" type="button" id="borrar-anuncio">Borrar anuncio</button>' : ""}
    </form>`,
    cerrar => {
      if (id) $("#borrar-anuncio").onclick = async () => {
        try { await Datos.quitar("anuncios", id); avisar("Anuncio borrado."); }
        catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
        cerrar(); pintar();
      };
      $("#form-anuncio").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        const aud = f.getAll("audiencia");
        if (!aud.length) return avisar("Elige al menos un perfil.");
        try {
          await Datos.poner("anuncios", id || "a-" + Date.now().toString(36), {
            titulo:String(f.get("titulo")).trim(), cuerpo:String(f.get("cuerpo")).trim(),
            audiencia:aud, fijado:f.get("fijado") === "on", expira:String(f.get("expira") || ""),
            publicado: id ? (a.publicado || new Date().toISOString()) : new Date().toISOString(),
          });
          avisar(id ? "Anuncio actualizado." : "Anuncio publicado."); cerrar(); pintar();
        } catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
      });
    });
}

/* ------------------------------------------------------------ COMPETENCIAS */
function verCompetencias() {
  const lista = competencias();
  const futuras = lista.filter(c => deYmd(c.fin || c.inicio, "23:59") > ahora());
  const pasadas = lista.filter(c => deYmd(c.fin || c.inicio, "23:59") <= ahora());
  return `
  <div class="vista-titulo"><h2>Competencias</h2>
    <span class="sub">${futuras.length} por venir</span></div>
  ${esAdmin() ? `<div class="admin-caja">
    <p class="etiqueta">Dirección</p>
    <p style="font-size:.82rem; color:var(--oro-tinta)">
      Crea competencias, cambia fechas, publica categorías y horarios, fija el cierre de
      inscripciones y mira quién está anotado y en qué.</p>
    <div class="acciones-admin"><button class="btn btn-oro btn-mini" data-nueva-comp>Nueva competencia</button></div>
  </div>` : ""}
  ${futuras.map(c => bloqueComp(c, false)).join("") ||
    `<div class="vacio">${esAdmin() ? "El calendario está vacío. Crea la primera competencia."
      : "Dirección todavía no publica competencias."}</div>`}
  ${pasadas.length ? `<p class="etiqueta" style="margin-top:.5rem">Ya realizadas</p>
    ${pasadas.map(c => bloqueComp(c, true)).join("")}` : ""}
  <p style="font-size:.75rem; color:var(--ink-3)">
    Anotarse avisa a dirección del interés. La inscripción formal y el pago se hacen en oficinas.</p>`;
}

function bloqueComp(c, pasada) {
  const [,m,d] = c.inicio.split("-").map(Number);
  const mia = inscritoEn(c.id);
  const anotados = anotadosEn(c.id);
  const cierraEn = c.cierre ? deYmd(c.cierre, "20:00") : null;
  const abierta = !pasada && (!cierraEn || cierraEn > ahora());
  const cats = c.categorias || [], hors = c.horarios || [];
  return `<article class="comp" style="${pasada ? "opacity:.7" : ""}">
    <div class="comp-cab">
      <div class="comp-fecha" ${pasada ? 'style="background:var(--line-fuerte); color:var(--ink-2)"' : ""}>
        <span class="d">${d}</span><span class="m">${esc(MESES[m-1].slice(0,3))}</span></div>
      <div style="flex:1; min-width:0">
        <h3>${esc(c.nombre)}</h3>
        <p style="font-size:.82rem; color:var(--ink-2)">${esc(rangoFechas(c.inicio, c.fin))}</p>
        <p style="font-size:.78rem; color:var(--ink-3)">${esc(c.sede || "Sede por confirmar")}${
          c.disciplina ? " · " + esc(c.disciplina) : ""}</p></div>
      ${mia ? '<span class="pastilla p-ok">Anotado</span>' : ""}
    </div>
    <div class="comp-bloque"><p class="etiqueta">Categorías</p>
      ${cats.length ? `<div class="fichas">${cats.map(x => `<span class="ficha-cat">${esc(x)}</span>`).join("")}</div>`
        : '<p class="por-definir">Dirección todavía no publica las categorías.</p>'}</div>
    <div class="comp-bloque"><p class="etiqueta">Horarios</p>
      ${hors.length ? `<div class="horario">${hors.map(h =>
        `<div><b>${esc(h.split("—")[0].trim())}</b><span>${esc((h.split("—")[1] || "").trim())}</span></div>`).join("")}</div>`
        : '<p class="por-definir">Dirección todavía no publica los horarios.</p>'}</div>
    ${c.nota ? `<p style="font-size:.8rem; color:var(--ink-2)">${esc(c.nota)}</p>` : ""}
    <div class="comp-bloque"><p style="font-size:.78rem; color:var(--ink-3)">
      Cierre de inscripciones: ${c.cierre ? esc(fechaLarga(c.cierre)) : "por definir"}</p></div>
    ${pasada ? "" : abierta
      ? `<button class="btn ${mia ? "btn-2" : ""} btn-bloque btn-mini" data-comp="${esc(c.id)}">
          ${mia ? "Quitar mi nombre" : "Me interesa competir"}</button>`
      : `<div class="nota">Las inscripciones ya cerraron. Habla con dirección si quieres entrar.</div>`}
    ${esAdmin() ? `<div class="admin-caja">
      <p class="etiqueta">Anotados (${anotados.length})</p>
      ${anotados.length ? anotados.map(i => {
        const p = persona(i.personaId);
        return `<div class="anotado"><span>${esc(p ? p.nombre : i.personaId)}</span>
          <span class="cat">${esc(i.categoria || "sin categoría")}</span></div>`; }).join("")
        : '<p style="font-size:.8rem; color:var(--oro-tinta)">Nadie se ha anotado todavía.</p>'}
      <div class="acciones-admin">
        <button class="btn btn-oro btn-mini" data-editar-comp="${esc(c.id)}">Editar</button>
        <button class="btn btn-2 btn-mini" data-borrar-comp="${esc(c.id)}">Borrar</button></div>
    </div>` : ""}
  </article>`;
}

/* Tablero de anuncios: dirección escribe, cada perfil ve lo suyo. */
function bloqueAnuncios() {
  const lista = anunciosParaMi();
  return `
  ${esAdmin() ? `${esAdmin() && !Datos.esEditor ? `<div class="nota alerta">
    <b>Solo lectura.</b> Esta página no te ha dado permiso de edición, así que los cambios
    al catálogo se van a rechazar. Pide que te la compartan con permiso de edición.</div>` : ""}
  <div class="admin-caja">
    <p class="etiqueta">Anuncios del club</p>
    <p style="font-size:.82rem; color:var(--oro-tinta)">
      Escribes un aviso y eliges a qué perfiles les sale, o a todos. Les aparece aquí,
      arriba de sus recordatorios.</p>
    <div class="acciones-admin"><button class="btn btn-oro btn-mini" data-nuevo-anuncio>Nuevo anuncio</button></div>
  </div>` : ""}
  ${lista.length ? `<div>
    ${esAdmin() ? "" : '<p class="etiqueta" style="margin-bottom:.4rem">Del club</p>'}
    <div class="vista">${lista.map(a => `
      <article class="anuncio ${a.fijado ? "fijado" : ""}">
        <div class="anuncio-cab">
          <h3>${esc(a.titulo)}</h3>
          ${a.fijado ? '<span class="pastilla p-oro">Fijado</span>' : ""}
        </div>
        <p class="anuncio-cuerpo">${esc(a.cuerpo)}</p>
        <div class="anuncio-pie">
          <span>${a.publicado ? esc(fechaLarga(ymd(new Date(a.publicado)))) : ""}${
            a.expira ? " · hasta el " + esc(fechaLarga(a.expira)) : ""}</span>
          ${esAdmin() ? `<span>${(a.audiencia || []).map(x =>
            `<span class="pastilla ${claseAudiencia(x)}">${esc(PERFILES_ANUNCIO[x] || x)}</span>`).join(" ")}</span>
            <button class="btn btn-2 btn-mini" data-editar-anuncio="${esc(a.id)}">Editar</button>` : ""}
        </div>
      </article>`).join("")}</div>
  </div>` : esAdmin() ? "" : ""}`;
}

/* ----------------------------------------------------------- RECORDATORIOS */
function verRecordatorios() {
  const autos = recordatoriosAuto();
  const mios = misRecordatorios().sort((a,b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
  const hoyClave = ymd(ahora());
  return `
  <div class="vista-titulo"><h2>Avisos y recordatorios</h2>
    <span class="sub">${mios.filter(r => !r.hecho).length} pendientes</span></div>

  ${bloqueAnuncios()}

  <p class="etiqueta">Lo tuyo</p>
  <form class="tarjeta" id="nuevo-rec" style="display:grid; gap:.6rem">
    <label class="campo">Qué no se puede olvidar
      <input type="text" name="texto" required maxlength="140" placeholder="Llevar los electrolitos"></label>
    <label class="campo">Para cuándo<input type="date" name="fecha" value="${hoyClave}"></label>
    <button class="btn" type="submit">Agregar recordatorio</button></form>
  ${mios.length ? `<div class="vista">${mios.map(r => `
    <article class="rec ${r.hecho ? "hecho" : ""} ${!r.hecho && r.fecha && r.fecha < hoyClave ? "vencido" : ""}">
      <button class="marcar" data-hecho="${esc(r.id)}" aria-pressed="${!!r.hecho}" aria-label="Marcar como hecho">
        ${r.hecho ? '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' : ""}</button>
      <div class="txt"><div class="t">${esc(r.texto)}</div>
        <div class="f">${r.fecha ? esc(fechaLarga(r.fecha)) : "sin fecha"}${
          !r.hecho && r.fecha && r.fecha < hoyClave ? " · vencido" : ""}</div></div>
      <button class="btn btn-mini btn-2" data-borrar-rec="${esc(r.id)}">Borrar</button></article>`).join("")}</div>`
    : '<div class="vacio">Todavía no hay recordatorios propios.</div>'}
  ${autos.length ? `<div><p class="etiqueta" style="margin-bottom:.4rem">Del club, automáticos</p>
    <div class="vista">${autos.map(r => `<article class="rec auto"><div class="txt">
      <div class="t">${esc(r.texto)}</div>
      <div class="f">${esc(fechaLarga(ymd(r.vence)))} · ${esc(horaTexto(r.vence))}</div></div></article>`).join("")}</div>
    <p style="font-size:.75rem; color:var(--ink-3); margin-top:.5rem">
      Salen solos de las reservas y del calendario. En el sistema final llegan además por WhatsApp (M12).</p>
  </div>` : ""}`;
}
</script>

<script>
"use strict";
/* --------------------------------------------------------- SEMANA (dirección)
   El calendario maestro del club (M11): todas las reservas de la semana, hora
   por hora, con quién monta y en qué caballo. */
let semanaOffset = 0;      /* 0 = esta semana, 1 = la siguiente */
let diaSemanaSel = "";     /* el día abierto en la agenda */
let soloMisClases = true;  /* un maestro abre en las suyas */

function verSemana() {
  const lunes = sumarDias(lunesDeLaSemana(ahora()), semanaOffset * 7);
  const dias = Array.from({ length:7 }, (_, i) => ymd(sumarDias(lunes, i)));
  if (!dias.includes(diaSemanaSel)) diaSemanaSel = dias.find(f => sesionesDe(f).length) || dias[0];

  /* Un maestro ve su propia agenda; dirección puede ver la del club entera. */
  const mias = daClases() && soloMisClases;
  const deMi = x => !mias || x.ent === cuenta.id;
  const dela = Datos.todo("reservas").filter(r => dias.includes(r.fecha) &&
    (!mias || (ranura(r.plantillaId) || {}).ent === cuenta.id));
  const porCaballo = {};
  for (const r of dela) porCaballo[r.caballoId] = (porCaballo[r.caballoId] || 0) + 1;
  const top = Object.entries(porCaballo).sort((a,b) => b[1] - a[1])[0];
  const cuenta_ = f => dela.filter(r => r.fecha === f).length;
  const pico = Math.max(1, ...dias.map(cuenta_));

  const sesiones = sesionesDe(diaSemanaSel).filter(deMi);
  const pSel = partesClub(deYmd(diaSemanaSel, "12:00"));

  return `
  <div class="vista-titulo"><h2>${mias ? "Mi semana" : "La semana"}</h2>
    <span class="sub">${esc(rangoFechas(dias[0], dias[6]))}</span></div>

  ${daClases() ? `<div class="filtro-maestro">
    <span>${mias ? `Solo las clases de ${esc(cuenta.nombre.split(" ")[0])}`
      : "Todas las clases del club"}</span>
    ${esAdmin() ? `<button class="btn btn-2 btn-mini" data-alternar-mias>
      Ver ${mias ? "todas" : "solo las mías"}</button>` : ""}
  </div>` : ""}

  <div class="semana-nav">
    <button class="btn btn-2 btn-mini" data-semana="-1" ${semanaOffset <= -4 ? "disabled" : ""}>‹</button>
    <span>${semanaOffset === 0 ? "Esta semana" : semanaOffset === 1 ? "La siguiente"
      : semanaOffset === -1 ? "La pasada" : `${semanaOffset > 0 ? "+" : ""}${semanaOffset} semanas`}</span>
    <button class="btn btn-2 btn-mini" data-semana="1" ${semanaOffset >= 8 ? "disabled" : ""}>›</button>
  </div>

  <div class="resumen compacta">
    <div class="dato"><div class="n">${dela.length}</div><div class="t">clases reservadas</div></div>
    <div class="dato"><div class="n">${new Set(dela.map(r => r.personaId)).size}</div><div class="t">jinetes distintos</div></div>
    <div class="dato"><div class="n">${new Set(dela.map(r => r.caballoId)).size}</div><div class="t">caballos en uso</div></div>
    <div class="dato"><div class="n chico">${top
      ? esc((caballo(top[0]) || {}).nombre || top[0]) + " · " + top[1] : "—"}</div>
      <div class="t">el que más trabaja</div></div>
  </div>

  <div class="tira">
    ${dias.map(f => {
      const p = partesClub(deYmd(f, "12:00"));
      const n = cuenta_(f);
      const hay = sesionesDe(f).filter(deMi).length;
      return `<button class="tira-dia" data-diasemana="${f}" aria-pressed="${f === diaSemanaSel}">
        <span class="td-dia">${DIAS[p.diaSemana].slice(0,2)}</span>
        <span class="td-num">${p.dia}</span>
        <span class="td-barra"><span style="height:${hay ? Math.round((n / pico) * 100) : 0}%"></span></span>
        <span class="td-n">${hay ? n : "—"}</span>
      </button>`;
    }).join("")}
  </div>

  <div class="dia-bloque">
    <div class="dia-cab">
      <h3>${DIAS[pSel.diaSemana]} ${pSel.dia}</h3>
      <span>${sesiones.length
        ? `${sesiones.reduce((n, x) => n + reservasDeSesion(x).length, 0)} de ${
            sesiones.reduce((n, x) => n + x.cupo, 0)} lugares`
        : "sin clases"}</span>
    </div>
    ${sesiones.length ? sesiones.map(x => {
      const rs = reservasDeSesion(x);
      return `<div class="ranura ${clasePista(x.esp)} ${rs.length ? "" : "libre"}">
        <div class="ranura-hora">${esc(horaTexto(x.inicio))}</div>
        <div class="ranura-cuerpo">
          <div class="ranura-meta"><span class="pastilla ${clasePista(x.esp) === "pista2"
            ? "p-pista2" : "p-pista1"}">${esc(espacio(x.esp))}</span>
            <span class="pastilla ${claseMaestro(x.ent)}">${esc(entrenador(x.ent))}</span>${
            x.soloPropietarios ? " · solo propietarios" : ""}</div>
          ${rs.length ? `<div class="jinetes">${rs.map(r => {
            const per = persona(r.personaId), cab = caballo(r.caballoId);
            const texto = `${esc(per ? per.nombre.split(" ")[0] : r.personaId)}
              <b>${esc(cab ? cab.nombre : "—")}</b>`;
            /* Dirección y el maestro de esa clase pueden quitar a alguien. */
            return (esAdmin() || x.ent === cuenta.id)
              ? `<button class="jinete-chip accionable" data-ajustar="${esc(r.id)}"
                  title="Ajustar esta reserva">${texto}</button>`
              : `<span class="jinete-chip">${texto}</span>`;
          }).join("")}</div>` : '<div class="jinetes vacia">Nadie anotado</div>'}
        </div>
        <div class="ranura-lado">
          <span class="ranura-cupo">${rs.length}/${x.cupo}</span>
          <button class="btn btn-2 btn-mini" data-ranura="${esc(x.plantillaId)}">Ajustar</button>
        </div>
      </div>`;
    }).join("")
      : `<div class="ranura libre"><div class="ranura-cuerpo" style="grid-column:1/-1">
          <div class="jinetes vacia">${pSel.diaSemana === 1
            ? "El lunes no se monta: es el día en que se abre la agenda."
            : "No hay horas dadas de alta este día."}</div></div></div>`}
  </div>

  <p style="font-size:.75rem; color:var(--ink-3)">
    ${esAdmin() || daClases()
      ? "Toca el nombre de un jinete para quitarlo de la clase o marcarle falta. "
      : ""}«Ajustar» cambia la pista, el maestro o el cupo de esa hora, o la quita del horario.</p>`;
}

/* Dirección o el maestro sacan a alguien de una clase. Las tres salidas que
   distingue el reglamento: el club cancela y devuelve (RN-13), el jinete canceló
   tarde y se le cobra (RN-01), o no se presentó (RN-02). */
function ajustarReserva(reservaId) {
  const r = Datos.todo("reservas").find(x => x.id === reservaId);
  if (!r) return;
  const per = persona(r.personaId), cab = caballo(r.caballoId);
  const inicio = deYmd(r.fecha, r.hora);

  const cerrarCon = async (estado, cobrada, mensaje) => {
    await Datos.poner("historial", "h-" + r.id + "-" + Date.now(), {
      personaId:r.personaId, fecha:r.fecha, hora:r.hora, caballoId:r.caballoId,
      tipoId:r.tipoId, consume:r.consume || 1, estado, cobrada,
      ajustadaPor:cuenta.id, cuando:new Date().toISOString(),
    });
    await Datos.quitar("reservas", r.id);
    avisar(mensaje);
    pintar();
  };

  abrirHoja("Ajustar la clase", `
    <div class="ficha-ajuste">
      <p class="fa-nombre">${esc(per ? per.nombre : r.personaId)}</p>
      <dl class="fa-datos">
        <div><dt>Clase</dt><dd>${esc(fechaLarga(r.fecha))}, ${esc(horaTexto(inicio))}</dd></div>
        <div><dt>Dónde</dt><dd>${esc(espacio(r.esp))} · ${esc(entrenador(r.ent))}</dd></div>
        <div><dt>Caballo</dt><dd>${esc(cab ? cab.nombre : "—")}</dd></div>
        <div><dt>Saldo</dt><dd>${per ? saldo(per) : "—"} clases</dd></div>
        <div><dt>Ventana</dt><dd>${inicio < ahora() ? "La clase ya pasó"
          : seCancelaSinCosto(inicio) ? `Dentro de las 10 horas, hasta ${esc(momentoTexto(limiteCancelacion(inicio)))}`
          : "Fuera de las 10 horas"}</dd></div>
      </dl>
    </div>
    <p class="etiqueta">¿Qué pasó?</p>
    <button class="opcion-accion oa-ok" id="a-devolver">
      <span class="oa-t">Canceló el club</span>
      <span class="oa-d">Lluvia, caballo lesionado, cambio de horario. La clase vuelve a su
        saldo aunque hayan pasado las 10 horas.</span>
      <span class="oa-e">Le devuelve la clase</span>
    </button>
    <button class="opcion-accion oa-aviso" id="a-cobrar">
      <span class="oa-t">Canceló tarde</span>
      <span class="oa-d">Avisó pasado el límite de 10 horas. Sale de la clase y el lugar
        queda libre, pero la clase se le cobra.</span>
      <span class="oa-e">Se le cobra la clase</span>
    </button>
    <button class="opcion-accion oa-mover" id="a-mover">
      <span class="oa-t">Cambiarla de horario</span>
      <span class="oa-d">Pasa al jinete a otra hora de la misma semana, con el mismo caballo.
        No se le cobra ni se le devuelve nada.</span>
      <span class="oa-e">Mueve la reserva</span>
    </button>
    <button class="opcion-accion oa-alerta" id="a-falta">
      <span class="oa-t">No se presentó</span>
      <span class="oa-d">No llegó y no avisó. Queda registrado en su historial y en el
        conteo de faltas.</span>
      <span class="oa-e">Se le cobra la clase</span>
    </button>`,
    cerrar => {
      $("#a-devolver").onclick = async () => { cerrar();
        await cerrarCon("cancelada_por_club", false,
          `${per ? per.nombre.split(" ")[0] : "El jinete"} sale de la clase y recupera la suya.`); };
      $("#a-cobrar").onclick = async () => { cerrar();
        await cerrarCon("cancelada_tarde", true,
          `${per ? per.nombre.split(" ")[0] : "El jinete"} sale de la clase. Se le cobra.`); };
      $("#a-mover").onclick = () => { cerrar(); moverReserva(r.id); };
      $("#a-falta").onclick = async () => { cerrar();
        await cerrarCon("no_show", true,
          `Falta registrada. La clase se le cobra.`); };
    });
}

/* Huecos a los que se puede pasar esa reserva, en su misma semana: con lugar,
   con el caballo libre y sin encimarle otra clase al jinete. */
function huecosPara(r) {
  const per = persona(r.personaId) || {};
  const esPropietario = (SECCIONES[per.rol] || []).includes("propietario");
  const lunes = lunesDeLaSemana(deYmd(r.fecha, "12:00"));
  const cab = caballo(r.caballoId);
  const otras = Datos.todo("reservas").filter(x => x.id !== r.id);
  const huecos = [];

  for (let i = 0; i < 7; i++) {
    const f = ymd(sumarDias(lunes, i));
    for (const s of sesionesDe(f)) {
      if (s.inicio <= ahora()) continue;
      if (s.fecha === r.fecha && s.plantillaId === r.plantillaId) continue;
      if (s.soloPropietarios && !esPropietario) continue;
      const enEsa = otras.filter(x => x.fecha === f && x.plantillaId === s.plantillaId);
      const cap = (ESPACIOS.find(e => e.id === s.esp) || {}).cap || s.cupo;
      if (enEsa.length >= Math.min(s.cupo, cap)) continue;                       // RN-09
      const delCaballo = otras.filter(x => x.fecha === f && x.caballoId === r.caballoId);
      if (cab && delCaballo.length >= cab.maxDia) continue;                       // RN-06
      if (delCaballo.some(x => { const [i2,f2] = intervaloReserva(x);
        return traslapa(s.inicio, s.fin, i2, f2); })) continue;                   // RN-08
      if (otras.some(x => x.personaId === r.personaId && x.fecha === f &&
        traslapa(s.inicio, s.fin, ...intervaloReserva(x)))) continue;             // RN-10
      huecos.push(s);
    }
  }
  return huecos;
}

function moverReserva(reservaId) {
  const r = Datos.todo("reservas").find(x => x.id === reservaId);
  if (!r) return;
  const per = persona(r.personaId), cab = caballo(r.caballoId);
  const huecos = huecosPara(r);
  const porDia = {};
  for (const h of huecos) (porDia[h.fecha] ||= []).push(h);

  abrirHoja("Cambiar de horario", `
    <div class="ficha-ajuste">
      <p class="fa-nombre">${esc(per ? per.nombre : r.personaId)}</p>
      <dl class="fa-datos">
        <div><dt>Ahora</dt><dd>${esc(fechaLarga(r.fecha))}, ${esc(horaTexto(deYmd(r.fecha, r.hora)))}</dd></div>
        <div><dt>Caballo</dt><dd>${esc(cab ? cab.nombre : "—")}, se mantiene</dd></div>
      </dl>
    </div>
    ${huecos.length ? `<p class="etiqueta">Pásala a</p>
      ${Object.entries(porDia).map(([f, ss]) => `<div class="hueco-dia">
        <p class="hd-titulo">${esc(fechaLarga(f))}</p>
        <div class="hd-horas">${ss.map(sx => `
          <button class="hueco" data-mover-a="${esc(sx.fecha)}|${esc(sx.plantillaId)}">
            <span class="h-hora">${esc(horaTexto(sx.inicio))}</span>
            <span class="h-meta">${esc(entrenador(sx.ent))} · ${esc(espacio(sx.esp))}</span>
            <span class="h-libres">${lugaresLibres(sx)} libres</span>
          </button>`).join("")}</div>
      </div>`).join("")}`
      : `<div class="vacio">No hay ningún hueco esta semana donde quepa
          ${esc(cab ? cab.nombre : "el caballo")} sin encimarle otra clase.</div>`}`,
    cerrar => {
      $("#hoja-cuerpo").addEventListener("click", async e => {
        const b = e.target.closest("[data-mover-a]"); if (!b) return;
        const [fecha, plantillaId] = b.dataset.moverA.split("|");
        const destino = sesionesDe(fecha).find(x => x.plantillaId === plantillaId);
        if (!destino) return;
        b.disabled = true;
        const nuevoId = `${fecha}__${plantillaId}__${r.caballoId}`;
        const gano = await Datos.apartar("reservas", nuevoId, {
          ...r, id:undefined, fecha, hora:destino.hora, plantillaId,
          ent:destino.ent, esp:destino.esp, movidaPor:cuenta.id,
        }, idTab);
        if (!gano) { b.disabled = false; return avisar("Ese lugar lo acaban de tomar."); }
        await Datos.quitar("reservas", r.id);
        avisar(`${per ? per.nombre.split(" ")[0] : "La clase"} pasa al ${fechaLarga(fecha)}, ${horaTexto(destino.inicio)}.`);
        cerrar(); pintar();
      });
    });
}

/* Registro de faltas y cancelaciones tardías, por persona (M11). */
function conteoFaltas(id) {
  const h = Datos.todo("historial").filter(x => x.personaId === id);
  return {
    faltas: h.filter(x => x.estado === "no_show").length,
    tardias: h.filter(x => x.estado === "cancelada_tarde").length,
    aTiempo: h.filter(x => x.estado === "cancelada_a_tiempo" || x.estado === "cancelada_por_club").length,
  };
}

function panelFaltas() {
  const filas = personas()
    .filter(p => p.rol === "jinete" || p.rol === "propietario")
    .map(p => ({ p, ...conteoFaltas(p.id) }))
    .filter(x => x.faltas || x.tardias)
    .sort((a,b) => (b.faltas + b.tardias) - (a.faltas + a.tardias));
  return `<div class="admin-caja">
    <p class="etiqueta">Faltas y cancelaciones tardías</p>
    <p style="font-size:.82rem; color:var(--oro-tinta)">
      Clases que se cobraron sin haberse dado: no se presentó, o canceló pasado el
      límite de 10 horas.</p>
    ${filas.length ? `<div>${filas.map(x => `<div class="persona">
      <span>${esc(x.p.nombre)}</span>
      <span class="rolp">${x.faltas ? `<span class="pastilla p-alerta">${x.faltas} ${
        x.faltas === 1 ? "falta" : "faltas"}</span>` : ""}
        ${x.tardias ? `<span class="pastilla p-aviso">${x.tardias} tarde</span>` : ""}</span>
      <span style="font-size:.75rem; color:var(--oro-tinta); flex:none">${
        x.faltas + x.tardias} ${x.faltas + x.tardias === 1 ? "cobrada" : "cobradas"}</span>
    </div>`).join("")}</div>`
      : '<p style="font-size:.82rem; color:var(--oro-tinta)">Nadie tiene faltas ni cancelaciones tardías.</p>'}
  </div>`;
}

/* Dirección ajusta una hora del horario semanal. */
function editarRanura(id) {
  const r = ranura(id); if (!r) return;
  const ajuste = (Datos.cache.horarios || {})[id] || {};
  abrirHoja(`${DIAS[r.dia]} a las ${horaTexto(deYmd(ymd(ahora()), r.hora))}`, `
    <form id="form-ranura" style="display:grid; gap:.7rem">
      <label class="campo">Pista<select name="esp">${ESPACIOS.map(e =>
        `<option value="${e.id}" ${r.esp === e.id ? "selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></label>
      <label class="campo">Maestro<select name="ent">${maestros().map(x =>
        `<option value="${x.id}" ${r.ent === x.id ? "selected" : ""}>${esc(x.nombre)}</option>`).join("")}</select></label>
      <label class="campo">Cupo<input type="text" inputmode="numeric" name="cupo" value="${r.cupo}"></label>
      <label style="display:flex; gap:.5rem; align-items:center; font-size:.82rem">
        <input type="checkbox" name="activo" ${r.activo !== false ? "checked" : ""} style="width:auto">
        <span>Esta hora se da</span></label>
      <p style="font-size:.76rem; color:var(--ink-3)">
        El cambio aplica a esta hora de todas las semanas. Las reservas ya hechas no se tocan.</p>
      <button class="btn btn-oro btn-bloque" type="submit">Guardar</button>
      ${Object.keys(ajuste).length ? '<button class="btn btn-2 btn-bloque" type="button" id="quitar-ajuste">Volver al horario original</button>' : ""}
    </form>`,
    cerrar => {
      const q = document.getElementById("quitar-ajuste");
      if (q) q.onclick = async () => {
        try { await Datos.quitar("horarios", id); avisar("Hora restaurada."); }
        catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
        cerrar(); pintar();
      };
      $("#form-ranura").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        try {
          await Datos.poner("horarios", id, {
            esp:String(f.get("esp")), ent:String(f.get("ent")),
            cupo:Math.max(1, parseInt(f.get("cupo"), 10) || 6),
            activo:f.get("activo") === "on",
          });
          avisar("Horario actualizado."); cerrar(); pintar();
        } catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
      });
    });
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ pintado */
const VISTAS = { inicio:verInicio, reservar:verReservar, semana:verSemana, documentos:verDocumentos,
  competencias:verCompetencias, recordatorios:verRecordatorios };
/* La agenda completa del club es solo de dirección. */
const vistasVisibles = () => Object.keys(VISTAS).filter(n => n !== "semana" || esAdmin() || daClases());
const ICONOS = {
  inicio:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>',
  reservar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  documentos:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  competencias:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6M10 17h4l1 3H9z"/>',
  recordatorios:'<path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  semana:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M7 13h3M7 17h3M14 13h3M14 17h3"/>',
};
const ROTULOS = { inicio:"Inicio", reservar:"Reservar", semana:"La semana", documentos:"Documentos",
  competencias:"Competencias", recordatorios:"Recordatorios" };

function avisar(t) {
  const b = $("#brindis"); b.textContent = t; b.hidden = false;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => { b.hidden = true; }, 3800);
}
function abrirHoja(titulo, contenido, alMontar) {
  const capa = $("#capa");
  capa.innerHTML = `<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="hoja-cab"><h3>${esc(titulo)}</h3><button class="cerrar" aria-label="Cerrar">&times;</button></div>
    <div id="hoja-cuerpo">${contenido}</div></div></div>`;
  const cerrar = () => { capa.innerHTML = ""; document.body.style.overflow = ""; };
  document.body.style.overflow = "hidden";
  capa.querySelector(".cerrar").onclick = cerrar;
  capa.querySelector(".velo").onclick = e => { if (e.target === capa.querySelector(".velo")) cerrar(); };
  document.addEventListener("keydown", function fuga(e) {
    if (e.key === "Escape") { cerrar(); document.removeEventListener("keydown", fuga); } });
  if (alMontar) alMontar(cerrar);
  return cerrar;
}

function pintar() {
  refrescarSesion();
  const dentro = haySesion();
  $("#portada").hidden = dentro;
  document.querySelector(".app-head").hidden = !dentro;
  $("#tabs").hidden = !dentro;
  document.querySelector("main").hidden = !dentro;
  document.body.style.paddingBottom = dentro ? "" : "0";
  if (!dentro) return;
  $("#quien-nombre").textContent = cuenta.nombre.split(" ")[0];
  $("#quien-ini").textContent = cuenta.nombre.split(" ").map(p => p[0]).slice(0,2).join("");
  $("#quien-ini").classList.toggle("admin", esAdmin());
  $("#sello").hidden = !esAdmin();

  const visibles = vistasVisibles();
  if (!visibles.includes(vista)) vista = "inicio";
  $("#tabs").innerHTML = visibles.map(n => `<button class="tab" role="tab" data-vista="${n}"
    aria-selected="${n === vista}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]}</svg>${ROTULOS[n]}
    ${n === "documentos" && pendientesDeFirma().length ? '<span class="pip"></span>' : ""}</button>`).join("");
  $("#v-" + vista).innerHTML = VISTAS[vista]();
  for (const n of Object.keys(VISTAS)) $("#v-" + n).hidden = n !== vista;

  $("#pie-datos").textContent = !Datos.listo ? "Conectando…"
    : Datos.compartido
      ? (esAdmin() ? "Almacén compartido · tienes permiso de edición" : "Almacén compartido · solo ves lo tuyo")
      : "Guardado solo en este navegador";
}
function irA(n) { vista = n; pintar(); window.scrollTo({ top:0, behavior:"instant" }); }

/* ------------------------------------------------- editor de personas (admin) */
function editarPersona(id) {
  const p = id ? persona(id) : { nombre:"", rol:"jinete", nivel:"principiantes", menor:false,
    tutorDe:"", propios:[], habilitados:[], clasesCargadas:0, paquete:"" };
  if (!p) return;
  const menores = personas().filter(x => x.menor && x.id !== id);
  const casillas = (campo, fuente) => fuente.map(c => `<label><input type="checkbox" name="${campo}"
    value="${c.id}" ${(p[campo] || []).includes(c.id) ? "checked" : ""}>${esc(c.nombre)}</label>`).join("");
  abrirHoja(id ? "Editar persona" : "Nueva persona", `
    <form id="form-persona" style="display:grid; gap:.7rem">
      <label class="campo">Nombre completo
        <input type="text" name="nombre" required value="${esc(p.nombre)}"></label>
      <div class="dos-campos">
        <label class="campo">Perfil<select name="rol">${
          ["jinete","propietario","tutor","maestro","admin"].map(r =>
            `<option value="${r}" ${p.rol === r ? "selected" : ""}>${ROL_NOMBRE[r]}</option>`).join("")}</select></label>
        <label class="campo">Nivel<select name="nivel">${
          NIVELES.map(n => `<option value="${n.id}" ${p.nivel === n.id ? "selected" : ""}>${n.nombre}</option>`).join("")}</select></label>
      </div>
      <p style="font-size:.76rem; color:var(--oro-tinta); margin-top:-.3rem">
        El nivel no limita horarios —todos están abiertos para cualquier nivel—:
        decide qué caballos puede montar.</p>
      <label style="display:flex; gap:.5rem; align-items:center; font-size:.82rem">
        <input type="checkbox" name="menor" ${p.menor ? "checked" : ""} style="width:auto">
        <span>Es menor de edad — firma su tutor y suma la carta responsiva</span></label>
      <label style="display:flex; gap:.5rem; align-items:center; font-size:.82rem">
        <input type="checkbox" name="imparte" ${p.imparte ? "checked" : ""} style="width:auto">
        <span>Da clases — aparece como maestro al asignar horarios</span></label>
      <label class="campo">Maestro asignado
        <select name="maestroId"><option value="">— todos los maestros —</option>${
          maestros().map(m => `<option value="${m.id}" ${p.maestroId === m.id ? "selected" : ""}>${
            esc(m.nombre)}</option>`).join("")}</select></label>
      <p style="font-size:.76rem; color:var(--oro-tinta); margin-top:-.3rem">
        Solo verá las clases de ese maestro al reservar. Sin asignar, ve las de todos.</p>
      <label class="campo">Si es tutor, ¿de quién?
        <select name="tutorDe"><option value="">— no es tutor —</option>${
          menores.map(m => `<option value="${m.id}" ${p.tutorDe === m.id ? "selected" : ""}>${esc(m.nombre)}</option>`).join("")}</select></label>
      <div class="dos-campos">
        <label class="campo">Clases cargadas
          <input type="text" inputmode="numeric" name="clasesCargadas" value="${p.clasesCargadas || 0}"></label>
        <label class="campo">Paquete<select name="paqueteId" id="sel-paquete">
          <option value="">— sin paquete —</option>${paquetes().map(q =>
            `<option value="${q.id}" data-clases="${q.clases}" ${p.paqueteId === q.id ? "selected" : ""}>${
              esc(q.nombre)}</option>`).join("")}</select></label>
      </div>
      <div class="dos-campos">
        <label class="campo">Usuario para entrar
          <input type="text" name="usuario" autocapitalize="none" spellcheck="false"
            value="${esc(p.usuario || "")}" placeholder="sin usuario, no entra"></label>
        <label class="campo">${id ? "Contraseña nueva (en blanco = no cambia)" : "Contraseña"}
          <input type="text" name="clave" autocomplete="off" placeholder="${id && p.clave ? "sin cambios" : ""}"></label>
      </div>
      <p style="font-size:.76rem; color:var(--oro-tinta); margin-top:-.3rem">
        Un menor no lleva usuario: entra su tutor. La contraseña se guarda como huella,
        no en claro, pero se comprueba en el navegador: no la uses para nada delicado.</p>
      <div class="campo">Caballos propios (lo vuelven propietario)
        <div class="casillas">${casillas("propios", caballos().filter(c => c.uso === "propietario"))}</div></div>
      <div class="campo">Caballos desbloqueados (solo para jinetes de escuela)
        <div class="casillas">${casillas("habilitados", caballosDeEscuela())}</div></div>
      <button class="btn btn-oro btn-bloque" type="submit">${id ? "Guardar" : "Crear persona"}</button>
      ${id ? '<button class="btn btn-2 btn-bloque" type="button" id="borrar-persona">Dar de baja</button>' : ""}
    </form>`,
    cerrar => {
      /* Elegir paquete rellena las clases cargadas; el número sigue siendo editable. */
      const sel = $("#sel-paquete");
      if (sel) sel.addEventListener("change", () => {
        const op = sel.selectedOptions[0];
        if (op && op.dataset.clases) $("#form-persona [name=clasesCargadas]").value = op.dataset.clases;
      });
      if (id) $("#borrar-persona").onclick = async () => {
        try { await Datos.quitar("personas", id); avisar("Persona dada de baja."); }
        catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
        cerrar(); pintar();
      };
      $("#form-persona").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        const nombre = String(f.get("nombre")).trim();
        const nuevoId = id || nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "p-" + Date.now();
        const menor = f.get("menor") === "on";
        const claveNueva = String(f.get("clave") || "").trim();
        const datos = {
          nombre, rol:String(f.get("rol")), nivel:String(f.get("nivel")),
          menor, sinCuenta:menor, tutorDe:String(f.get("tutorDe") || ""),
          clasesCargadas:Math.max(0, parseInt(f.get("clasesCargadas"), 10) || 0),
          paqueteId:String(f.get("paqueteId") || ""),
          paquete:(paquete(String(f.get("paqueteId") || "")) || {}).nombre || "",
          usuario:menor ? "" : String(f.get("usuario") || "").trim().toLowerCase(),
          imparte:f.get("imparte") === "on",
          maestroId:String(f.get("maestroId") || ""),
          clave:claveNueva ? await huella(claveNueva) : (p.clave || ""),
          propios:f.getAll("propios"), habilitados:f.getAll("habilitados"),
        };
        try {
          await Datos.poner("personas", nuevoId, datos);
          avisar(id ? "Persona actualizada." : "Persona creada.");
          cerrar(); pintar();
        } catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
      });
    });
}

/* --------------------------------------------------- editor de competencias */
function editarCompetencia(id) {
  const c = id ? competencia(id) : { nombre:"", inicio:"", fin:"", sede:"", disciplina:"Salto",
    categorias:[], horarios:[], cierre:"", nota:"" };
  if (!c) return;
  abrirHoja(id ? "Editar competencia" : "Nueva competencia", `
    <form id="form-comp" style="display:grid; gap:.7rem">
      <label class="campo">Nombre<input type="text" name="nombre" required value="${esc(c.nombre)}"></label>
      <div class="dos-campos">
        <label class="campo">Primer día<input type="date" name="inicio" required value="${esc(c.inicio)}"></label>
        <label class="campo">Último día<input type="date" name="fin" value="${esc(c.fin || "")}"></label></div>
      <div class="dos-campos">
        <label class="campo">Sede<input type="text" name="sede" value="${esc(c.sede || "")}"></label>
        <label class="campo">Disciplina<input type="text" name="disciplina" value="${esc(c.disciplina || "")}"></label></div>
      <label class="campo">Cierre de inscripciones<input type="date" name="cierre" value="${esc(c.cierre || "")}"></label>
      <label class="campo">Categorías, una por línea
        <textarea name="categorias" placeholder="0.60 m&#10;0.80 m&#10;1.00 m">${esc((c.categorias || []).join("\n"))}</textarea></label>
      <label class="campo">Horarios, una línea por prueba — separa con guión largo
        <textarea name="horarios" placeholder="Jueves 17 — Reconocimiento de pista, 8:00 a.m.">${esc((c.horarios || []).join("\n"))}</textarea></label>
      <label class="campo">Nota para los jinetes
        <textarea name="nota" style="min-height:3rem">${esc(c.nota || "")}</textarea></label>
      <button class="btn btn-oro btn-bloque" type="submit">${id ? "Guardar cambios" : "Crear competencia"}</button>
    </form>`,
    cerrar => {
      $("#form-comp").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        const nombre = String(f.get("nombre")).trim();
        const nuevoId = id || nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "comp-" + Date.now();
        const lineas = v => String(f.get(v) || "").split("\n").map(x => x.trim()).filter(Boolean);
        try {
          await Datos.poner("competencias", nuevoId, {
            nombre, inicio:String(f.get("inicio")), fin:String(f.get("fin") || ""),
            sede:String(f.get("sede") || ""), disciplina:String(f.get("disciplina") || ""),
            cierre:String(f.get("cierre") || ""), categorias:lineas("categorias"),
            horarios:lineas("horarios"), nota:String(f.get("nota") || ""),
          });
          avisar(id ? "Competencia actualizada." : "Competencia creada."); cerrar(); pintar();
        } catch (e) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
      });
    });
}

function anotarse(compId) {
  const c = competencia(compId);
  const cats = c.categorias || [];
  if (!cats.length) return guardarInscripcion(compId, "");
  abrirHoja("Anotarse a " + c.nombre, `
    <p style="font-size:.85rem; color:var(--ink-2)">Elige la categoría en la que quieres competir.</p>
    <div class="vista" id="cats">${cats.map(x =>
      `<button class="opcion" data-cat="${esc(x)}" aria-pressed="false"><span class="n">${esc(x)}</span></button>`).join("")}</div>
    <button class="btn btn-bloque" id="ok-anotar" disabled>Anotarme</button>`,
    cerrar => {
      let elegida = null;
      $("#cats").addEventListener("click", e => {
        const b = e.target.closest("[data-cat]"); if (!b) return;
        elegida = b.dataset.cat;
        $("#cats").querySelectorAll(".opcion").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        $("#ok-anotar").disabled = false;
      });
      $("#ok-anotar").onclick = async () => { await guardarInscripcion(compId, elegida); cerrar(); };
    });
}
async function guardarInscripcion(compId, categoria) {
  await Datos.poner("inscripciones", `${compId}__${sujeto.id}`,
    { personaId:sujeto.id, competenciaId:compId, categoria, cuando:new Date().toISOString() });
  avisar("Anotado. Dirección confirma la inscripción en oficinas."); pintar();
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ eventos */
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (t) irA(t.dataset.vista);
});

document.addEventListener("click", async e => {
  const ir = e.target.closest("[data-ir]");              if (ir) return irA(ir.dataset.ir);
  const dia = e.target.closest("[data-dia]");            if (dia) { diaSel = dia.dataset.dia; return pintar(); }
  const res = e.target.closest("[data-reservar]");       if (res) return elegirCaballo(res.dataset.reservar);
  const can = e.target.closest("[data-cancelar]");       if (can) return cancelar(can.dataset.cancelar);
  const nuevaC = e.target.closest("[data-nueva-comp]");  if (nuevaC) return editarCompetencia(null);
  const ediC = e.target.closest("[data-editar-comp]");   if (ediC) return editarCompetencia(ediC.dataset.editarComp);
  const nuevaP = e.target.closest("[data-nueva-persona]"); if (nuevaP) return editarPersona(null);
  const aj = e.target.closest("[data-ajustar]");          if (aj) return ajustarReserva(aj.dataset.ajustar);
  const ran = e.target.closest("[data-ranura]");          if (ran) return editarRanura(ran.dataset.ranura);
  const nuevoQ = e.target.closest("[data-nuevo-paquete]"); if (nuevoQ) return editarPaquete(null);
  const ediQ = e.target.closest("[data-editar-paquete]"); if (ediQ) return editarPaquete(ediQ.dataset.editarPaquete);
  const nuevoC = e.target.closest("[data-nuevo-caballo]"); if (nuevoC) return editarCaballo(null);
  const ediCab = e.target.closest("[data-editar-caballo]"); if (ediCab) return editarCaballo(ediCab.dataset.editarCaballo);
  const nuevoD = e.target.closest("[data-nuevo-doc]");    if (nuevoD) return editarDocumento(null);
  const ediD = e.target.closest("[data-editar-doc]");     if (ediD) return editarDocumento(ediD.dataset.editarDoc);
  const nuevoA = e.target.closest("[data-nuevo-anuncio]"); if (nuevoA) return editarAnuncio(null);
  const ediA = e.target.closest("[data-editar-anuncio]"); if (ediA) return editarAnuncio(ediA.dataset.editarAnuncio);
  const bd = e.target.closest("[data-borrar-doc]");
  if (bd) {
    const d = documento(bd.dataset.borrarDoc);
    return abrirHoja("Borrar documento", `
      <p style="font-size:.9rem">Se quita <b>${esc(d.titulo)}</b> y las firmas que ya tiene dejan de contar.</p>
      <button class="btn btn-peligro btn-bloque" id="ok-bd">Borrar</button>`,
      cerrar => { $("#ok-bd").onclick = async () => {
        try { await Datos.quitar("documentos", d.id); avisar("Documento borrado."); }
        catch (err) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
        cerrar(); pintar(); }; });
  }
  const alt = e.target.closest("[data-alternar-mias]");
  if (alt) { soloMisClases = !soloMisClases; return pintar(); }
  const sem = e.target.closest("[data-semana]");
  if (sem) { semanaOffset += Number(sem.dataset.semana); diaSemanaSel = ""; return pintar(); }
  const ds = e.target.closest("[data-diasemana]");
  if (ds) { diaSemanaSel = ds.dataset.diasemana; return pintar(); }
  const ediP = e.target.closest("[data-editar-persona]"); if (ediP) return editarPersona(ediP.dataset.editarPersona);

  const bc = e.target.closest("[data-borrar-comp]");
  if (bc) {
    const c = competencia(bc.dataset.borrarComp);
    return abrirHoja("Borrar competencia", `
      <p style="font-size:.9rem">Se quita <b>${esc(c.nombre)}</b> del calendario y con ella la lista de anotados.</p>
      <button class="btn btn-peligro btn-bloque" id="ok-bc">Borrar</button>`,
      cerrar => { $("#ok-bc").onclick = async () => {
        try {
          for (const i of Datos.todo("inscripciones").filter(x => x.competenciaId === c.id))
            await Datos.quitar("inscripciones", i.id);
          await Datos.quitar("competencias", c.id); avisar("Competencia borrada.");
        } catch (err) { avisar("El almacén lo rechazó: no tienes permiso de edición."); }
        cerrar(); pintar(); }; });
  }

  const comp = e.target.closest("[data-comp]");
  if (comp) {
    const mia = inscritoEn(comp.dataset.comp);
    if (mia) { await Datos.quitar("inscripciones", mia.id); avisar("Te quitamos de la lista."); return pintar(); }
    return anotarse(comp.dataset.comp);
  }
  const hecho = e.target.closest("[data-hecho]");
  if (hecho) {
    const r = misRecordatorios().find(x => x.id === hecho.dataset.hecho);
    if (r) { const { id, ...resto } = r; await Datos.poner("recordatorios", id, { ...resto, hecho: !r.hecho }); }
    return pintar();
  }
  const brec = e.target.closest("[data-borrar-rec]");
  if (brec) { await Datos.quitar("recordatorios", brec.dataset.borrarRec); return pintar(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "chk-direccion") {
    localStorage.setItem("cq:direccion", e.target.checked ? "1" : "0");
    avisar(e.target.checked ? "Modo dirección activo." : "Modo dirección apagado.");
    return pintar();
  }
  const pool = e.target.closest("[data-escuela]");
  if (pool) {
    localStorage.setItem("cq:escuela:" + pool.dataset.escuela, pool.checked ? "1" : "0");
    avisar(pool.checked ? "Autorizado para el pool de escuela." : "Retirado del pool de escuela.");
  }
});

document.addEventListener("submit", async e => {
  if (["form-comp","form-persona","form-ranura","form-doc","form-anuncio","form-entrar","form-caballo","form-paquete"].includes(e.target.id)) return;
  e.preventDefault();
  if (e.target.id === "nuevo-rec") {
    const f = new FormData(e.target);
    const texto = String(f.get("texto") || "").trim(); if (!texto) return;
    await Datos.poner("recordatorios", "r-" + Date.now().toString(36) + "-" + sujeto.id,
      { personaId:sujeto.id, texto, fecha:f.get("fecha") || "", hecho:false });
    avisar("Recordatorio agregado."); return pintar();
  }
  const firmar = e.target.dataset.firmar;
  if (firmar) {
    const d = documento(firmar);
    const nombre = String(new FormData(e.target).get("nombre") || "").trim();
    if (nombre.length < 4) return avisar("Escribe el nombre completo.");
    const cuando = ahora();
    await Datos.poner("aceptaciones", `${sujeto.id}__${d.id}__${d.version}`, {
      personaId:sujeto.id, firmadaPor:cuenta.id, documentoId:d.id, version:d.version,
      nombreFirma:nombre, fecha:ymd(cuando), horaTexto:horaTexto(cuando), sello:cuando.toISOString() });
    avisar(`${d.titulo} aceptado.`); return pintar();
  }
});

/* ------------------------------------------------------- reservar y cancelar */
function elegirCaballo(sesionId) {
  const i = sesionId.indexOf("__");
  const fecha = sesionId.slice(0, i), plantillaId = sesionId.slice(i + 2);
  const s = sesionesDe(fecha).find(x => x.plantillaId === plantillaId); if (!s) return;
  const opciones = caballosPara(s);
  const unico = opciones.length === 1;
  abrirHoja("Clase de " + horaTexto(s.inicio), `
    <p style="font-size:.85rem; color:var(--ink-2)">${esc(fechaLarga(fecha))} · ${esc(horaTexto(s.inicio))} ·
      ${esc(entrenador(s.ent))} · ${esc(espacio(s.esp))}</p>
    <p class="etiqueta">${montaPropios()
      ? (unico ? "Tu caballo" : "Elige cuál de tus caballos")
      : "Elige caballo, de los que te desbloquearon"}</p>
    <div class="vista" id="lista-caballos">${opciones.map(c => `
      <button class="opcion" data-caballo="${c.id}" aria-pressed="${unico}">
        <span class="ini" aria-hidden="true">${esc(c.nombre[0])}</span>
        <span><span class="n">${esc(c.nombre)}</span>
          <span class="m"><span class="pastilla ${claseNivel(c.min)}">${esc(nivelNombre(c.min))}</span>
            a <span class="pastilla ${claseNivel(c.max)}">${esc(nivelNombre(c.max))}</span></span></span>
        <span class="carga">${c.trabajadas}/${c.maxDia}<br>hoy</span></button>`).join("")}</div>
    <div class="nota">Se descuenta <b>${tipo(s.tipoId).consume}</b> del saldo.
      Cancelación sin costo hasta <b>${esc(momentoTexto(limiteCancelacion(s.inicio)))}</b>.</div>
    <button class="btn btn-bloque" id="confirmar" ${unico ? "" : "disabled"}>Confirmar reserva</button>`,
    cerrar => {
      let elegido = unico ? opciones[0].id : null;
      const btn = $("#confirmar");
      $("#lista-caballos").addEventListener("click", ev => {
        const b = ev.target.closest("[data-caballo]"); if (!b) return;
        elegido = b.dataset.caballo;
        $("#lista-caballos").querySelectorAll(".opcion").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        btn.disabled = false;
      });
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = "Apartando…";
        if (await confirmarReserva(s, elegido)) cerrar();
        else { btn.disabled = false; btn.textContent = "Confirmar reserva"; }
      };
    });
}

async function confirmarReserva(s, caballoId) {
  const motivo = motivoBloqueo(s);
  if (motivo) { avisar(motivo); return false; }
  const id = `${s.fecha}__${s.plantillaId}__${caballoId}`;
  const gano = await Datos.apartar("reservas", id, {
    personaId:sujeto.id, reservadaPor:cuenta.id, fecha:s.fecha,
    hora:ranura(s.plantillaId).hora, plantillaId:s.plantillaId,
    caballoId, tipoId:s.tipoId, ent:s.ent, esp:s.esp, consume:tipo(s.tipoId).consume,
    creada:new Date().toISOString(), override:!estadoVentana().abierta,
  }, idTab);
  if (!gano) { avisar(`${caballo(caballoId).nombre} lo acaba de apartar alguien más.`); pintar(); return false; }
  avisar(`Listo. Cancelación sin costo hasta ${momentoTexto(limiteCancelacion(s.inicio))}`);
  pintar(); return true;
}

async function cancelar(reservaId) {
  const r = Datos.todo("reservas").find(x => x.id === reservaId); if (!r) return;
  const inicio = deYmd(r.fecha, r.hora);
  const aTiempo = seCancelaSinCosto(inicio);
  abrirHoja("Cancelar clase", `
    <p style="font-size:.9rem">${esc(fechaLarga(r.fecha))} · ${esc(horaTexto(inicio))} ·
      ${esc(caballo(r.caballoId) ? caballo(r.caballoId).nombre : "—")}</p>
    <div class="nota ${aTiempo ? "" : "alerta"}">${aTiempo
      ? "Se devuelve la clase al saldo."
      : "Pasó el límite de 10 horas: la clase se cobra igual y no vuelve al saldo."}</div>
    <button class="btn btn-bloque ${aTiempo ? "" : "btn-peligro"}" id="ok-cancelar">
      ${aTiempo ? "Cancelar y recuperar la clase" : "Cancelar de todos modos"}</button>
    <button class="btn btn-2 btn-bloque" id="no-cancelar">Mejor no</button>`,
    cerrar => {
      $("#no-cancelar").onclick = cerrar;
      $("#ok-cancelar").onclick = async () => {
        await Datos.poner("historial", "h-" + r.id + "-" + Date.now(), {
          personaId:r.personaId, fecha:r.fecha, hora:r.hora, caballoId:r.caballoId, tipoId:r.tipoId,
          consume:r.consume || 1, estado:aTiempo ? "cancelada_a_tiempo" : "cancelada_tarde",
          cobrada:!aTiempo, cuando:new Date().toISOString() });
        await Datos.quitar("reservas", r.id);
        avisar(aTiempo ? "Clase cancelada y devuelta al saldo." : "Clase cancelada. Se cobra.");
        cerrar(); pintar();
      };
    });
}

/* -------------------------------------------------------------------- cuenta */
$("#btn-quien").addEventListener("click", () => {
  const menor = cuenta.tutorDe ? persona(cuenta.tutorDe) : null;
  const mios = docsDe(menor || cuenta);
  abrirHoja("Tu cuenta", `
    <div class="tarjeta plana" style="display:grid; gap:.35rem">
      <p style="font-family:var(--serif); font-size:1.35rem">${esc(cuenta.nombre)}</p>
      <p style="font-size:.82rem; color:var(--ink-2)">${esc(ROL_NOMBRE[cuenta.rol])}${
        menor ? ` · manejas la cuenta de ${esc(menor.nombre)}` : ""}</p>
      <p style="font-size:.78rem; color:var(--ink-3)">Usuario: ${esc(cuenta.usuario || "—")}</p>
      ${esAdmin() ? '<p style="font-size:.78rem; color:var(--ink-3)">Acceso total. No firmas documentos.</p>'
        : `<p style="font-size:.78rem; color:var(--ink-3)">
            ${saldo()} clases disponibles · ${mios.length} documentos que firmar</p>`}
    </div>
    ${esAdmin() && !Datos.esEditor ? `<div class="nota alerta">
      Entraste como dirección, pero esta página no te ha dado permiso de edición: puedes
      ver todo y los cambios al catálogo se van a rechazar. Pide que te compartan la
      página con permiso de edición.</div>` : ""}
    <div class="nota">Solo ves tu información${esAdmin() ? "" : " y la de nadie más"}.
      Para cambiar tu contraseña, pídeselo a dirección.</div>
    <button class="btn btn-2 btn-bloque" id="btn-salir">Cerrar sesión</button>`,
    cerrar => { $("#btn-salir").onclick = () => { cerrar(); salir(); }; });
});

$("#btn-reiniciar").addEventListener("click", () => {
  abrirHoja("Borrar datos de prueba", `
    <p style="font-size:.88rem">Se borran reservas, firmas, recordatorios e inscripciones
      guardadas en este navegador.${Datos.compartido ? " Lo del almacén compartido no se toca." : ""}</p>
    <button class="btn btn-peligro btn-bloque" id="ok-borrar">Borrar</button>`,
    cerrar => { $("#ok-borrar").onclick = async () => {
      await Datos.limpiarLocal(); localStorage.removeItem("cq:direccion");
      cerrar(); avisar("Datos locales borrados."); pintar(); }; });
});

$("#form-entrar").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Entrando…";
  const ok = await entrar(f.get("usuario"), f.get("clave"));
  btn.disabled = false; btn.textContent = "Entrar";
  $("#acceso-error").hidden = ok;
  if (ok) { e.target.reset(); vista = "inicio"; pintar(); }
});

/* ------------------------------------------------------------------ arranque */
Datos.alCambiar = () => pintar();
Datos.sembrarLocal();
pintar();
Datos.iniciar();
setInterval(pintar, 60000);
</script>
