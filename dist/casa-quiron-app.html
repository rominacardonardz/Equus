<title>Casa Quirón · Reservas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   Casa Quirón — app de reservas. Azules y dorados.
   Todos los colores son tokens: al llegar el manual de marca (§08) se
   cambian aquí y en ningún otro lado.
   ========================================================================== */
:root {
  --azul:#1B3A5F; --azul-medio:#2E5C8A; --azul-claro:#8FB4E0;
  --oro:#C9A227; --oro-tinta:#8A6A15;

  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E9EFF7;
  --ink:#0F1A2B; --ink-2:#4A5670; --ink-3:#7B869C;
  --line:#D9E2EE; --line-fuerte:#BFCCDF;
  --accent:var(--azul); --accent-2:var(--oro-tinta); --on-accent:#FFFFFF;
  --oro-fondo:#F6ECC9; --oro-borde:#E0C878;

  --ok:#1F6B4F; --ok-bg:#DFF0E7;
  --alerta:#A33227; --alerta-bg:#FBE6E2;
  --aviso:#7A5A10; --aviso-bg:#FAF0D4;

  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --r:14px; --r-sm:9px;
  --sombra:0 1px 2px rgba(15,26,43,.05), 0 10px 28px -22px rgba(15,26,43,.5);
  --nav-h:4.6rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0A1120; --surface:#121C2C; --surface-2:#1A2536;
    --ink:#E9EEF7; --ink-2:#A6B2C7; --ink-3:#76829A;
    --line:#243043; --line-fuerte:#35435C;
    --accent:#8FB4E0; --accent-2:#D6AE4A; --on-accent:#0A1120;
    --oro-fondo:#2A2313; --oro-borde:#5C4B1C;
    --ok:#7FC7A4; --ok-bg:#12281F;
    --alerta:#E9A08D; --alerta-bg:#331B18;
    --aviso:#D9B95C; --aviso-bg:#2C2513;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  --bg:#0A1120; --surface:#121C2C; --surface-2:#1A2536;
  --ink:#E9EEF7; --ink-2:#A6B2C7; --ink-3:#76829A;
  --line:#243043; --line-fuerte:#35435C;
  --accent:#8FB4E0; --accent-2:#D6AE4A; --on-accent:#0A1120;
  --oro-fondo:#2A2313; --oro-borde:#5C4B1C;
  --ok:#7FC7A4; --ok-bg:#12281F;
  --alerta:#E9A08D; --alerta-bg:#331B18;
  --aviso:#D9B95C; --aviso-bg:#2C2513;
}

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.15; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--oro); outline-offset:2px; border-radius:6px}
[hidden]{display:none!important}

/* ---------- encabezado ---------- */
.app-head{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:.75rem;
  padding:.6rem 1rem; background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.marca{display:flex; align-items:center; gap:.55rem; margin-right:auto; min-width:0}
.mono-q{
  display:grid; place-items:center; width:2rem; height:2rem; border-radius:7px; flex:none;
  background:var(--azul); color:var(--oro);
  font-family:var(--serif); font-size:1.2rem; line-height:1; padding-bottom:.1rem;
}
.marca b{font-family:var(--serif); font-size:1.05rem; letter-spacing:.03em; font-weight:600}
.quien{
  display:flex; align-items:center; gap:.45rem; flex:none;
  border:1px solid var(--line-fuerte); border-radius:999px;
  padding:.3rem .65rem .3rem .35rem; font-size:.82rem; background:var(--surface);
}
.avatar{
  display:grid; place-items:center; width:1.55rem; height:1.55rem; border-radius:50%;
  background:var(--azul-medio); color:#fff; font-size:.68rem; font-weight:600;
}
.avatar.admin{background:var(--oro); color:var(--azul)}
.sello-admin{
  font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  color:var(--oro-tinta); background:var(--oro-fondo); border:1px solid var(--oro-borde);
  padding:.1rem .35rem; border-radius:4px;
}

/* ---------- navegación ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(10px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
  padding:.6rem .15rem .55rem; font-size:.63rem; letter-spacing:.01em;
  color:var(--ink-3); border-top:2px solid transparent; margin-top:-1px;
}
.tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent); border-top-color:var(--accent)}
.tab .pip{
  position:absolute; top:.45rem; left:calc(50% + .5rem);
  width:7px; height:7px; border-radius:50%; background:var(--alerta); border:1.5px solid var(--surface);
}

/* ---------- estructura ---------- */
main{padding:1rem 1rem 2rem; max-width:44rem; margin:0 auto}
.vista{display:grid; gap:1rem}
.vista-titulo{display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; flex-wrap:wrap}
.vista-titulo h2{font-size:1.65rem}
.vista-titulo .sub{font-size:.8rem; color:var(--ink-3)}

.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.tarjeta.plana{background:var(--surface-2)}
.tarjeta h3{font-size:1.15rem; margin-bottom:.15rem}
.etiqueta{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:500}

.pastilla{
  display:inline-flex; align-items:center; gap:.3rem;
  font-size:.7rem; font-weight:600; padding:.2rem .5rem; border-radius:999px; white-space:nowrap;
}
.p-ok{background:var(--ok-bg); color:var(--ok)}
.p-alerta{background:var(--alerta-bg); color:var(--alerta)}
.p-oro{background:var(--oro-fondo); color:var(--oro-tinta); border:1px solid var(--oro-borde)}
.p-neutro{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--accent); color:var(--on-accent);
  border-radius:10px; padding:.6rem 1rem; font-size:.88rem; font-weight:600;
  transition:filter .15s ease;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-2{background:var(--surface); color:var(--ink); border:1px solid var(--line-fuerte); font-weight:500}
.btn-oro{background:var(--oro); color:var(--azul)}
.btn-peligro{background:none; color:var(--alerta); border:1px solid var(--alerta); font-weight:500}
.btn-bloque{width:100%}
.btn-mini{padding:.35rem .7rem; font-size:.78rem; border-radius:8px}

input[type="text"],input[type="date"],textarea,select{
  width:100%; font:inherit; font-size:.9rem; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-fuerte);
  border-radius:9px; padding:.55rem .7rem;
}
textarea{resize:vertical; min-height:4.5rem; font-size:.85rem}
label.campo{display:grid; gap:.3rem; font-size:.78rem; color:var(--ink-2)}
.dos-campos{display:grid; gap:.6rem}
@media (min-width:30rem){.dos-campos{grid-template-columns:1fr 1fr}}

.vacio{
  text-align:center; padding:2rem 1rem; color:var(--ink-3);
  border:1px dashed var(--line-fuerte); border-radius:var(--r); font-size:.9rem;
}

/* ---------- inicio ---------- */
.resumen{display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem}
.dato{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.85rem}
.dato .n{font-family:var(--serif); font-size:2rem; line-height:1; font-variant-numeric:tabular-nums}
.dato .n.chico{font-size:1.25rem}
.dato .t{font-size:.72rem; color:var(--ink-3); margin-top:.25rem}

.clase{
  display:grid; gap:.5rem; background:var(--surface);
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:.9rem 1rem;
}
.clase.pasada{border-left-color:var(--line-fuerte); opacity:.72}
.clase-cab{display:flex; align-items:baseline; justify-content:space-between; gap:.6rem}
.clase-hora{font-family:var(--serif); font-size:1.3rem; font-variant-numeric:tabular-nums}
.clase-meta{font-size:.82rem; color:var(--ink-2)}
.clase-pie{display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap;
  border-top:1px solid var(--line); padding-top:.55rem; font-size:.78rem; color:var(--ink-3)}
.limite b{color:var(--ink); font-weight:600}

/* ---------- caballo del propietario ---------- */
.ficha{display:grid; gap:.75rem; background:var(--surface); border:1px solid var(--line);
  border-top:3px solid var(--oro); border-radius:var(--r); padding:1rem}
.ficha-cab{display:flex; align-items:center; gap:.85rem}
.ficha-ini{display:grid; place-items:center; width:3rem; height:3rem; border-radius:50%; flex:none;
  background:var(--azul); color:var(--oro); font-family:var(--serif); font-size:1.4rem}
.ficha-datos{display:grid; gap:.3rem; font-size:.82rem; border-top:1px solid var(--line); padding-top:.6rem}
.ficha-datos div{display:grid; grid-template-columns:7.5rem 1fr; gap:.5rem}
.ficha-datos dt{color:var(--ink-3)}

/* ---------- reservar ---------- */
.ventana{display:grid; gap:.5rem; padding:.9rem 1rem; border-radius:var(--r);
  background:var(--surface-2); border:1px solid var(--line)}
.ventana.abierta{background:var(--ok-bg); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.ventana.cerrada{background:var(--aviso-bg); border-color:color-mix(in srgb,var(--aviso) 32%,transparent)}
.ventana .titulo{font-weight:600; font-size:.92rem}
.ventana .detalle{font-size:.82rem; color:var(--ink-2)}

.dias{display:grid; grid-template-columns:repeat(7,1fr); gap:.35rem}
.dia{display:grid; gap:.1rem; justify-items:center; padding:.5rem .1rem;
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  font-size:.7rem; color:var(--ink-3)}
.dia .d{font-family:var(--serif); font-size:1.15rem; color:var(--ink); font-variant-numeric:tabular-nums}
.dia[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.dia[aria-pressed="true"] .d{color:var(--on-accent)}
.dia .punto{width:4px; height:4px; border-radius:50%; background:var(--oro)}

.sesion{display:grid; grid-template-columns:4.6rem 1fr; gap:.1rem .8rem; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.85rem 1rem}
.sesion .hora{grid-row:1 / span 2; align-self:start; padding-top:.1rem;
  font-family:var(--serif); font-size:1.2rem; line-height:1.2; font-variant-numeric:tabular-nums}
.sesion .nom{font-weight:600; font-size:.95rem}
.sesion .det{font-size:.78rem; color:var(--ink-2); grid-column:2}
.sesion .accion{grid-column:1 / -1; display:flex; justify-content:flex-end; margin-top:.6rem}
.sesion.llena{opacity:.6}
@media (min-width:34rem){
  .sesion{grid-template-columns:4.6rem 1fr auto}
  .sesion .accion{grid-column:3; grid-row:1 / span 2; margin:0}
}

/* ---------- hoja modal ---------- */
.velo{position:fixed; inset:0; z-index:40; background:rgba(8,14,26,.55); display:grid; align-items:end}
@media (min-width:40rem){.velo{align-items:center; justify-items:center}}
.hoja{width:100%; max-height:88vh; overflow-y:auto;
  background:var(--bg); border-radius:18px 18px 0 0; padding:1.1rem 1rem 1.5rem;
  display:grid; gap:.85rem}
@media (min-width:40rem){.hoja{max-width:32rem; border-radius:18px}}
.hoja-cab{display:flex; align-items:flex-start; justify-content:space-between; gap:1rem}
.hoja-cab h3{font-size:1.3rem}
.cerrar{font-size:1.4rem; line-height:1; color:var(--ink-3); padding:.1rem .4rem}

.opcion{display:flex; align-items:center; gap:.75rem; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.7rem .85rem}
.opcion[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.opcion .ini{display:grid; place-items:center; width:2.4rem; height:2.4rem; border-radius:50%; flex:none;
  background:var(--surface-2); border:1px solid var(--line); font-family:var(--serif); font-size:1.1rem}
.opcion .n{font-weight:600; font-size:.92rem; display:block}
.opcion .m{font-size:.74rem; color:var(--ink-3); display:block}
.opcion .carga{margin-left:auto; font-size:.7rem; color:var(--ink-3); text-align:right; flex:none}

/* ---------- documentos ---------- */
.doc{display:grid; gap:.6rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.doc-cab{display:flex; align-items:flex-start; justify-content:space-between; gap:.75rem}
.doc-ver{font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.doc-cuerpo{font-size:.88rem; color:var(--ink-2); display:grid; gap:.5rem}
.doc-cuerpo h4{font-family:var(--sans); font-size:.8rem; font-weight:600; color:var(--ink); margin:.3rem 0 0}
.doc-cuerpo ul{margin:0; padding-left:1.1rem; display:grid; gap:.25rem}
.firma{display:grid; gap:.55rem; border-top:1px solid var(--line); padding-top:.75rem}
.firmado{font-size:.78rem; color:var(--ok)}

/* ---------- competencias ---------- */
.comp{display:grid; gap:.6rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.comp-fecha{display:grid; justify-items:center; width:3.4rem; padding:.35rem 0; flex:none;
  background:var(--azul); color:var(--oro); border-radius:10px; line-height:1.1}
.comp-fecha .d{font-family:var(--serif); font-size:1.15rem}
.comp-fecha .m{font-size:.58rem; letter-spacing:.09em; text-transform:uppercase}
.comp-cab{display:flex; gap:.85rem; align-items:flex-start}
.comp-cab h3{font-size:1.15rem}
.comp-bloque{border-top:1px solid var(--line); padding-top:.6rem; display:grid; gap:.35rem}
.comp-bloque .etiqueta{margin-bottom:.1rem}
.fichas{display:flex; flex-wrap:wrap; gap:.35rem}
.ficha-cat{font-size:.75rem; padding:.2rem .55rem; border-radius:7px;
  background:var(--oro-fondo); border:1px solid var(--oro-borde); color:var(--oro-tinta)}
.horario{font-size:.8rem; color:var(--ink-2); display:grid; gap:.2rem}
.horario div{display:grid; grid-template-columns:auto 1fr; gap:.5rem}
.horario b{font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.por-definir{font-size:.8rem; color:var(--ink-3); font-style:italic}

.admin-caja{border:1px solid var(--oro-borde); background:var(--oro-fondo); border-radius:var(--r); padding:.85rem; display:grid; gap:.6rem}
.admin-caja .etiqueta{color:var(--oro-tinta)}
.anotado{display:flex; align-items:center; gap:.6rem; font-size:.83rem; padding:.35rem 0; border-top:1px solid var(--oro-borde)}
.anotado:first-of-type{border-top:0}
.anotado .cat{margin-left:auto; font-size:.72rem; color:var(--oro-tinta)}
.acciones-admin{display:flex; gap:.5rem; flex-wrap:wrap}

/* ---------- recordatorios ---------- */
.rec{display:flex; align-items:flex-start; gap:.7rem;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.8rem .9rem}
.rec.auto{background:var(--surface-2); border-style:dashed}
.rec.vencido{border-left:3px solid var(--alerta)}
.rec .txt{flex:1; min-width:0}
.rec .txt .t{font-size:.9rem; font-weight:500}
.rec .txt .f{font-size:.75rem; color:var(--ink-3); margin-top:.1rem}
.rec.hecho .txt .t{text-decoration:line-through; color:var(--ink-3); font-weight:400}
.marcar{width:1.35rem; height:1.35rem; flex:none; margin-top:.15rem;
  border:1.5px solid var(--line-fuerte); border-radius:6px; display:grid; place-items:center}
.marcar[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.marcar svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}

/* ---------- avisos ---------- */
.nota{display:grid; gap:.3rem; padding:.75rem .9rem; border-radius:var(--r-sm);
  font-size:.82rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2)}
.nota b{color:var(--ink)}
.nota.alerta{background:var(--alerta-bg); border-color:color-mix(in srgb,var(--alerta) 30%,transparent); color:var(--alerta)}
.nota.alerta b{color:var(--alerta)}
.nota.oro{background:var(--oro-fondo); border-color:var(--oro-borde); color:var(--oro-tinta)}
.nota.oro b{color:var(--oro-tinta)}

.brindis{position:fixed; left:50%; bottom:calc(var(--nav-h) + 1rem); transform:translateX(-50%);
  z-index:50; max-width:min(24rem,92vw); background:var(--azul); color:#fff;
  padding:.7rem 1rem; border-radius:11px; font-size:.85rem; box-shadow:var(--sombra)}

.pie{max-width:44rem; margin:1.5rem auto 0; padding:1.2rem 1rem 0;
  border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-3); text-align:center;
  display:grid; gap:.35rem}
.pie button{text-decoration:underline; font-size:.72rem; color:var(--ink-3)}

@media (min-width:56rem){
  body{padding-bottom:0}
  .tabs{position:sticky; top:3.3rem; bottom:auto; grid-auto-columns:auto;
    justify-content:center; gap:.25rem; border-top:0; border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 90%,transparent)}
  .tab{flex-direction:row; gap:.45rem; font-size:.82rem; padding:.7rem .9rem;
    border-top:0; border-bottom:2px solid transparent; margin:0 0 -1px}
  .tab[aria-selected="true"]{border-top-color:transparent; border-bottom-color:var(--accent)}
  .tab .pip{top:.5rem; left:auto; right:.35rem}
  .resumen{grid-template-columns:repeat(4,1fr)}
  .brindis{bottom:1.5rem}
}
</style>

<header class="app-head">
  <div class="marca">
    <span class="mono-q" aria-hidden="true">Q</span>
    <b>Casa Quirón</b>
    <span class="sello-admin" id="sello" hidden>Dirección</span>
  </div>
  <button class="quien" id="btn-quien">
    <span class="avatar" id="quien-ini" aria-hidden="true">—</span>
    <span id="quien-nombre">Entrar</span>
  </button>
</header>

<nav class="tabs" role="tablist" aria-label="Secciones" id="tabs"></nav>

<main>
  <section class="vista" id="v-inicio"></section>
  <section class="vista" id="v-reservar" hidden></section>
  <section class="vista" id="v-documentos" hidden></section>
  <section class="vista" id="v-competencias" hidden></section>
  <section class="vista" id="v-recordatorios" hidden></section>

  <footer class="pie">
    <p id="pie-datos">Casa Quirón · Sistema de reservas</p>
    <p>Caballos, horarios y jinetes son <b>datos de ejemplo</b>; las competencias las carga dirección.</p>
    <p><button id="btn-reiniciar" type="button">Borrar mis datos de prueba</button></p>
  </footer>
</main>

<div id="capa"></div>
<div class="brindis" id="brindis" hidden></div>

<script>
"use strict";
/* ==========================================================================
   Casa Quirón — catálogos, cuentas y permisos.
   ========================================================================== */

const NIVELES = [
  { id:"cuerdita", nombre:"Cuerdita", orden:1 }, { id:"principiantes", nombre:"Principiantes", orden:2 },
  { id:"intermedio", nombre:"Intermedio", orden:3 }, { id:"avanzado", nombre:"Avanzado", orden:4 },
];
const nivelOrden = id => (NIVELES.find(n => n.id === id) || {}).orden || 0;
const nivelNombre = id => (NIVELES.find(n => n.id === id) || {}).nombre || "—";

/* -------------------------------------------------- tiempo en zona del club */
const TZ = "America/Mexico_City";
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function partesClub(fecha) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone:TZ, hour12:false, weekday:"short",
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
  const p = {};
  for (const parte of f.formatToParts(fecha)) if (parte.type !== "literal") p[parte.type] = parte.value;
  return { anio:+p.year, mes:+p.month, dia:+p.day, hora:(+p.hour) % 24, min:+p.minute, seg:+p.second,
    diaSemana:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday) };
}
function desfaseEn(instante) {
  const p = partesClub(instante);
  return Date.UTC(p.anio, p.mes - 1, p.dia, p.hora, p.min, p.seg) - instante.getTime();
}
function instanteClub(anio, mes, dia, hora, min) {
  const meta = Date.UTC(anio, mes - 1, dia, hora, min);
  let inst = meta - desfaseEn(new Date(meta));
  return new Date(meta - desfaseEn(new Date(inst)));
}
const ymd = f => { const p = partesClub(f); return `${p.anio}-${String(p.mes).padStart(2,"0")}-${String(p.dia).padStart(2,"0")}`; };
function deYmd(clave, hora = "00:00") {
  const [a,m,d] = clave.split("-").map(Number); const [h,mi] = hora.split(":").map(Number);
  return instanteClub(a, m, d, h, mi);
}
const ahora = () => new Date();
function fechaLarga(clave) {
  const [a,m,d] = clave.split("-").map(Number);
  return `${DIAS[partesClub(instanteClub(a,m,d,12,0)).diaSemana]} ${d} de ${MESES[m-1]}`;
}
function horaTexto(fecha) {
  const p = partesClub(fecha);
  return `${p.hora % 12 === 0 ? 12 : p.hora % 12}:${String(p.min).padStart(2,"0")} ${p.hora < 12 ? "a.m." : "p.m."}`;
}
function momentoTexto(fecha) { return `el ${DIAS[partesClub(fecha).diaSemana]} ${horaTexto(fecha)}`; }
function lunesDeLaSemana(fecha) {
  const p = partesClub(fecha);
  return new Date(instanteClub(p.anio,p.mes,p.dia,12,0).getTime() - ((p.diaSemana + 6) % 7) * 864e5);
}
const sumarDias = (f, n) => new Date(f.getTime() + n * 864e5);

/* Rango "17 al 20 de septiembre", o "2 de noviembre" si es un solo día. */
function rangoFechas(ini, fin) {
  if (!fin || fin === ini) { const [,m,d] = ini.split("-").map(Number); return `${d} de ${MESES[m-1]}`; }
  const [,m1,d1] = ini.split("-").map(Number);
  const [,m2,d2] = fin.split("-").map(Number);
  return m1 === m2 ? `${d1} al ${d2} de ${MESES[m1-1]}` : `${d1} de ${MESES[m1-1]} al ${d2} de ${MESES[m2-1]}`;
}

/* ------------------------------------------------------------ almacenamiento
   Publicada como Artifact, el almacén compartido guarda las reservas y solo
   quien tenga permiso de edición puede tocar el calendario de competencias:
   esa restricción la aplica el servidor, no esta página. */
const COLECCIONES = ["reservas","historial","recordatorios","aceptaciones","inscripciones","competencias"];

const Datos = {
  db: null, esEditor: true, listo: false,
  cache: Object.fromEntries(COLECCIONES.map(c => [c, {}])),
  alCambiar: () => {},

  get compartido() { return this.db !== null; },

  async iniciar() {
    for (const c of COLECCIONES) this.cache[c] = this.leerLocal(c);
    /* Sin almacén compartido el calendario arranca con el que trae la página;
       con almacén, dirección lo carga desde la app. */
    if (!Object.keys(this.cache.competencias).length) {
      for (const c of COMPETENCIAS_INICIALES) { const { id, ...resto } = c; this.cache.competencias[id] = resto; }
      this.guardarLocal("competencias");
    }
    try {
      const db = window.claude && (await window.claude.use("db"));
      if (db) {
        this.db = db;
        this.cache.competencias = {};      /* manda el almacén, no lo local */
        this.esEditor = await this.probarEdicion();
        for (const c of COLECCIONES) {
          db.collection(c).onSnapshot(snap => {
            const siguiente = {};
            snap.docs.forEach(d => { if (!d.id.startsWith("_")) siguiente[d.id] = d.data(); });
            this.cache[c] = siguiente;
            this.alCambiar();
          }, () => {});
        }
      }
    } catch (e) { /* sin almacén compartido: se queda en local */ }
    this.listo = true;
    this.alCambiar();
  },

  /* El único modo de saber si esta persona tiene permiso de edición es
     intentar escribir donde solo dirección puede. */
  async probarEdicion() {
    try {
      await this.db.collection("competencias").doc("_acceso").set({ probado:new Date().toISOString() });
      await this.db.collection("competencias").doc("_acceso").delete();
      return true;
    } catch (e) { return false; }
  },

  leerLocal(c) { try { return JSON.parse(localStorage.getItem("cq:" + c) || "{}"); } catch (e) { return {}; } },
  guardarLocal(c) { try { localStorage.setItem("cq:" + c, JSON.stringify(this.cache[c])); } catch (e) {} },

  todo(c) { return Object.entries(this.cache[c] || {}).map(([id, d]) => ({ id, ...d })); },

  async poner(c, id, datos) {
    this.cache[c][id] = datos;
    if (this.db) { try { await this.db.collection(c).doc(id).set(datos); }
                   catch (e) { delete this.cache[c][id]; throw e; } }
    else { this.guardarLocal(c); this.alCambiar(); }
  },

  async quitar(c, id) {
    const previo = this.cache[c][id];
    delete this.cache[c][id];
    if (this.db) { try { await this.db.collection(c).doc(id).delete(); }
                   catch (e) { this.cache[c][id] = previo; throw e; } }
    else { this.guardarLocal(c); this.alCambiar(); }
  },

  /* Aparta el lugar antes de escribir: sin esto dos jinetes pueden creer que
     ganaron el mismo caballo (RN-08). */
  async apartar(c, id, datos, quien) {
    if (!this.db) {
      if (this.cache[c][id]) return false;
      await this.poner(c, id, datos); return true;
    }
    const ref = this.db.collection(c).doc(id);
    const lease = await ref.acquire({ holder:quien, ttlMs:6000 });
    if (!lease.acquired) return false;
    const actual = await ref.get();
    if (actual.exists && actual.data() && actual.data().jineteId) return false;
    await ref.set(datos);
    return true;
  },

  async limpiarLocal() {
    for (const c of COLECCIONES) {
      if (c === "competencias" && this.db) continue;
      this.cache[c] = {}; try { localStorage.removeItem("cq:" + c); } catch (e) {}
    }
  },
};

/* El calendario vive en el almacén compartido; sin él se usa el inicial. */
function competencias() {

    .sort((a,b) => (a.inicio || "").localeCompare(b.inicio || ""));
}
const competencia = id => competencias().find(c => c.id === id);

const misReservas = () => soloMio("reservas")
  .sort((a,b) => deYmd(a.fecha, a.hora) - deYmd(b.fecha, b.hora));

const limiteCancelacion = inicio => new Date(inicio.getTime() - 10 * 3600 * 1000);
const seCancelaSinCosto = inicio => ahora() < limiteCancelacion(inicio);

function saldo(j = sujeto) {
  const activas = Datos.todo("reservas").filter(r => r.jineteId === j.id)
    .reduce((s, r) => s + (r.consume || 1), 0);
  const cobradas = Datos.todo("historial").filter(h => h.jineteId === j.id && h.cobrada)
    .reduce((s, h) => s + (h.consume || 1), 0);
  return j.clasesCargadas - activas - cobradas;
}

/* Cada cuenta ve solo los documentos de sus secciones (RN-16). */
function docsDeCuenta() {
  return DOCUMENTOS.filter(d => d.audiencia === "todos" || ve(d.audiencia));
}
const aceptado = d => Datos.todo("aceptaciones")
  .some(a => a.jineteId === sujeto.id && a.documentoId === d.id && a.version === d.version);
const pendientesDeFirma = () => docsDeCuenta().filter(d => d.obligatorio && !aceptado(d));

const VENTANA = { abre:8, cierra:22 };
function estadoVentana() {
  const p = partesClub(ahora());
  const abierta = p.diaSemana === 1 && p.hora >= VENTANA.abre && p.hora < VENTANA.cierra;
  const lunes = lunesDeLaSemana(ahora());
  return { abierta, proximoLunes: ymd(p.diaSemana === 1 && p.hora < VENTANA.abre ? lunes : sumarDias(lunes, 7)) };
}
/* RN-20: solo dirección puede saltarse la ventana. */
const modoDireccion = () => esAdmin() && localStorage.getItem("cq:direccion") === "1";
const puedeAgendar = () => estadoVentana().abierta || modoDireccion();

const traslapa = (a1,a2,b1,b2) => a1 < b2 && b1 < a2;
function intervaloReserva(r) {
  const i = deYmd(r.fecha, r.hora);
  return [i, new Date(i.getTime() + (tipo(r.tipoId).min || 60) * 60000)];
}

function caballosPara(sesion) {
  const delDia = reservasDe(sesion.fecha);
  return CABALLOS.filter(c => {
    if (c.estatus !== "activo") return false;
    if (!sujeto.habilitados.includes(c.id)) return false;                       // RN-04
    const n = nivelOrden(sujeto.nivel);
    if (n < nivelOrden(c.min) || n > nivelOrden(c.max)) return false;           // RN-05
    const suyas = delDia.filter(r => r.caballoId === c.id);
    if (suyas.length >= c.maxDia) return false;                                 // RN-06
    if (suyas.some(r => { const [i,f] = intervaloReserva(r);
      return traslapa(sesion.inicio, sesion.fin, i, f); })) return false;       // RN-08
    return true;
  }).map(c => ({ ...c, trabajadas: delDia.filter(r => r.caballoId === c.id).length }));
}

function motivoBloqueo(sesion) {
  if (!sesion.niveles.includes(sujeto.nivel)) return "oculta";                  // RN-12
  if (sesion.inicio <= ahora()) return "Ya pasó";
  const ocupadas = reservasDe(sesion.fecha).filter(r => r.plantillaId === sesion.plantillaId);
  if (ocupadas.some(r => r.jineteId === sujeto.id)) return "Ya reservada";
  const cap = (ESPACIOS.find(e => e.id === sesion.esp) || {}).cap || sesion.cupo;
  if (ocupadas.length >= Math.min(sesion.cupo, cap)) return "Sin lugares";      // RN-09
  if (misReservas().filter(r => r.fecha === sesion.fecha).some(r => {
    const [i,f] = intervaloReserva(r); return traslapa(sesion.inicio, sesion.fin, i, f);
  })) return "Otra clase a esa hora";                                          // RN-10
  if (saldo() < tipo(sesion.tipoId).consume) return "Sin clases disponibles";   // RN-03
  if (pendientesDeFirma().length) return "Falta firmar";                        // RN-15
  if (!caballosPara(sesion).length) return "Sin caballos libres";               // RN-04/06/08
  if (!puedeAgendar()) return "Fuera de la ventana";                            // RN-11
  return null;
}

const lugaresLibres = sesion => {
  const cap = (ESPACIOS.find(e => e.id === sesion.esp) || {}).cap || sesion.cupo;
  return Math.min(sesion.cupo, cap) -
    reservasDe(sesion.fecha).filter(r => r.plantillaId === sesion.plantillaId).length;
};

const misInscripciones = () => soloMio("inscripciones");
const inscritoEn = compId => misInscripciones().find(i => i.competenciaId === compId);
/* La lista de anotados es información del club: solo dirección la ve. */
const anotadosEn = compId => esAdmin()
  ? Datos.todo("inscripciones").filter(i => i.competenciaId === compId) : [];

function recordatoriosAuto() {
  const lista = [];
  for (const r of misReservas()) {
    const limite = limiteCancelacion(deYmd(r.fecha, r.hora));
    if (limite > ahora()) lista.push({ id:"auto-lim-" + r.id, vence:limite,
      texto:`Último momento para cancelar sin costo la clase del ${fechaLarga(r.fecha)}` });
  }
  for (const c of competencias()) {
    if (!c.cierre) continue;
    const cierre = deYmd(c.cierre, "20:00");
    if (cierre > ahora()) lista.push({ id:"auto-comp-" + c.id, vence:cierre,
      texto:`Cierran las inscripciones de ${c.nombre}` });
  }
  const v = estadoVentana();
  if (!v.abierta) lista.push({ id:"auto-ventana", vence:deYmd(v.proximoLunes, "08:00"),
    texto:"Se abre la agenda de la semana: deja reservadas todas tus clases" });
  return lista.sort((a,b) => a.vence - b.vence);
}
const misRecordatorios = () => soloMio("recordatorios");
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ INICIO */
function verInicio() {
  const s = saldo();
  const proximas = misReservas().filter(r => deYmd(r.fecha, r.hora) > ahora());
  const pasadas  = misReservas().filter(r => deYmd(r.fecha, r.hora) <= ahora()).reverse();
  const firmas = pendientesDeFirma();
  const v = estadoVentana();
  const sigComp = competencias().filter(c => deYmd(c.fin || c.inicio, "23:59") > ahora())[0];
  const deQuien = cuenta.rol === "tutor" ? ` de ${sujeto.nombre.split(" ")[0]}` : "";

  return `
  <div class="vista-titulo">
    <h2>Hola, ${esc(cuenta.nombre.split(" ")[0])}</h2>
    <span class="sub">${esc(ROL_NOMBRE[rolEfectivo()])}${
      cuenta.rol === "tutor" ? ` de ${esc(sujeto.nombre)}` : ` · ${esc(nivelNombre(sujeto.nivel))}`}</span>
  </div>

  ${cuenta.rol === "tutor" ? `<div class="nota">
    Manejas la cuenta de <b>${esc(sujeto.nombre)}</b>, menor de edad: reservas, cancelas y firmas
    en su nombre, y los avisos te llegan a ti.</div>` : ""}

  ${firmas.length ? `<div class="nota alerta">
    <b>Falta firmar ${firmas.length === 1 ? "un documento" : firmas.length + " documentos"}.</b>
    No se puede reservar hasta aceptar ${esc(listar(firmas.map(d => d.titulo)))}.
    <span><button class="btn btn-mini" data-ir="documentos" style="margin-top:.35rem">Ir a Documentos</button></span>
  </div>` : ""}

  <div class="resumen">
    <div class="dato"><div class="n">${s}</div><div class="t">clases disponibles${esc(deQuien)}</div></div>
    <div class="dato"><div class="n">${proximas.length}</div><div class="t">clases reservadas</div></div>
    <div class="dato"><div class="n chico">${v.abierta ? "Abierta" : "Cerrada"}</div><div class="t">agenda de la semana</div></div>
    <div class="dato"><div class="n chico">${sigComp
      ? esc(rangoFechas(sigComp.inicio, sigComp.fin)) : "—"}</div><div class="t">próxima competencia</div></div>
  </div>

  ${proximas.length ? `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">Próxima clase</p>
    ${tarjetaClase(proximas[0], false)}
    ${proximas.length > 1 ? `<p class="etiqueta" style="margin:.9rem 0 .4rem">Después</p>
      <div class="vista">${proximas.slice(1).map(r => tarjetaClase(r, false)).join("")}</div>` : ""}
  </div>` : `<div class="vacio">No hay clases reservadas.
    <div style="margin-top:.7rem"><button class="btn btn-mini" data-ir="reservar">Reservar una clase</button></div></div>`}

  ${ve("propietario") ? bloquesCaballos() : ""}
  ${esAdmin() ? panelClub() : ""}

  ${pasadas.length ? `<details class="tarjeta plana">
    <summary style="cursor:pointer; font-weight:600; font-size:.9rem">Historial (${pasadas.length})</summary>
    <div class="vista" style="margin-top:.75rem">${pasadas.slice(0,8).map(r => tarjetaClase(r, true)).join("")}</div>
  </details>` : ""}

  <div class="tarjeta plana">
    <p class="etiqueta">Paquete</p>
    <p style="font-size:.95rem; margin-top:.2rem">${esc(sujeto.paquete)}</p>
    <p style="font-size:.78rem; color:var(--ink-3); margin-top:.3rem">
      El saldo lo carga dirección después del cobro presencial. No hay pago en línea.</p>
  </div>`;
}

/* Sección de propietario: no la ve un jinete ni un tutor. */
function bloquesCaballos() {
  const mios = misCaballos();
  if (!mios.length) return "";
  return `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">${mios.length === 1 ? "Mi caballo" : "Mis caballos"}</p>
    <div class="vista">${mios.map(c => {
      const trabajoHoy = reservasDe(ymd(ahora())).filter(r => r.caballoId === c.id).length;
      const abierto = localStorage.getItem("cq:escuela:" + c.id) === "1";
      return `<article class="ficha">
        <div class="ficha-cab">
          <span class="ficha-ini" aria-hidden="true">${esc(c.nombre[0])}</span>
          <div><h3>${esc(c.nombre)}</h3>
            <p style="font-size:.8rem; color:var(--ink-2)">${esc(c.origen)} · ${esc(c.capa)} · ${c.edad} años</p></div>
          <span class="pastilla ${c.estatus === "activo" ? "p-ok" : "p-alerta"}"
            style="margin-left:auto">${esc(c.estatus)}</span>
        </div>
        <dl class="ficha-datos">
          <div><dt>Nivel</dt><dd>${esc(nivelNombre(c.min))} a ${esc(nivelNombre(c.max))}</dd></div>
          <div><dt>Trabajo hoy</dt><dd>${trabajoHoy} de ${c.maxDia} sesiones</dd></div>
          <div><dt>Uso</dt><dd>${esc(c.uso)}</dd></div>
        </dl>
        <label style="display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem">
          <input type="checkbox" data-escuela="${c.id}" ${abierto ? "checked" : ""} style="width:auto; margin-top:.2rem">
          <span>Autorizo que ${esc(c.nombre)} entre al pool de escuela (RN-14). Puedes quitarlo cuando quieras.</span>
        </label>
      </article>`;
    }).join("")}</div>
  </div>`;
}

/* Resumen del club: solo dirección. */
function panelClub() {
  const semana = ymd(lunesDeLaSemana(ahora()));
  const dias = Array.from({ length:7 }, (_, i) => ymd(sumarDias(deYmd(semana, "12:00"), i)));
  const reservasSemana = Datos.todo("reservas").filter(r => dias.includes(r.fecha));
  const sinFirmar = JINETES.filter(j => DOCUMENTOS
    .filter(d => d.obligatorio && (d.audiencia === "todos" || d.audiencia === "jinete"))
    .some(d => !Datos.todo("aceptaciones").some(a => a.jineteId === j.id && a.documentoId === d.id && a.version === d.version)));
  const anotados = Datos.todo("inscripciones").length;
  return `<div class="admin-caja">
    <p class="etiqueta">Panel de dirección</p>
    <div class="resumen" style="gap:.5rem">
      <div class="dato"><div class="n">${reservasSemana.length}</div><div class="t">clases reservadas esta semana</div></div>
      <div class="dato"><div class="n">${sinFirmar.length}</div><div class="t">jinetes sin firmar</div></div>
      <div class="dato"><div class="n">${anotados}</div><div class="t">anotados a competencias</div></div>
      <div class="dato"><div class="n chico">${competencias().length}</div><div class="t">competencias en el calendario</div></div>
    </div>
    ${sinFirmar.length ? `<p style="font-size:.8rem">Sin firmar: ${esc(listar(sinFirmar.map(j => j.nombre)))}.</p>` : ""}
  </div>`;
}

function tarjetaClase(r, pasada) {
  const inicio = deYmd(r.fecha, r.hora);
  const limite = limiteCancelacion(inicio);
  const aTiempo = seCancelaSinCosto(inicio);
  return `<article class="clase ${pasada ? "pasada" : ""}">
    <div class="clase-cab">
      <div><div class="clase-hora">${esc(horaTexto(inicio))}</div>
        <div class="clase-meta">${esc(fechaLarga(r.fecha))}</div></div>
      <span class="pastilla ${pasada ? "p-neutro" : "p-ok"}">${esc(tipo(r.tipoId).nombre)}</span>
    </div>
    <div class="clase-meta">${esc(caballo(r.caballoId) ? caballo(r.caballoId).nombre : "—")} ·
      ${esc(entrenador(r.ent))} · ${esc(espacio(r.esp))}</div>
    ${r.override ? `<div class="nota oro" style="padding:.45rem .6rem; font-size:.75rem">
      Agendada por dirección fuera de la ventana del lunes.</div>` : ""}
    ${pasada ? "" : `<div class="clase-pie">
      ${aTiempo
        ? `<span class="limite">Cancelación sin costo hasta <b>${esc(momentoTexto(limite))}</b></span>
           <button class="btn btn-2 btn-mini" data-cancelar="${esc(r.id)}">Cancelar</button>`
        : `<span class="limite">Pasó el límite de 10 horas: si cancelas, la clase se cobra.</span>
           <button class="btn btn-peligro btn-mini" data-cancelar="${esc(r.id)}">Cancelar de todos modos</button>`}
    </div>`}
  </article>`;
}

/* ---------------------------------------------------------------- RESERVAR */
function verReservar() {
  const v = estadoVentana();
  const lunes = lunesDeLaSemana(ahora());
  const dias = Array.from({ length:7 }, (_, i) => ymd(sumarDias(lunes, i)));
  if (!dias.includes(diaSel)) diaSel = dias.find(d => deYmd(d, "23:59") > ahora()) || dias[0];
  const visibles = sesionesDe(diaSel).filter(s => motivoBloqueo(s) !== "oculta");
  const firmas = pendientesDeFirma();

  return `
  <div class="vista-titulo">
    <h2>Reservar</h2>
    <span class="sub">Semana del ${esc(fechaLarga(dias[0]))}</span>
  </div>

  <div class="ventana ${v.abierta ? "abierta" : "cerrada"}">
    <div class="titulo">${v.abierta ? "La agenda está abierta" : "La agenda está cerrada"}</div>
    <div class="detalle">${v.abierta
      ? `Hoy es lunes. Deja reservadas todas las clases de la semana antes de las ${VENTANA.cierra}:00.`
      : `Se abre el ${esc(fechaLarga(v.proximoLunes))} a las ${VENTANA.abre}:00. Fuera de esa ventana solo dirección puede agendar.`}</div>
    ${!v.abierta && esAdmin() ? `<label style="display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem; margin-top:.2rem">
      <input type="checkbox" id="chk-direccion" ${modoDireccion() ? "checked" : ""} style="width:auto; margin-top:.2rem">
      <span>Agendar como dirección (RN-20). Queda marcado en la reserva.</span></label>` : ""}
  </div>

  ${firmas.length ? `<div class="nota alerta"><b>Primero firma los documentos.</b>
    ${esc(listar(firmas.map(d => d.titulo)))} ${firmas.length === 1 ? "sigue pendiente" : "siguen pendientes"}.
    <span><button class="btn btn-mini" data-ir="documentos" style="margin-top:.35rem">Ir a Documentos</button></span>
  </div>` : ""}

  ${saldo() <= 0 ? `<div class="nota alerta"><b>No quedan clases.</b>
    Dirección carga el saldo en el club una vez que se paga.</div>` : ""}

  <div class="dias">
    ${dias.map(d => {
      const p = partesClub(deYmd(d, "12:00"));
      const hay = sesionesDe(d).some(s => s.niveles.includes(sujeto.nivel));
      const pasado = deYmd(d, "23:59") < ahora();
      return `<button class="dia" data-dia="${d}" aria-pressed="${d === diaSel}" ${pasado ? "disabled style=opacity:.4" : ""}>
        <span>${DIAS[p.diaSemana].slice(0,2)}</span><span class="d">${p.dia}</span>
        ${hay && !pasado ? '<span class="punto"></span>' : '<span style="height:4px"></span>'}</button>`;
    }).join("")}
  </div>

  <div class="vista">${visibles.length ? visibles.map(filaSesion).join("")
    : `<div class="vacio">No hay clases del nivel ${esc(nivelNombre(sujeto.nivel))} el ${esc(fechaLarga(diaSel))}.</div>`}</div>

  <p style="font-size:.75rem; color:var(--ink-3)">
    Solo aparecen las clases que el nivel y el paquete autorizan (RN-12).</p>`;
}

function filaSesion(s) {
  const motivo = motivoBloqueo(s);
  const libres = lugaresLibres(s);
  return `<article class="sesion ${motivo ? "llena" : ""}">
    <div class="hora">${esc(horaTexto(s.inicio))}</div>
    <div class="nom">${esc(tipo(s.tipoId).nombre)}</div>
    <div class="det">${esc(entrenador(s.ent))} · ${esc(espacio(s.esp))} ·
      ${libres > 0 ? `${libres} ${libres === 1 ? "lugar" : "lugares"}` : "lleno"} · consume ${tipo(s.tipoId).consume}</div>
    <div class="accion">${motivo ? `<span class="pastilla p-neutro">${esc(motivo)}</span>`
      : `<button class="btn btn-mini" data-reservar="${esc(s.id)}">Reservar</button>`}</div>
  </article>`;
}
</script>

<script>
"use strict";
/* -------------------------------------------------------------- DOCUMENTOS */
function verDocumentos() {
  const mios = docsDeCuenta();
  return `
  <div class="vista-titulo"><h2>Documentos</h2>
    <span class="sub">${mios.length} para tu perfil</span></div>
  <p style="font-size:.8rem; color:var(--ink-3)">
    Cada perfil ve solo lo suyo (RN-16). Un jinete no accede a documentos de propietario.
    Si dirección publica una versión nueva, se vuelve a pedir la firma.</p>
  ${mios.map(bloqueDoc).join("")}
  <p style="font-size:.75rem; color:var(--ink-3)">
    Texto de muestra para probar el flujo de aceptación. Dirección lo sustituye por el
    documento oficial del club.</p>`;
}

function bloqueDoc(d) {
  const firma = Datos.todo("aceptaciones")
    .find(a => a.jineteId === sujeto.id && a.documentoId === d.id && a.version === d.version);
  const previa = Datos.todo("aceptaciones")
    .some(a => a.jineteId === sujeto.id && a.documentoId === d.id && a.version !== d.version);
  return `<article class="doc">
    <div class="doc-cab">
      <div><h3>${esc(d.titulo)}</h3>
        <p class="doc-ver">Versión ${esc(d.version)} · vigente desde el ${esc(d.vigente)}</p></div>
      ${firma ? '<span class="pastilla p-ok">Aceptado</span>'
        : d.obligatorio ? '<span class="pastilla p-alerta">Por firmar</span>'
        : '<span class="pastilla p-neutro">Informativo</span>'}
    </div>
    <p style="font-size:.85rem; color:var(--ink-2)">${esc(d.resumen)}</p>
    ${previa && !firma ? `<div class="nota alerta">
      Se aceptó una versión anterior. Esta es nueva y hay que volver a firmarla (RN-15).</div>` : ""}
    <details><summary style="cursor:pointer; font-size:.82rem; color:var(--accent); font-weight:500">
      Leer el documento</summary>
      <div class="doc-cuerpo" style="margin-top:.6rem">${d.cuerpo.map(s =>
        `<h4>${esc(s.h)}</h4><ul>${s.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}</div>
    </details>
    ${firma ? `<p class="firmado">Firmado por ${esc(firma.nombreFirma)} · ${esc(fechaLarga(firma.fecha))}, ${esc(firma.horaTexto)}</p>`
      : `<form class="firma" data-firmar="${esc(d.id)}">
          <label class="campo">${cuenta.rol === "tutor"
            ? `Nombre completo del tutor que acepta por ${esc(sujeto.nombre)}`
            : "Nombre completo como firma"}
            <input type="text" name="nombre" required autocomplete="name" placeholder="${esc(cuenta.nombre)}"></label>
          <button class="btn" type="submit">Acepto ${esc(d.titulo.toLowerCase())}</button>
        </form>`}
  </article>`;
}

/* ------------------------------------------------------------ COMPETENCIAS */
function verCompetencias() {
  const lista = competencias();
  const futuras = lista.filter(c => deYmd(c.fin || c.inicio, "23:59") > ahora());
  const pasadas = lista.filter(c => deYmd(c.fin || c.inicio, "23:59") <= ahora());
  return `
  <div class="vista-titulo"><h2>Competencias</h2>
    <span class="sub">${futuras.length} por venir</span></div>

  ${esAdmin() ? `<div class="admin-caja">
    <p class="etiqueta">Dirección</p>
    <p style="font-size:.82rem; color:var(--oro-tinta)">
      Puedes crear competencias, cambiar fechas, publicar categorías y horarios, fijar el cierre
      de inscripciones y ver quién está anotado.</p>
    <div class="acciones-admin">
      <button class="btn btn-oro btn-mini" data-nueva-comp>Nueva competencia</button>
      ${!lista.length ? '<button class="btn btn-2 btn-mini" data-cargar-calendario>Cargar calendario inicial</button>' : ""}
    </div>
  </div>` : ""}

  ${futuras.map(c => bloqueComp(c, false)).join("") ||
    `<div class="vacio">${esAdmin() ? "El calendario está vacío. Crea la primera competencia."
      : "Dirección todavía no publica competencias."}</div>`}

  ${pasadas.length ? `<p class="etiqueta" style="margin-top:.5rem">Ya realizadas</p>
    ${pasadas.map(c => bloqueComp(c, true)).join("")}` : ""}

  <p style="font-size:.75rem; color:var(--ink-3)">
    Anotarse avisa a dirección del interés. La inscripción formal y el pago se hacen en oficinas.</p>`;
}

function bloqueComp(c, pasada) {
  const [,m,d] = c.inicio.split("-").map(Number);
  const mia = inscritoEn(c.id);
  const anotados = anotadosEn(c.id);
  const cierraEn = c.cierre ? deYmd(c.cierre, "20:00") : null;
  const abierta = !pasada && (!cierraEn || cierraEn > ahora());
  const cats = c.categorias || [];
  const hors = c.horarios || [];

  return `<article class="comp" style="${pasada ? "opacity:.7" : ""}">
    <div class="comp-cab">
      <div class="comp-fecha" ${pasada ? 'style="background:var(--line-fuerte); color:var(--ink-2)"' : ""}>
        <span class="d">${d}</span><span class="m">${esc(MESES[m-1].slice(0,3))}</span></div>
      <div style="flex:1; min-width:0">
        <h3>${esc(c.nombre)}</h3>
        <p style="font-size:.82rem; color:var(--ink-2)">${esc(rangoFechas(c.inicio, c.fin))}</p>
        <p style="font-size:.78rem; color:var(--ink-3)">${esc(c.sede || "Sede por confirmar")}${
          c.disciplina ? " · " + esc(c.disciplina) : ""}</p>
      </div>
      ${mia ? '<span class="pastilla p-ok">Anotado</span>' : ""}
    </div>

    <div class="comp-bloque">
      <p class="etiqueta">Categorías</p>
      ${cats.length ? `<div class="fichas">${cats.map(x =>
        `<span class="ficha-cat">${esc(x)}</span>`).join("")}</div>`
        : '<p class="por-definir">Dirección todavía no publica las categorías.</p>'}
    </div>

    <div class="comp-bloque">
      <p class="etiqueta">Horarios</p>
      ${hors.length ? `<div class="horario">${hors.map(h =>
        `<div><b>${esc(h.split("—")[0].trim())}</b><span>${esc((h.split("—")[1] || "").trim())}</span></div>`).join("")}</div>`
        : '<p class="por-definir">Dirección todavía no publica los horarios.</p>'}
    </div>

    ${c.nota ? `<p style="font-size:.8rem; color:var(--ink-2)">${esc(c.nota)}</p>` : ""}

    <div class="comp-bloque">
      <p style="font-size:.78rem; color:var(--ink-3)">Cierre de inscripciones:
        ${c.cierre ? esc(fechaLarga(c.cierre)) : "por definir"}</p>
    </div>

    ${pasada ? "" : abierta
      ? `<button class="btn ${mia ? "btn-2" : ""} btn-bloque btn-mini" data-comp="${esc(c.id)}">
          ${mia ? "Quitar mi nombre" : "Me interesa competir"}</button>`
      : `<div class="nota">Las inscripciones ya cerraron. Habla con dirección si quieres entrar.</div>`}

    ${esAdmin() ? `<div class="admin-caja">
      <p class="etiqueta">Anotados (${anotados.length})</p>
      ${anotados.length ? anotados.map(i => {
        const j = jinete(i.jineteId);
        return `<div class="anotado"><span>${esc(j ? j.nombre : i.jineteId)}</span>
          <span class="cat">${esc(i.categoria || "sin categoría")}</span></div>`;
      }).join("") : '<p style="font-size:.8rem; color:var(--oro-tinta)">Nadie se ha anotado todavía.</p>'}
      <div class="acciones-admin">
        <button class="btn btn-oro btn-mini" data-editar-comp="${esc(c.id)}">Editar</button>
        <button class="btn btn-2 btn-mini" data-borrar-comp="${esc(c.id)}">Borrar</button>
      </div>
    </div>` : ""}
  </article>`;
}

/* Editor de dirección: crea o modifica una competencia. */
function editarCompetencia(id) {
  const c = id ? competencia(id) : { id:"", nombre:"", inicio:"", fin:"", sede:"", disciplina:"Salto",
    categorias:[], horarios:[], cierre:"", nota:"" };
  if (!c) return;
  abrirHoja(id ? "Editar competencia" : "Nueva competencia", `
    <form id="form-comp" style="display:grid; gap:.7rem">
      <label class="campo">Nombre<input type="text" name="nombre" required value="${esc(c.nombre)}"></label>
      <div class="dos-campos">
        <label class="campo">Primer día<input type="date" name="inicio" required value="${esc(c.inicio)}"></label>
        <label class="campo">Último día<input type="date" name="fin" value="${esc(c.fin || "")}"></label>
      </div>
      <div class="dos-campos">
        <label class="campo">Sede<input type="text" name="sede" value="${esc(c.sede || "")}"></label>
        <label class="campo">Disciplina<input type="text" name="disciplina" value="${esc(c.disciplina || "")}"></label>
      </div>
      <label class="campo">Cierre de inscripciones
        <input type="date" name="cierre" value="${esc(c.cierre || "")}"></label>
      <label class="campo">Categorías, una por línea
        <textarea name="categorias" placeholder="0.60 m&#10;0.80 m&#10;1.00 m">${esc((c.categorias || []).join("\n"))}</textarea></label>
      <label class="campo">Horarios, una línea por prueba — usa un guión largo para separar
        <textarea name="horarios" placeholder="Jueves 17 — Reconocimiento de pista 8:00 a.m.&#10;Viernes 18 — 0.80 m a las 9:00 a.m.">${esc((c.horarios || []).join("\n"))}</textarea></label>
      <label class="campo">Nota para los jinetes
        <textarea name="nota" style="min-height:3rem">${esc(c.nota || "")}</textarea></label>
      <button class="btn btn-oro btn-bloque" type="submit">${id ? "Guardar cambios" : "Crear competencia"}</button>
    </form>`,
    cerrar => {
      $("#form-comp").addEventListener("submit", async ev => {
        ev.preventDefault();
        const f = new FormData(ev.target);
        const nombre = String(f.get("nombre")).trim();
        const nuevoId = id || nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "comp-" + Date.now();
        const lineas = v => String(f.get(v) || "").split("\n").map(s => s.trim()).filter(Boolean);
        try {
          await Datos.poner("competencias", nuevoId, {
            nombre, inicio:String(f.get("inicio")), fin:String(f.get("fin") || ""),
            sede:String(f.get("sede") || ""), disciplina:String(f.get("disciplina") || ""),
            cierre:String(f.get("cierre") || ""), categorias:lineas("categorias"),
            horarios:lineas("horarios"), nota:String(f.get("nota") || ""),
          });
          avisar(id ? "Competencia actualizada." : "Competencia creada.");
          cerrar(); pintar();
        } catch (e) { avisar("El almacén rechazó el cambio: no tienes permiso de edición."); }
      });
    });
}

/* Anotarse: si dirección ya publicó categorías, se elige una. */
function anotarse(compId) {
  const c = competencia(compId);
  const cats = c.categorias || [];
  if (!cats.length) return guardarInscripcion(compId, "");
  abrirHoja("Anotarse a " + c.nombre, `
    <p style="font-size:.85rem; color:var(--ink-2)">Elige la categoría en la que quieres competir.</p>
    <div class="vista" id="cats">${cats.map(x =>
      `<button class="opcion" data-cat="${esc(x)}" aria-pressed="false"><span class="n">${esc(x)}</span></button>`).join("")}</div>
    <button class="btn btn-bloque" id="ok-anotar" disabled>Anotarme</button>`,
    cerrar => {
      let elegida = null;
      $("#cats").addEventListener("click", e => {
        const b = e.target.closest("[data-cat]"); if (!b) return;
        elegida = b.dataset.cat;
        $("#cats").querySelectorAll(".opcion").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        $("#ok-anotar").disabled = false;
      });
      $("#ok-anotar").onclick = async () => { await guardarInscripcion(compId, elegida); cerrar(); };
    });
}
async function guardarInscripcion(compId, categoria) {
  await Datos.poner("inscripciones", `${compId}__${sujeto.id}`,
    { jineteId:sujeto.id, competenciaId:compId, categoria, cuando:new Date().toISOString() });
  avisar("Anotado. Dirección confirma la inscripción en oficinas.");
  pintar();
}

/* ----------------------------------------------------------- RECORDATORIOS */
function verRecordatorios() {
  const autos = recordatoriosAuto();
  const mios = misRecordatorios().sort((a,b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
  const hoyClave = ymd(ahora());
  return `
  <div class="vista-titulo"><h2>Recordatorios</h2>
    <span class="sub">${mios.filter(r => !r.hecho).length} pendientes</span></div>

  <form class="tarjeta" id="nuevo-rec" style="display:grid; gap:.6rem">
    <label class="campo">Qué no se puede olvidar
      <input type="text" name="texto" required maxlength="140" placeholder="Llevar los electrolitos"></label>
    <label class="campo">Para cuándo<input type="date" name="fecha" value="${hoyClave}"></label>
    <button class="btn" type="submit">Agregar recordatorio</button>
  </form>

  ${mios.length ? `<div class="vista">${mios.map(r => `
    <article class="rec ${r.hecho ? "hecho" : ""} ${!r.hecho && r.fecha && r.fecha < hoyClave ? "vencido" : ""}">
      <button class="marcar" data-hecho="${esc(r.id)}" aria-pressed="${!!r.hecho}" aria-label="Marcar como hecho">
        ${r.hecho ? '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' : ""}</button>
      <div class="txt"><div class="t">${esc(r.texto)}</div>
        <div class="f">${r.fecha ? esc(fechaLarga(r.fecha)) : "sin fecha"}${
          !r.hecho && r.fecha && r.fecha < hoyClave ? " · vencido" : ""}</div></div>
      <button class="btn btn-mini btn-2" data-borrar-rec="${esc(r.id)}">Borrar</button>
    </article>`).join("")}</div>`
    : '<div class="vacio">Todavía no hay recordatorios propios.</div>'}

  ${autos.length ? `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">Del club, automáticos</p>
    <div class="vista">${autos.map(r => `<article class="rec auto">
      <div class="txt"><div class="t">${esc(r.texto)}</div>
        <div class="f">${esc(fechaLarga(ymd(r.vence)))} · ${esc(horaTexto(r.vence))}</div></div></article>`).join("")}</div>
    <p style="font-size:.75rem; color:var(--ink-3); margin-top:.5rem">
      Salen solos de las reservas y del calendario. En el sistema final llegan además por WhatsApp (M12).</p>
  </div>` : ""}`;
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ pintado */
const VISTAS = { inicio:verInicio, reservar:verReservar, documentos:verDocumentos,
  competencias:verCompetencias, recordatorios:verRecordatorios };

const ICONOS = {
  inicio:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>',
  reservar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  documentos:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  competencias:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6M10 17h4l1 3H9z"/>',
  recordatorios:'<path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
};
const ROTULOS = { inicio:"Inicio", reservar:"Reservar", documentos:"Documentos",
  competencias:"Competencias", recordatorios:"Recordatorios" };

function avisar(texto) {
  const b = $("#brindis");
  b.textContent = texto; b.hidden = false;
  clearTimeout(avisar.t); avisar.t = setTimeout(() => { b.hidden = true; }, 3800);
}

function abrirHoja(titulo, contenido, alMontar) {
  const capa = $("#capa");
  capa.innerHTML = `<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="hoja-cab"><h3>${esc(titulo)}</h3><button class="cerrar" aria-label="Cerrar">&times;</button></div>
    <div id="hoja-cuerpo">${contenido}</div></div></div>`;
  const cerrar = () => { capa.innerHTML = ""; document.body.style.overflow = ""; };
  document.body.style.overflow = "hidden";
  capa.querySelector(".cerrar").onclick = cerrar;
  capa.querySelector(".velo").onclick = e => { if (e.target === capa.querySelector(".velo")) cerrar(); };
  document.addEventListener("keydown", function fuga(e) {
    if (e.key === "Escape") { cerrar(); document.removeEventListener("keydown", fuga); } });
  if (alMontar) alMontar(cerrar);
  return cerrar;
}

function pintar() {
  refrescarSesion();
  $("#quien-nombre").textContent = cuenta.nombre.split(" ")[0];
  $("#quien-ini").textContent = cuenta.nombre.split(" ").map(p => p[0]).slice(0,2).join("");
  $("#quien-ini").classList.toggle("admin", esAdmin());
  $("#sello").hidden = !esAdmin();

  const tabs = $("#tabs");
  tabs.innerHTML = Object.keys(VISTAS).map(n => `<button class="tab" role="tab" data-vista="${n}"
    aria-selected="${n === vista}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]}</svg>${ROTULOS[n]}
    ${n === "documentos" && pendientesDeFirma().length ? '<span class="pip"></span>' : ""}</button>`).join("");

  $("#v-" + vista).innerHTML = VISTAS[vista]();
  for (const n of Object.keys(VISTAS)) $("#v-" + n).hidden = n !== vista;

  $("#pie-datos").textContent = !Datos.listo ? "Conectando…"
    : Datos.compartido
      ? (esAdmin() ? "Almacén compartido · tienes permiso de edición"
                   : "Almacén compartido · solo ves lo tuyo")
      : "Guardado solo en este navegador";
}

function irA(n) { vista = n; pintar(); window.scrollTo({ top:0, behavior:"instant" }); }

/* ------------------------------------------------------------------ eventos */
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (t) irA(t.dataset.vista);
});

document.addEventListener("click", async e => {
  const ir = e.target.closest("[data-ir]");             if (ir) return irA(ir.dataset.ir);
  const dia = e.target.closest("[data-dia]");           if (dia) { diaSel = dia.dataset.dia; return pintar(); }
  const res = e.target.closest("[data-reservar]");      if (res) return elegirCaballo(res.dataset.reservar);
  const can = e.target.closest("[data-cancelar]");      if (can) return cancelar(can.dataset.cancelar);
  const nueva = e.target.closest("[data-nueva-comp]");  if (nueva) return editarCompetencia(null);
  const edi = e.target.closest("[data-editar-comp]");   if (edi) return editarCompetencia(edi.dataset.editarComp);

  const cargar = e.target.closest("[data-cargar-calendario]");
  if (cargar) {
    try {
      for (const c of COMPETENCIAS_INICIALES) { const { id, ...resto } = c; await Datos.poner("competencias", id, resto); }
      avisar("Calendario cargado.");
    } catch (err) { avisar("El almacén rechazó el cambio: no tienes permiso de edición."); }
    return pintar();
  }

  const borrarComp = e.target.closest("[data-borrar-comp]");
  if (borrarComp) {
    const c = competencia(borrarComp.dataset.borrarComp);
    return abrirHoja("Borrar competencia", `
      <p style="font-size:.9rem">Se quita <b>${esc(c.nombre)}</b> del calendario y con ella la lista de anotados.</p>
      <button class="btn btn-peligro btn-bloque" id="ok-borrar-comp">Borrar</button>`,
      cerrar => { $("#ok-borrar-comp").onclick = async () => {
        try {
          for (const i of Datos.todo("inscripciones").filter(x => x.competenciaId === c.id))
            await Datos.quitar("inscripciones", i.id);
          await Datos.quitar("competencias", c.id);
          avisar("Competencia borrada.");
        } catch (err) { avisar("El almacén rechazó el cambio: no tienes permiso de edición."); }
        cerrar(); pintar();
      }; });
  }

  const comp = e.target.closest("[data-comp]");
  if (comp) {
    const mia = inscritoEn(comp.dataset.comp);
    if (mia) { await Datos.quitar("inscripciones", mia.id); avisar("Te quitamos de la lista."); return pintar(); }
    return anotarse(comp.dataset.comp);
  }

  const hecho = e.target.closest("[data-hecho]");
  if (hecho) {
    const r = misRecordatorios().find(x => x.id === hecho.dataset.hecho);
    if (r) { const { id, ...resto } = r; await Datos.poner("recordatorios", id, { ...resto, hecho: !r.hecho }); }
    return pintar();
  }
  const brec = e.target.closest("[data-borrar-rec]");
  if (brec) { await Datos.quitar("recordatorios", brec.dataset.borrarRec); return pintar(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "chk-direccion") {
    localStorage.setItem("cq:direccion", e.target.checked ? "1" : "0");
    avisar(e.target.checked ? "Modo dirección activo." : "Modo dirección apagado.");
    return pintar();
  }
  const esc2 = e.target.closest("[data-escuela]");
  if (esc2) {
    localStorage.setItem("cq:escuela:" + esc2.dataset.escuela, esc2.checked ? "1" : "0");
    avisar(esc2.checked ? "Autorizado para el pool de escuela." : "Retirado del pool de escuela.");
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id === "form-comp") return;          /* lo maneja su propio editor */
  e.preventDefault();

  if (e.target.id === "nuevo-rec") {
    const f = new FormData(e.target);
    const texto = String(f.get("texto") || "").trim(); if (!texto) return;
    await Datos.poner("recordatorios", "r-" + Date.now().toString(36) + "-" + sujeto.id,
      { jineteId:sujeto.id, texto, fecha:f.get("fecha") || "", hecho:false });
    avisar("Recordatorio agregado."); return pintar();
  }

  const firmar = e.target.dataset.firmar;
  if (firmar) {
    const d = documento(firmar);
    const nombre = String(new FormData(e.target).get("nombre") || "").trim();
    if (nombre.length < 4) return avisar("Escribe el nombre completo.");
    const cuando = ahora();
    await Datos.poner("aceptaciones", `${sujeto.id}__${d.id}__${d.version}`, {
      jineteId:sujeto.id, firmadaPor:cuenta.id, documentoId:d.id, version:d.version,
      nombreFirma:nombre, fecha:ymd(cuando), horaTexto:horaTexto(cuando), sello:cuando.toISOString() });
    avisar(`${d.titulo} aceptado.`); return pintar();
  }
});

/* ---------------------------------------------------------- reservar y cancelar */
function elegirCaballo(sesionId) {
  const [fecha, plantillaId] = sesionId.split("__");
  const s = sesionesDe(fecha).find(x => x.plantillaId === plantillaId); if (!s) return;
  const opciones = caballosPara(s);
  abrirHoja(tipo(s.tipoId).nombre, `
    <p style="font-size:.85rem; color:var(--ink-2)">${esc(fechaLarga(fecha))} · ${esc(horaTexto(s.inicio))} ·
      ${esc(entrenador(s.ent))} · ${esc(espacio(s.esp))}</p>
    <p class="etiqueta">Elige caballo</p>
    <div class="vista" id="lista-caballos">${opciones.map(c => `
      <button class="opcion" data-caballo="${c.id}" aria-pressed="false">
        <span class="ini" aria-hidden="true">${esc(c.nombre[0])}</span>
        <span><span class="n">${esc(c.nombre)}</span>
          <span class="m">${esc(nivelNombre(c.min))} a ${esc(nivelNombre(c.max))}</span></span>
        <span class="carga">${c.trabajadas}/${c.maxDia}<br>hoy</span></button>`).join("")}</div>
    <div class="nota">Se descuenta <b>${tipo(s.tipoId).consume}</b> del saldo.
      Cancelación sin costo hasta <b>${esc(momentoTexto(limiteCancelacion(s.inicio)))}</b>.</div>
    <button class="btn btn-bloque" id="confirmar" disabled>Confirmar reserva</button>`,
    cerrar => {
      let elegido = null;
      const btn = $("#confirmar");
      $("#lista-caballos").addEventListener("click", ev => {
        const b = ev.target.closest("[data-caballo]"); if (!b) return;
        elegido = b.dataset.caballo;
        $("#lista-caballos").querySelectorAll(".opcion").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        btn.disabled = false;
      });
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = "Apartando…";
        if (await confirmarReserva(s, elegido)) cerrar();
        else { btn.disabled = false; btn.textContent = "Confirmar reserva"; }
      };
    });
}

async function confirmarReserva(s, caballoId) {
  const motivo = motivoBloqueo(s);
  if (motivo) { avisar(motivo); return false; }
  const id = `${s.fecha}__${s.plantillaId}__${caballoId}`;
  const gano = await Datos.apartar("reservas", id, {
    jineteId:sujeto.id, reservadaPor:cuenta.id, fecha:s.fecha,
    hora:PLANTILLA.find(p => p.id === s.plantillaId).hora, plantillaId:s.plantillaId,
    caballoId, tipoId:s.tipoId, ent:s.ent, esp:s.esp, consume:tipo(s.tipoId).consume,
    creada:new Date().toISOString(), override:!estadoVentana().abierta,
  }, idTab);
  if (!gano) { avisar(`${caballo(caballoId).nombre} lo acaba de apartar alguien más.`); pintar(); return false; }
  avisar(`Listo. Cancelación sin costo hasta ${momentoTexto(limiteCancelacion(s.inicio))}.`);
  pintar(); return true;
}

async function cancelar(reservaId) {
  const r = Datos.todo("reservas").find(x => x.id === reservaId); if (!r) return;
  const inicio = deYmd(r.fecha, r.hora);
  const aTiempo = seCancelaSinCosto(inicio);
  abrirHoja("Cancelar clase", `
    <p style="font-size:.9rem">${esc(fechaLarga(r.fecha))} · ${esc(horaTexto(inicio))} ·
      ${esc(caballo(r.caballoId).nombre)}</p>
    <div class="nota ${aTiempo ? "" : "alerta"}">${aTiempo
      ? "Se devuelve la clase al saldo."
      : "Pasó el límite de 10 horas: la clase se cobra igual y no vuelve al saldo."}</div>
    <button class="btn btn-bloque ${aTiempo ? "" : "btn-peligro"}" id="ok-cancelar">
      ${aTiempo ? "Cancelar y recuperar la clase" : "Cancelar de todos modos"}</button>
    <button class="btn btn-2 btn-bloque" id="no-cancelar">Mejor no</button>`,
    cerrar => {
      $("#no-cancelar").onclick = cerrar;
      $("#ok-cancelar").onclick = async () => {
        await Datos.poner("historial", "h-" + r.id + "-" + Date.now(), {
          jineteId:r.jineteId, fecha:r.fecha, hora:r.hora, caballoId:r.caballoId, tipoId:r.tipoId,
          consume:r.consume || 1, estado:aTiempo ? "cancelada_a_tiempo" : "cancelada_tarde",
          cobrada:!aTiempo, cuando:new Date().toISOString() });
        await Datos.quitar("reservas", r.id);
        avisar(aTiempo ? "Clase cancelada y devuelta al saldo." : "Clase cancelada. Se cobra.");
        cerrar(); pintar();
      };
    });
}

/* -------------------------------------------------------------------- cuenta */
$("#btn-quien").addEventListener("click", () => {
  abrirHoja("Entrar como", `
    <p style="font-size:.82rem; color:var(--ink-2)">
      Prototipo sin contraseñas: elige una cuenta de ejemplo para ver el sistema con sus
      permisos. El sistema real pide teléfono o correo (§08).</p>
    <div class="vista">${CUENTAS.map(c => {
      const j = jinete(c.jineteId);
      const bloqueada = c.rol === "admin" && !Datos.esEditor;
      return `<button class="opcion" data-cuenta="${c.id}" aria-pressed="${c.id === cuenta.id}"
        ${bloqueada ? "disabled style=opacity:.45" : ""}>
        <span class="ini" aria-hidden="true">${esc(c.nombre[0])}</span>
        <span><span class="n">${esc(c.nombre)}</span>
          <span class="m">${esc(ROL_NOMBRE[c.rol])}${c.rol === "tutor" ? " de " + esc(j.nombre) : ""}
            · ve ${esc(listar(SECCIONES[c.rol].filter(x => x !== "admin")))}</span></span>
        ${bloqueada ? '<span class="carga">sin permiso<br>de edición</span>'
          : `<span class="carga">${saldo(j)}<br>clases</span>`}</button>`;
    }).join("")}</div>
    ${!Datos.esEditor ? `<div class="nota oro">La cuenta de dirección solo se abre para quien tenga
      permiso de edición de esta página. Ese permiso lo da el almacén, no la app.</div>` : ""}`,
    cerrar => {
      $("#hoja-cuerpo").addEventListener("click", e => {
        const b = e.target.closest("[data-cuenta]"); if (!b || b.disabled) return;
        localStorage.setItem("cq:cuenta", b.dataset.cuenta);
        localStorage.removeItem("cq:direccion");
        cerrar(); irA("inicio");
      });
    });
});

$("#btn-reiniciar").addEventListener("click", () => {
  abrirHoja("Borrar datos de prueba", `
    <p style="font-size:.88rem">Se borran reservas, firmas, recordatorios e inscripciones
      guardadas en este navegador.${Datos.compartido
        ? " Lo que está en el almacén compartido no se toca." : ""}</p>
    <button class="btn btn-peligro btn-bloque" id="ok-borrar">Borrar</button>`,
    cerrar => { $("#ok-borrar").onclick = async () => {
      await Datos.limpiarLocal(); localStorage.removeItem("cq:direccion");
      cerrar(); avisar("Datos locales borrados."); pintar();
    }; });
});

/* --------------------------------------------------------------------- arranque */
Datos.alCambiar = () => pintar();
pintar();
Datos.iniciar();
setInterval(pintar, 60000);
</script>
