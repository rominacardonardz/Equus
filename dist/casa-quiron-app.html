<title>Casa Quirón · Reservas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   Casa Quirón — app de reservas. Identidad provisional (§08 de la
   especificación): al llegar el manual de marca se cambian los tokens.
   ========================================================================== */
:root {
  --verde:#2F4A3C; --verde-cl:#4A6B58; --laton:#A9803F; --hueso:#F6F2EA;

  --bg:#F3EFE7; --surface:#FFFFFF; --surface-2:#FAF7F1; --raised:#FFFFFF;
  --ink:#1B1A17; --ink-2:#5C5648; --ink-3:#8A8271;
  --line:#E2DACA; --line-fuerte:#CFC4AE;
  --accent:var(--verde); --accent-2:var(--laton); --on-accent:var(--hueso);

  --ok:#2E6B4F; --ok-bg:#E4F0E7;
  --alerta:#9C4221; --alerta-bg:#FBEAE1;
  --aviso:#8A6100; --aviso-bg:#FAF0D7;

  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --r:14px; --r-sm:9px;
  --sombra:0 1px 2px rgba(27,26,23,.05), 0 10px 28px -22px rgba(27,26,23,.5);
  --nav-h:4.6rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#14150F; --surface:#1D1F17; --surface-2:#23261C; --raised:#262A1E;
    --ink:#EFEADF; --ink-2:#ABA495; --ink-3:#7D7768;
    --line:#333727; --line-fuerte:#454A36;
    --accent:#93B79F; --accent-2:#CFA463; --on-accent:#14150F;
    --ok:#8FC7A5; --ok-bg:#1E2E23;
    --alerta:#E7A188; --alerta-bg:#33201A;
    --aviso:#D9B463; --aviso-bg:#302819;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  --bg:#14150F; --surface:#1D1F17; --surface-2:#23261C; --raised:#262A1E;
  --ink:#EFEADF; --ink-2:#ABA495; --ink-3:#7D7768;
  --line:#333727; --line-fuerte:#454A36;
  --accent:#93B79F; --accent-2:#CFA463; --on-accent:#14150F;
  --ok:#8FC7A5; --ok-bg:#1E2E23;
  --alerta:#E7A188; --alerta-bg:#33201A;
  --aviso:#D9B463; --aviso-bg:#302819;
}

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.15; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px}
[hidden]{display:none!important}

/* ---------- encabezado ---------- */
.app-head{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:.75rem;
  padding:.6rem 1rem; background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.marca{display:flex; align-items:center; gap:.55rem; margin-right:auto}
.mono-q{
  display:grid; place-items:center; width:2rem; height:2rem; border-radius:7px;
  background:var(--accent); color:var(--on-accent);
  font-family:var(--serif); font-size:1.2rem; line-height:1; padding-bottom:.1rem;
}
.marca b{font-family:var(--serif); font-size:1.05rem; letter-spacing:.03em; font-weight:600}
.quien{
  display:flex; align-items:center; gap:.45rem;
  border:1px solid var(--line-fuerte); border-radius:999px;
  padding:.3rem .65rem .3rem .35rem; font-size:.82rem; background:var(--surface);
}
.avatar{
  display:grid; place-items:center; width:1.55rem; height:1.55rem; border-radius:50%;
  background:var(--accent-2); color:var(--on-accent); font-size:.7rem; font-weight:600;
}

/* ---------- navegación ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
  padding:.6rem .2rem .55rem; font-size:.65rem; letter-spacing:.02em;
  color:var(--ink-3); border-top:2px solid transparent; margin-top:-1px;
}
.tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent); border-top-color:var(--accent)}
.tab .pip{
  position:absolute; margin:-.35rem 0 0 1.1rem; width:7px; height:7px; border-radius:50%;
  background:var(--alerta); border:1.5px solid var(--surface);
}

/* ---------- estructura ---------- */
main{padding:1rem 1rem 2rem; max-width:44rem; margin:0 auto}
.vista{display:grid; gap:1rem}
.vista-titulo{display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; flex-wrap:wrap}
.vista-titulo h2{font-size:1.65rem}
.vista-titulo .sub{font-size:.8rem; color:var(--ink-3)}

.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.tarjeta.plana{background:var(--surface-2); box-shadow:none}
.tarjeta h3{font-size:1.15rem; margin-bottom:.15rem}

.etiqueta{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:500}

.pastilla{
  display:inline-flex; align-items:center; gap:.3rem;
  font-size:.7rem; font-weight:600; letter-spacing:.02em;
  padding:.2rem .5rem; border-radius:999px; white-space:nowrap;
}
.p-ok{background:var(--ok-bg); color:var(--ok)}
.p-alerta{background:var(--alerta-bg); color:var(--alerta)}
.p-aviso{background:var(--aviso-bg); color:var(--aviso)}
.p-neutro{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  background:var(--accent); color:var(--on-accent);
  border-radius:10px; padding:.6rem 1rem; font-size:.88rem; font-weight:600;
  transition:filter .15s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-2{background:var(--surface); color:var(--ink); border:1px solid var(--line-fuerte); font-weight:500}
.btn-peligro{background:none; color:var(--alerta); border:1px solid var(--alerta); font-weight:500}
.btn-bloque{width:100%}
.btn-mini{padding:.35rem .7rem; font-size:.78rem; border-radius:8px}

input[type="text"],input[type="date"],textarea,select{
  width:100%; font:inherit; font-size:.9rem; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-fuerte);
  border-radius:9px; padding:.55rem .7rem;
}
textarea{resize:vertical; min-height:4.5rem}
label.campo{display:grid; gap:.3rem; font-size:.78rem; color:var(--ink-2)}

.vacio{
  text-align:center; padding:2rem 1rem; color:var(--ink-3);
  border:1px dashed var(--line-fuerte); border-radius:var(--r); font-size:.9rem;
}

/* ---------- inicio ---------- */
.resumen{display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem}
.dato{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.85rem}
.dato .n{font-family:var(--serif); font-size:2rem; line-height:1; font-variant-numeric:tabular-nums}
.dato .n.chico{font-size:1.3rem}
.dato .t{font-size:.72rem; color:var(--ink-3); margin-top:.25rem}

.clase{
  display:grid; gap:.5rem; background:var(--surface);
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:.9rem 1rem;
}
.clase.pasada{border-left-color:var(--line-fuerte); opacity:.72}
.clase-cab{display:flex; align-items:baseline; justify-content:space-between; gap:.6rem}
.clase-hora{font-family:var(--serif); font-size:1.3rem; font-variant-numeric:tabular-nums}
.clase-meta{font-size:.82rem; color:var(--ink-2)}
.clase-pie{display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap;
  border-top:1px solid var(--line); padding-top:.55rem; font-size:.78rem; color:var(--ink-3)}
.limite{color:var(--ink-2)}
.limite b{color:var(--ink); font-weight:600}

/* ---------- reservar ---------- */
.ventana{
  display:grid; gap:.5rem; padding:.9rem 1rem; border-radius:var(--r);
  background:var(--surface-2); border:1px solid var(--line);
}
.ventana.abierta{background:var(--ok-bg); border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.ventana.cerrada{background:var(--aviso-bg); border-color:color-mix(in srgb,var(--aviso) 32%,transparent)}
.ventana .titulo{font-weight:600; font-size:.92rem}
.ventana .detalle{font-size:.82rem; color:var(--ink-2)}

.dias{display:grid; grid-template-columns:repeat(7,1fr); gap:.35rem}
.dia{
  display:grid; gap:.1rem; justify-items:center; padding:.5rem .1rem;
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  font-size:.7rem; color:var(--ink-3);
}
.dia .d{font-family:var(--serif); font-size:1.15rem; color:var(--ink); font-variant-numeric:tabular-nums}
.dia[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
.dia[aria-pressed="true"] .d,.dia[aria-pressed="true"]{color:var(--on-accent)}
.dia .punto{width:4px; height:4px; border-radius:50%; background:var(--accent-2)}
.dia[aria-pressed="true"] .punto{background:var(--on-accent)}

.sesion{
  display:grid; grid-template-columns:4.6rem 1fr; gap:.1rem .8rem; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.85rem 1rem;
}
.sesion .hora{
  grid-row:1 / span 2; align-self:start; padding-top:.1rem;
  font-family:var(--serif); font-size:1.2rem; line-height:1.2; font-variant-numeric:tabular-nums;
}
.sesion .nom{font-weight:600; font-size:.95rem}
.sesion .det{font-size:.78rem; color:var(--ink-2); grid-column:2}
.sesion .accion{grid-column:1 / -1; display:flex; justify-content:flex-end; margin-top:.6rem}
.sesion.llena{opacity:.6}
@media (min-width:34rem){
  .sesion{grid-template-columns:4.6rem 1fr auto}
  .sesion .accion{grid-column:3; grid-row:1 / span 2; margin:0}
}

/* ---------- hoja modal ---------- */
.velo{position:fixed; inset:0; z-index:40; background:rgba(18,18,14,.5); display:grid; align-items:end}
@media (min-width:40rem){.velo{align-items:center; justify-items:center}}
.hoja{
  width:100%; max-height:88vh; overflow-y:auto;
  background:var(--bg); border-radius:18px 18px 0 0; padding:1.1rem 1rem 1.5rem;
  display:grid; gap:.85rem;
}
@media (min-width:40rem){.hoja{max-width:32rem; border-radius:18px}}
.hoja-cab{display:flex; align-items:flex-start; justify-content:space-between; gap:1rem}
.hoja-cab h3{font-size:1.3rem}
.cerrar{font-size:1.4rem; line-height:1; color:var(--ink-3); padding:.1rem .4rem}

.caballo{
  display:flex; align-items:center; gap:.75rem; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.7rem .85rem;
}
.caballo[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.caballo .ini{
  display:grid; place-items:center; width:2.4rem; height:2.4rem; border-radius:50%; flex:none;
  background:var(--surface-2); border:1px solid var(--line);
  font-family:var(--serif); font-size:1.1rem;
}
.caballo .n{font-weight:600; font-size:.92rem}
.caballo .m{font-size:.74rem; color:var(--ink-3)}
.caballo .carga{margin-left:auto; font-size:.7rem; color:var(--ink-3); text-align:right}

/* ---------- reglamento ---------- */
.doc{display:grid; gap:.6rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.doc-cab{display:flex; align-items:flex-start; justify-content:space-between; gap:.75rem}
.doc-ver{font-family:var(--mono); font-size:.7rem; color:var(--ink-3)}
.doc-cuerpo{font-size:.88rem; color:var(--ink-2); display:grid; gap:.5rem}
.doc-cuerpo h4{font-family:var(--sans); font-size:.8rem; font-weight:600; color:var(--ink); margin:.3rem 0 0}
.doc-cuerpo ul{margin:0; padding-left:1.1rem; display:grid; gap:.25rem}
.firma{display:grid; gap:.55rem; border-top:1px solid var(--line); padding-top:.75rem}
.firmado{font-size:.78rem; color:var(--ok)}

/* ---------- competencias ---------- */
.comp{display:grid; gap:.55rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.comp-fecha{
  display:grid; justify-items:center; width:3.2rem; padding:.35rem 0; flex:none;
  background:var(--accent); color:var(--on-accent); border-radius:10px;
}
.comp-fecha .d{font-family:var(--serif); font-size:1.35rem; line-height:1}
.comp-fecha .m{font-size:.6rem; letter-spacing:.1em; text-transform:uppercase}
.comp-cab{display:flex; gap:.85rem; align-items:flex-start}
.comp-cab h3{font-size:1.15rem}
.comp-datos{display:grid; gap:.3rem; font-size:.8rem; color:var(--ink-2); border-top:1px solid var(--line); padding-top:.6rem}
.comp-datos div{display:grid; grid-template-columns:6.5rem 1fr; gap:.5rem}
.comp-datos dt{color:var(--ink-3)}

/* ---------- recordatorios ---------- */
.rec{
  display:flex; align-items:flex-start; gap:.7rem;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.8rem .9rem;
}
.rec.auto{background:var(--surface-2); border-style:dashed}
.rec.vencido{border-left:3px solid var(--alerta)}
.rec .txt{flex:1; min-width:0}
.rec .txt .t{font-size:.9rem; font-weight:500}
.rec .txt .f{font-size:.75rem; color:var(--ink-3); margin-top:.1rem}
.rec.hecho .txt .t{text-decoration:line-through; color:var(--ink-3); font-weight:400}
.marcar{
  width:1.35rem; height:1.35rem; flex:none; margin-top:.15rem;
  border:1.5px solid var(--line-fuerte); border-radius:6px; display:grid; place-items:center;
}
.marcar[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.marcar svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}

/* ---------- avisos ---------- */
.nota{
  display:grid; gap:.3rem; padding:.75rem .9rem; border-radius:var(--r-sm);
  font-size:.82rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2);
}
.nota b{color:var(--ink)}
.nota.alerta{background:var(--alerta-bg); border-color:color-mix(in srgb,var(--alerta) 30%,transparent); color:var(--alerta)}
.nota.alerta b{color:var(--alerta)}

.brindis{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 1rem); transform:translateX(-50%);
  z-index:50; max-width:min(24rem,92vw);
  background:var(--accent); color:var(--on-accent);
  padding:.7rem 1rem; border-radius:11px; font-size:.85rem; box-shadow:var(--sombra);
}

.pie{
  max-width:44rem; margin:1.5rem auto 0; padding:1.2rem 1rem 0;
  border-top:1px solid var(--line); font-size:.72rem; color:var(--ink-3); text-align:center;
  display:grid; gap:.35rem;
}
.pie button{text-decoration:underline; font-size:.72rem; color:var(--ink-3)}

/* ---------- escritorio ---------- */
@media (min-width:56rem){
  body{padding-bottom:0}
  .tabs{
    position:sticky; top:3.3rem; bottom:auto; grid-template-columns:repeat(5,auto);
    justify-content:center; gap:.25rem; border-top:0; border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 90%,transparent);
  }
  .tab{flex-direction:row; gap:.45rem; font-size:.82rem; padding:.7rem .9rem;
    border-top:0; border-bottom:2px solid transparent; margin:0 0 -1px}
  .tab[aria-selected="true"]{border-top-color:transparent; border-bottom-color:var(--accent)}
  .tab .pip{margin:-.6rem 0 0 .1rem; position:static}
  .resumen{grid-template-columns:repeat(4,1fr)}
  .brindis{bottom:1.5rem}
}
</style>

<header class="app-head">
  <div class="marca">
    <span class="mono-q" aria-hidden="true">Q</span>
    <b>Casa Quirón</b>
  </div>
  <button class="quien" id="btn-quien">
    <span class="avatar" id="quien-ini" aria-hidden="true">—</span>
    <span id="quien-nombre">Elegir perfil</span>
  </button>
</header>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <button class="tab" role="tab" data-vista="inicio" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
    Inicio
  </button>
  <button class="tab" role="tab" data-vista="reservar" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
    Reservar
  </button>
  <button class="tab" role="tab" data-vista="reglamento" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
    Reglamento
  </button>
  <button class="tab" role="tab" data-vista="competencias" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6M10 17h4l1 3H9z"/></svg>
    Competencias
  </button>
  <button class="tab" role="tab" data-vista="recordatorios" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    Recordatorios
  </button>
</nav>

<main>
  <section class="vista" id="v-inicio"></section>
  <section class="vista" id="v-reservar" hidden></section>
  <section class="vista" id="v-reglamento" hidden></section>
  <section class="vista" id="v-competencias" hidden></section>
  <section class="vista" id="v-recordatorios" hidden></section>

  <footer class="pie">
    <p id="pie-datos">Casa Quirón · Sistema de reservas</p>
    <p>Catálogo, horarios, caballos y competencias son <b>datos de ejemplo</b> para probar el flujo, no el catálogo real del club.</p>
    <p><button id="btn-reiniciar" type="button">Borrar mis datos de prueba</button></p>
  </footer>
</main>

<div id="capa"></div>
<div class="brindis" id="brindis" hidden></div>

<script>
"use strict";
/* ==========================================================================
   Casa Quirón — reservas, reglamento, competencias y recordatorios.

   Las reglas de negocio (RN-xx) vienen de la especificación funcional v2.0.
   Aquí se aplican en el navegador: es un prototipo funcional, no el sistema
   de producción, que debe aplicarlas en el servidor (§04 del documento).
   ========================================================================== */

/* ---------------------------------------------------------------- catálogos
   Datos de ejemplo. El administrador los edita en el panel (M1). */

const NIVELES = [
  { id:"cuerdita",      nombre:"Cuerdita",      orden:1 },
  { id:"principiantes", nombre:"Principiantes", orden:2 },
  { id:"intermedio",    nombre:"Intermedio",    orden:3 },
  { id:"avanzado",      nombre:"Avanzado",      orden:4 },
];
const nivelOrden = id => (NIVELES.find(n => n.id === id) || {}).orden || 0;
const nivelNombre = id => (NIVELES.find(n => n.id === id) || {}).nombre || "—";

const CABALLOS = [
  { id:"jazmin",  nombre:"Jazmín",  uso:"escuelita",   min:"principiantes", max:"intermedio", maxDia:3, estatus:"activo" },
  { id:"duende",  nombre:"Duende",  uso:"escuelita",   min:"cuerdita",      max:"principiantes", maxDia:3, estatus:"activo" },
  { id:"nube",    nombre:"Nube",    uso:"escuelita",   min:"cuerdita",      max:"principiantes", maxDia:3, estatus:"activo" },

  { id:"alazan",  nombre:"Alazán",  uso:"escuelita",   min:"intermedio",    max:"avanzado",   maxDia:3, estatus:"activo" },

/* -------------------------------------------------- tiempo en zona del club
   RN-01: toda ventana de tiempo se calcula en la zona horaria del club,
   nunca en la del dispositivo. */
const TZ = "America/Mexico_City";
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function partesClub(fecha) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone:TZ, hour12:false, weekday:"short",
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
  const p = {};
  for (const parte of f.formatToParts(fecha)) if (parte.type !== "literal") p[parte.type] = parte.value;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  return { anio:+p.year, mes:+p.month, dia:+p.day, hora:(+p.hour) % 24, min:+p.minute, seg:+p.second, diaSemana:wd };
}
/* Instante UTC que en el club se lee como la fecha y hora dadas. */
function instanteClub(anio, mes, dia, hora, min) {
  const meta = Date.UTC(anio, mes - 1, dia, hora, min);
  let desfase = desfaseEn(new Date(meta));
  let inst = meta - desfase;
  desfase = desfaseEn(new Date(inst));
  return new Date(meta - desfase);
}
function desfaseEn(instante) {
  const p = partesClub(instante);
  return Date.UTC(p.anio, p.mes - 1, p.dia, p.hora, p.min, p.seg) - instante.getTime();
}
const ymd = fecha => { const p = partesClub(fecha); return `${p.anio}-${String(p.mes).padStart(2,"0")}-${String(p.dia).padStart(2,"0")}`; };
function deYmd(clave, hora = "00:00") {
  const [a,m,d] = clave.split("-").map(Number);
  const [h,mi]  = hora.split(":").map(Number);
  return instanteClub(a, m, d, h, mi);
}
const ahora = () => new Date();

function fechaLarga(clave) {
  const [a,m,d] = clave.split("-").map(Number);
  const inst = instanteClub(a, m, d, 12, 0);
  return `${DIAS[partesClub(inst).diaSemana]} ${d} de ${MESES[m-1]}`;
}
function horaTexto(fecha) {
  const p = partesClub(fecha);
  const h12 = p.hora % 12 === 0 ? 12 : p.hora % 12;
  return `${h12}:${String(p.min).padStart(2,"0")} ${p.hora < 12 ? "a.m." : "p.m."}`;
}
/* "el jueves 7:00 a.m." — la leyenda exacta que pide M5. */
function momentoTexto(fecha) {
  const p = partesClub(fecha);
  return `el ${DIAS[p.diaSemana]} ${horaTexto(fecha)}`;
}
function lunesDeLaSemana(fecha) {
  const p = partesClub(fecha);
  const retro = (p.diaSemana + 6) % 7;
  const base = instanteClub(p.anio, p.mes, p.dia, 12, 0);
  return new Date(base.getTime() - retro * 864e5);
}
function sumarDias(fecha, n) { return new Date(fecha.getTime() + n * 864e5); }

/* Competencias, fechadas contra hoy para que el calendario siga vivo (M10). */

function docsDe(m) {

/* ------------------------------------------------------------ almacenamiento
   Con la capacidad `db` los datos son compartidos y persistentes: si otra
   jinete aparta a Jazmín, desaparece de tu lista (RN-08). Sin ella la página
   sigue funcionando contra el almacenamiento del navegador. */
const COLECCIONES = ["reservas","historial","recordatorios","aceptaciones","inscripciones"];

const Datos = {
  db: null,
  cache: Object.fromEntries(COLECCIONES.map(c => [c, {}])),
  alCambiar: () => {},

  get compartido() { return this.db !== null; },

  async iniciar() {
    for (const c of COLECCIONES) this.cache[c] = this.leerLocal(c);
    try {
      const db = window.claude && (await window.claude.use("db"));
      if (db) {
        this.db = db;
        for (const c of COLECCIONES) {
          db.collection(c).onSnapshot(
            snap => {
              const siguiente = {};
              snap.docs.forEach(d => { siguiente[d.id] = d.data(); });
              this.cache[c] = siguiente;
              this.alCambiar();
            },
            () => {}
          );
        }
        this.alCambiar();
      }
    } catch (e) { /* sin db: se queda en local */ }
  },

  leerLocal(c) {
    try { return JSON.parse(localStorage.getItem("cq:" + c) || "{}"); } catch (e) { return {}; }
  },
  guardarLocal(c) {
    try { localStorage.setItem("cq:" + c, JSON.stringify(this.cache[c])); } catch (e) {}
  },

  todo(c) { return Object.entries(this.cache[c] || {}).map(([id, d]) => ({ id, ...d })); },

  async poner(c, id, datos) {
    this.cache[c][id] = datos;
    if (this.db) { await this.db.collection(c).doc(id).set(datos); }
    else { this.guardarLocal(c); this.alCambiar(); }
  },

  async quitar(c, id) {
    delete this.cache[c][id];
    if (this.db) { await this.db.collection(c).doc(id).delete(); }
    else { this.guardarLocal(c); this.alCambiar(); }
  },

  /* Aparta el lugar primero, escribe después: sin esto dos jinetes pueden
     creer que ganaron el mismo caballo (RN-08). */
  async apartar(c, id, datos, quien) {
    if (!this.db) {
      if (this.cache[c][id]) return false;
      await this.poner(c, id, datos);
      return true;
    }
    const ref = this.db.collection(c).doc(id);
    const lease = await ref.acquire({ holder: quien, ttlMs: 6000 });
    if (!lease.acquired) return false;
    const actual = await ref.get();
    if (actual.exists && actual.data() && actual.data().miembroId) return false;
    await ref.set(datos);
    return true;
  },

  async limpiarLocal() {
    for (const c of COLECCIONES) { this.cache[c] = {}; try { localStorage.removeItem("cq:" + c); } catch (e) {} }
  },
};
</script>

<script>
"use strict";
/* ----------------------------------------------------- sesiones y reglas */

/* Una sesión real generada desde la plantilla, para una fecha concreta. */
function sesionesDe(claveFecha) {
  const diaSemana = partesClub(deYmd(claveFecha, "12:00")).diaSemana;
  return PLANTILLA.filter(p => p.dia === diaSemana).map(p => {
    const inicio = deYmd(claveFecha, p.hora);
    return {
      id: `${claveFecha}__${p.id}`,
      plantillaId: p.id, fecha: claveFecha, inicio,
      fin: new Date(inicio.getTime() + tipo(p.tipo).min * 60000),
      tipoId: p.tipo, ent: p.ent, esp: p.esp, cupo: p.cupo, niveles: p.niveles,
    };
  }).sort((a,b) => a.inicio - b.inicio);
}

const reservasDe = clave => Datos.todo("reservas").filter(r => r.fecha === clave);
const misReservas = id => Datos.todo("reservas").filter(r => r.miembroId === id)
  .sort((a,b) => deYmd(a.fecha, a.hora) - deYmd(b.fecha, b.hora));

/* RN-01: el límite exacto, diez horas antes del inicio. */
const limiteCancelacion = inicio => new Date(inicio.getTime() - 10 * 3600 * 1000);
const seCancelaSinCosto = inicio => ahora() < limiteCancelacion(inicio);

/* RN-03 y M6: saldo = lo que cargó el administrador menos lo consumido. */
function saldo(m) {
  const usadasActivas = Datos.todo("reservas")
    .filter(r => r.miembroId === m.id)
    .reduce((s, r) => s + (r.consume || 1), 0);
  const usadasCobradas = Datos.todo("historial")
    .filter(h => h.miembroId === m.id && h.cobrada)
    .reduce((s, h) => s + (h.consume || 1), 0);
  return m.clasesCargadas - usadasActivas - usadasCobradas;
}

/* RN-15: sin reglamento y contrato aceptados no hay primera reserva. */
function aceptado(m, doc) {
  return Datos.todo("aceptaciones")
    .some(a => a.miembroId === m.id && a.documentoId === doc.id && a.version === doc.version);
}
const pendientesDeFirma = m => docsDe(m).filter(d => d.obligatorio && !aceptado(m, d));

/* RN-11 y §10.1: la agenda abre y cierra el lunes. Horario supuesto. */
const VENTANA = { abre: 8, cierra: 22 };
function estadoVentana() {
  const p = partesClub(ahora());
  const abierta = p.diaSemana === 1 && p.hora >= VENTANA.abre && p.hora < VENTANA.cierra;
  const lunes = lunesDeLaSemana(ahora());
  const proximo = p.diaSemana === 1 && p.hora < VENTANA.abre ? lunes : sumarDias(lunes, 7);
  return { abierta, proximoLunes: ymd(proximo) };
}
/* RN-20: dirección puede saltarse la ventana; queda marcado en la reserva. */
const modoDireccion = () => localStorage.getItem("cq:direccion") === "1";
function puedeAgendar() { return estadoVentana().abierta || modoDireccion(); }

function traslapa(aIni, aFin, bIni, bFin) { return aIni < bFin && bIni < aFin; }

function intervaloReserva(r) {
  const ini = deYmd(r.fecha, r.hora);
  return [ini, new Date(ini.getTime() + (tipo(r.tipoId).min || 60) * 60000)];
}

/* Caballos que el jinete puede elegir para esta sesión. Lo no disponible se
   oculta (M3), no se muestra en gris. */
function caballosPara(m, sesion) {
  const delDia = reservasDe(sesion.fecha);
  return CABALLOS.filter(c => {
    if (c.estatus !== "activo") return false;                                   // catálogo M1
    if (!m.habilitados.includes(c.id)) return false;                            // RN-04
    const n = nivelOrden(m.nivel);
    if (n < nivelOrden(c.min) || n > nivelOrden(c.max)) return false;           // RN-05
    const suyas = delDia.filter(r => r.caballoId === c.id);
    if (suyas.length >= c.maxDia) return false;                                 // RN-06
    const choca = suyas.some(r => {
      const [i, f] = intervaloReserva(r);
      return traslapa(sesion.inicio, sesion.fin, i, f);
    });
    if (choca) return false;                                                    // RN-08
    return true;
  }).map(c => ({
    ...c,
    trabajadas: delDia.filter(r => r.caballoId === c.id).length,
  }));
}

/* Por qué una sesión no se puede reservar. `null` = se puede. */
function motivoBloqueo(m, sesion) {
  if (!sesion.niveles.includes(m.nivel)) return "oculta";                       // RN-12
  if (sesion.inicio <= ahora()) return "Ya pasó";
  const ocupadas = reservasDe(sesion.fecha).filter(r => r.plantillaId === sesion.plantillaId);
  if (ocupadas.some(r => r.miembroId === m.id)) return "Ya la reservaste";
  const cap = (ESPACIOS.find(e => e.id === sesion.esp) || {}).cap || sesion.cupo;
  if (ocupadas.length >= Math.min(sesion.cupo, cap)) return "Sin lugares";      // RN-09
  const propias = misReservas(m.id).filter(r => r.fecha === sesion.fecha);
  const encimada = propias.some(r => {
    const [i, f] = intervaloReserva(r);
    return traslapa(sesion.inicio, sesion.fin, i, f);
  });
  if (encimada) return "Tienes otra clase a esa hora";                          // RN-10
  if (saldo(m) < tipo(sesion.tipoId).consume) return "Sin clases disponibles";  // RN-03
  if (pendientesDeFirma(m).length) return "Falta firmar documentos";            // RN-15
  if (!caballosPara(m, sesion).length) return "Sin caballos disponibles";       // RN-04/06/08
  if (!puedeAgendar()) return "Fuera de la ventana del lunes";                  // RN-11
  return null;
}

const lugaresLibres = sesion => {
  const cap = (ESPACIOS.find(e => e.id === sesion.esp) || {}).cap || sesion.cupo;
  const tope = Math.min(sesion.cupo, cap);
  return tope - reservasDe(sesion.fecha).filter(r => r.plantillaId === sesion.plantillaId).length;
};

/* ------------------------------------------------------------ recordatorios
   Los propios los escribe el jinete; los automáticos salen de sus reservas y
   del calendario, como pide M12. */
function recordatoriosAuto(m) {
  const lista = [];
  for (const r of misReservas(m.id)) {
    const inicio = deYmd(r.fecha, r.hora);
    const limite = limiteCancelacion(inicio);
    if (limite > ahora()) {
      lista.push({ id:"auto-lim-" + r.id, auto:true, vence:limite,
        texto:`Último momento para cancelar sin costo tu ${tipo(r.tipoId).nombre.toLowerCase()} del ${fechaLarga(r.fecha)}` });
    }
  }
  for (const c of COMPETENCIAS) {
    const cierre = deYmd(c.fechaCierre, "20:00");
    if (cierre > ahora()) {
      lista.push({ id:"auto-comp-" + c.id, auto:true, vence:cierre,
        texto:`Cierran las inscripciones de ${c.nombre}` });
    }
  }
  const v = estadoVentana();
  if (!v.abierta) {
    lista.push({ id:"auto-ventana", auto:true, vence:deYmd(v.proximoLunes, "08:00"),
      texto:"Se abre la agenda de la semana: deja reservadas todas tus clases" });
  }
  return lista.sort((a,b) => a.vence - b.vence);
}
const misRecordatorios = id => Datos.todo("recordatorios").filter(r => r.miembroId === id);
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ estado */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const yoId = () => localStorage.getItem("cq:yo") || "romy";
let yo = miembro(yoId()) || MIEMBROS[0];
let vista = "inicio";
let diaSel = ymd(ahora());
const sesionTab = "t" + Math.random().toString(36).slice(2, 10);

function avisar(texto) {
  const b = $("#brindis");
  b.textContent = texto; b.hidden = false;
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => { b.hidden = true; }, 3600);
}

/* -------------------------------------------------------------- hoja modal */
function abrirHoja(titulo, contenido, alMontar) {
  const capa = $("#capa");
  capa.innerHTML = `<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="hoja-cab"><h3>${esc(titulo)}</h3><button class="cerrar" aria-label="Cerrar">&times;</button></div>
    <div id="hoja-cuerpo">${contenido}</div></div></div>`;
  const cerrar = () => { capa.innerHTML = ""; document.body.style.overflow = ""; };
  document.body.style.overflow = "hidden";
  capa.querySelector(".cerrar").onclick = cerrar;
  capa.querySelector(".velo").onclick = e => { if (e.target === capa.querySelector(".velo")) cerrar(); };
  document.addEventListener("keydown", function esc2(e) {
    if (e.key === "Escape") { cerrar(); document.removeEventListener("keydown", esc2); }
  });
  if (alMontar) alMontar(cerrar);
  return cerrar;
}

/* ------------------------------------------------------------------- INICIO */
function verInicio() {
  const s = saldo(yo);
  const proximas = misReservas(yo.id).filter(r => deYmd(r.fecha, r.hora) > ahora());
  const pasadas  = misReservas(yo.id).filter(r => deYmd(r.fecha, r.hora) <= ahora()).reverse();
  const firmas = pendientesDeFirma(yo);
  const v = estadoVentana();
  const sigComp = COMPETENCIAS.filter(c => deYmd(c.fecha, "23:59") > ahora())
    .sort((a,b) => deYmd(a.fecha) - deYmd(b.fecha))[0];
  const prox = proximas[0];

  return `
  <div class="vista-titulo">
    <h2>Hola, ${esc(yo.nombre.split(" ")[0])}</h2>
    <span class="sub">${esc(nivelNombre(yo.nivel))}${yo.perfiles.includes("propietario") ? " · Propietaria" : ""}</span>
  </div>

  ${firmas.length ? `<div class="nota alerta">
    <b>Falta firmar ${firmas.length === 1 ? "un documento" : firmas.length + " documentos"}.</b>
    No puedes reservar hasta aceptar ${esc(listar(firmas.map(d => d.titulo)))}.
    <span><button class="btn btn-mini" data-ir="reglamento" style="margin-top:.35rem">Ir a Reglamento</button></span>
  </div>` : ""}

  <div class="resumen">
    <div class="dato"><div class="n">${s}</div><div class="t">clases disponibles</div></div>
    <div class="dato"><div class="n">${proximas.length}</div><div class="t">clases reservadas</div></div>
    <div class="dato"><div class="n chico">${v.abierta ? "Abierta" : "Cerrada"}</div><div class="t">agenda de la semana</div></div>
    <div class="dato"><div class="n chico">${sigComp ? esc(fechaLarga(sigComp.fecha).replace(/^\w+ /, "")) : "—"}</div><div class="t">próxima competencia</div></div>
  </div>

  ${prox ? `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">Tu próxima clase</p>
    ${tarjetaClase(prox, false)}
  </div>` : `<div class="vacio">No tienes clases reservadas.
    <div style="margin-top:.7rem"><button class="btn btn-mini" data-ir="reservar">Reservar una clase</button></div></div>`}

  ${proximas.length > 1 ? `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">Después</p>
    <div class="vista">${proximas.slice(1).map(r => tarjetaClase(r, false)).join("")}</div>
  </div>` : ""}

  ${pasadas.length ? `<details class="tarjeta plana">
    <summary style="cursor:pointer; font-weight:600; font-size:.9rem">Historial (${pasadas.length})</summary>
    <div class="vista" style="margin-top:.75rem">${pasadas.slice(0, 8).map(r => tarjetaClase(r, true)).join("")}</div>
  </details>` : ""}

  <div class="tarjeta plana">
    <p class="etiqueta">Tu paquete</p>
    <p style="font-size:.95rem; margin-top:.2rem">${esc(yo.paquete)}</p>
    <p style="font-size:.78rem; color:var(--ink-3); margin-top:.3rem">
      El saldo lo carga el administrador después del cobro presencial. No hay pago en línea.</p>
    ${yo.menor ? `<p style="font-size:.78rem; color:var(--ink-3); margin-top:.3rem">
      Cuenta de menor. Tutor responsable: ${esc(yo.tutor)}.</p>` : ""}
  </div>`;
}

function tarjetaClase(r, pasada) {
  const inicio = deYmd(r.fecha, r.hora);
  const limite = limiteCancelacion(inicio);
  const aTiempo = seCancelaSinCosto(inicio);
  return `<article class="clase ${pasada ? "pasada" : ""}">
    <div class="clase-cab">
      <div>
        <div class="clase-hora">${esc(horaTexto(inicio))}</div>
        <div class="clase-meta">${esc(fechaLarga(r.fecha))}</div>
      </div>
      <span class="pastilla ${pasada ? "p-neutro" : "p-ok"}">${esc(tipo(r.tipoId).nombre)}</span>
    </div>
    <div class="clase-meta">
      ${esc(caballo(r.caballoId) ? caballo(r.caballoId).nombre : "—")} ·
      ${esc(entrenador(r.ent))} · ${esc(espacio(r.esp))}
    </div>
    ${r.override ? `<div class="nota" style="padding:.45rem .6rem; font-size:.75rem">
      Agendada por dirección fuera de la ventana del lunes. Queda en la bitácora.</div>` : ""}
    ${pasada ? "" : `<div class="clase-pie">
      ${aTiempo
        ? `<span class="limite">Cancelación sin costo hasta <b>${esc(momentoTexto(limite))}</b></span>
           <button class="btn btn-2 btn-mini" data-cancelar="${esc(r.id)}">Cancelar</button>`
        : `<span class="limite">Pasó el límite de 10 horas: si cancelas, la clase se cobra.</span>
           <button class="btn btn-peligro btn-mini" data-cancelar="${esc(r.id)}">Cancelar de todos modos</button>`}
    </div>`}
  </article>`;
}

/* ----------------------------------------------------------------- RESERVAR */
function verReservar() {
  const v = estadoVentana();
  const lunes = lunesDeLaSemana(ahora());
  const dias = Array.from({ length: 7 }, (_, i) => ymd(sumarDias(lunes, i)));
  if (!dias.includes(diaSel)) diaSel = dias.find(d => deYmd(d, "23:59") > ahora()) || dias[0];

  const sesiones = sesionesDe(diaSel);
  const visibles = sesiones.filter(s => motivoBloqueo(yo, s) !== "oculta");
  const firmas = pendientesDeFirma(yo);

  return `
  <div class="vista-titulo">
    <h2>Reservar</h2>
    <span class="sub">Semana del ${esc(fechaLarga(dias[0]))}</span>
  </div>

  <div class="ventana ${v.abierta ? "abierta" : "cerrada"}">
    <div class="titulo">${v.abierta
      ? "La agenda está abierta"
      : "La agenda está cerrada"}</div>
    <div class="detalle">${v.abierta
      ? `Hoy es lunes. Deja reservadas todas tus clases de la semana antes de las ${VENTANA.cierra}:00.`
      : `Se abre el ${esc(fechaLarga(v.proximoLunes))} a las ${VENTANA.abre}:00. Fuera de esa ventana solo el administrador puede agendar.`}</div>
    ${!v.abierta ? `<label style="display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem; margin-top:.2rem">
      <input type="checkbox" id="chk-direccion" ${modoDireccion() ? "checked" : ""} style="width:auto; margin-top:.2rem">
      <span>Agendar como dirección (RN-20). Las reservas quedan marcadas en la bitácora.</span>
    </label>` : ""}
  </div>

  ${firmas.length ? `<div class="nota alerta">
    <b>Primero firma tus documentos.</b> ${esc(listar(firmas.map(d => d.titulo)))} siguen pendientes.
    <span><button class="btn btn-mini" data-ir="reglamento" style="margin-top:.35rem">Ir a Reglamento</button></span>
  </div>` : ""}

  ${saldo(yo) <= 0 ? `<div class="nota alerta">
    <b>No te quedan clases.</b> El administrador carga tu saldo en el club una vez que pagas.</div>` : ""}

  <div class="dias">
    ${dias.map(d => {
      const p = partesClub(deYmd(d, "12:00"));
      const hay = sesionesDe(d).some(s => s.niveles.includes(yo.nivel));
      const pasado = deYmd(d, "23:59") < ahora();
      return `<button class="dia" data-dia="${d}" aria-pressed="${d === diaSel}" ${pasado ? "disabled style=opacity:.4" : ""}>
        <span>${DIAS[p.diaSemana].slice(0,2)}</span>
        <span class="d">${p.dia}</span>
        ${hay && !pasado ? '<span class="punto"></span>' : '<span style="height:4px"></span>'}
      </button>`;
    }).join("")}
  </div>

  <div class="vista">
    ${visibles.length ? visibles.map(s => filaSesion(s)).join("")
      : `<div class="vacio">No hay clases para tu nivel el ${esc(fechaLarga(diaSel))}.</div>`}
  </div>

  <p style="font-size:.75rem; color:var(--ink-3)">
    Solo se muestran las clases que tu nivel y tu paquete autorizan (RN-12).</p>`;
}

function filaSesion(s) {
  const motivo = motivoBloqueo(yo, s);
  const libres = lugaresLibres(s);
  return `<article class="sesion ${motivo && motivo !== null ? "llena" : ""}">
    <div class="hora">${esc(horaTexto(s.inicio))}</div>
    <div class="nom">${esc(tipo(s.tipoId).nombre)}</div>
    <div class="det">${esc(entrenador(s.ent))} · ${esc(espacio(s.esp))} ·
      ${libres > 0 ? `${libres} ${libres === 1 ? "lugar" : "lugares"}` : "lleno"} ·
      consume ${tipo(s.tipoId).consume}</div>
    <div class="accion">${motivo
      ? `<span class="pastilla p-neutro">${esc(motivo)}</span>`
      : `<button class="btn btn-mini" data-reservar="${esc(s.id)}">Reservar</button>`}</div>
  </article>`;
}

/* Paso 3 de M3: elegir caballo entre los habilitados y libres. */
function elegirCaballo(sesionId) {
  const [fecha, plantillaId] = sesionId.split("__");
  const s = sesionesDe(fecha).find(x => x.plantillaId === plantillaId);
  if (!s) return;
  const opciones = caballosPara(yo, s);
  const limite = limiteCancelacion(s.inicio);

  const cuerpo = `
    <p style="font-size:.85rem; color:var(--ink-2)">
      ${esc(fechaLarga(fecha))} · ${esc(horaTexto(s.inicio))} · ${esc(entrenador(s.ent))} · ${esc(espacio(s.esp))}</p>
    <p class="etiqueta">Elige caballo</p>
    <div class="vista" id="lista-caballos">
      ${opciones.map(c => `<button class="caballo" data-caballo="${c.id}" aria-pressed="false">
        <span class="ini" aria-hidden="true">${esc(c.nombre[0])}</span>
        <span><span class="n">${esc(c.nombre)}</span>
          <span class="m">${esc(nivelNombre(c.min))} a ${esc(nivelNombre(c.max))}</span></span>
        <span class="carga">${c.trabajadas}/${c.maxDia}<br>clases hoy</span>
      </button>`).join("")}
    </div>
    <div class="nota">Se descuenta <b>${tipo(s.tipoId).consume}</b> de tu saldo.
      Podrás cancelar sin costo hasta <b>${esc(momentoTexto(limite))}</b>.</div>
    <button class="btn btn-bloque" id="confirmar" disabled>Confirmar reserva</button>`;

  abrirHoja(tipo(s.tipoId).nombre, cuerpo, cerrar => {
    let elegido = null;
    const btn = $("#confirmar");
    $("#lista-caballos").addEventListener("click", e => {
      const b = e.target.closest("[data-caballo]");
      if (!b) return;
      elegido = b.dataset.caballo;
      $("#lista-caballos").querySelectorAll(".caballo").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
      btn.disabled = false;
    });
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Apartando…";
      const ok = await confirmarReserva(s, elegido);
      if (ok) cerrar();
      else { btn.disabled = false; btn.textContent = "Confirmar reserva"; }
    };
  });
}

async function confirmarReserva(s, caballoId) {
  const motivo = motivoBloqueo(yo, s);
  if (motivo) { avisar(motivo); return false; }
  const id = `${s.fecha}__${s.plantillaId}__${caballoId}`;
  const datos = {
    miembroId: yo.id, fecha: s.fecha, hora: PLANTILLA.find(p => p.id === s.plantillaId).hora,
    plantillaId: s.plantillaId, caballoId, tipoId: s.tipoId, ent: s.ent, esp: s.esp,
    consume: tipo(s.tipoId).consume, creada: new Date().toISOString(),
    override: !estadoVentana().abierta,
  };
  const gano = await Datos.apartar("reservas", id, datos, sesionTab);
  if (!gano) {
    avisar(`${caballo(caballoId).nombre} lo acaba de apartar alguien más.`);
    pintar();
    return false;
  }
  avisar(`Listo. Cancelación sin costo hasta ${momentoTexto(limiteCancelacion(s.inicio))}.`);
  pintar();
  return true;
}

async function cancelar(reservaId) {
  const r = Datos.todo("reservas").find(x => x.id === reservaId);
  if (!r) return;
  const inicio = deYmd(r.fecha, r.hora);
  const aTiempo = seCancelaSinCosto(inicio);
  const mensaje = aTiempo
    ? "Se devuelve la clase a tu saldo."
    : "Pasó el límite de 10 horas: la clase se cobra igual y no vuelve a tu saldo.";
  abrirHoja("Cancelar clase", `
    <p style="font-size:.9rem">${esc(fechaLarga(r.fecha))} · ${esc(horaTexto(inicio))} ·
      ${esc(caballo(r.caballoId).nombre)}</p>
    <div class="nota ${aTiempo ? "" : "alerta"}">${esc(mensaje)}</div>
    <button class="btn btn-bloque ${aTiempo ? "" : "btn-peligro"}" id="ok-cancelar">
      ${aTiempo ? "Cancelar y recuperar la clase" : "Cancelar de todos modos"}</button>
    <button class="btn btn-2 btn-bloque" id="no-cancelar">Mejor no</button>`,
    cerrar => {
      $("#no-cancelar").onclick = cerrar;
      $("#ok-cancelar").onclick = async () => {
        await Datos.poner("historial", "h-" + r.id + "-" + Date.now(), {
          miembroId: r.miembroId, fecha: r.fecha, hora: r.hora, caballoId: r.caballoId,
          tipoId: r.tipoId, consume: r.consume || 1,
          estado: aTiempo ? "cancelada_a_tiempo" : "cancelada_tarde",
          cobrada: !aTiempo, cuando: new Date().toISOString(),
        });
        await Datos.quitar("reservas", r.id);
        avisar(aTiempo ? "Clase cancelada y devuelta a tu saldo." : "Clase cancelada. Se cobra.");
        cerrar(); pintar();
      };
    });
}
</script>

<script>
"use strict";
/* -------------------------------------------------------------- REGLAMENTO */
function verReglamento() {
  const mios = docsDe(yo);
  return `
  <div class="vista-titulo">
    <h2>Reglamento y contratos</h2>
    <span class="sub">${mios.length} documentos para tu perfil</span>
  </div>
  <p style="font-size:.8rem; color:var(--ink-3)">
    Solo ves los documentos que te corresponden (RN-16). Si dirección publica una versión
    nueva, se te vuelve a pedir la firma.</p>
  ${mios.map(d => bloqueDoc(d)).join("")}
  <p style="font-size:.75rem; color:var(--ink-3)">
    Texto de muestra para probar el flujo de aceptación. Dirección sustituye el contenido
    por el documento oficial del club.</p>`;
}

function bloqueDoc(d) {
  const firma = Datos.todo("aceptaciones")
    .find(a => a.miembroId === yo.id && a.documentoId === d.id && a.version === d.version);
  const versionVieja = Datos.todo("aceptaciones")
    .some(a => a.miembroId === yo.id && a.documentoId === d.id && a.version !== d.version);
  return `<article class="doc">
    <div class="doc-cab">
      <div>
        <h3>${esc(d.titulo)}</h3>
        <p class="doc-ver">Versión ${esc(d.version)} · vigente desde el ${esc(d.vigente)}</p>
      </div>
      ${firma ? '<span class="pastilla p-ok">Aceptado</span>'
        : d.obligatorio ? '<span class="pastilla p-alerta">Por firmar</span>'
        : '<span class="pastilla p-neutro">Informativo</span>'}
    </div>
    <p style="font-size:.85rem; color:var(--ink-2)">${esc(d.resumen)}</p>
    ${versionVieja && !firma ? `<div class="nota alerta">
      Aceptaste una versión anterior. Esta es nueva y hay que volver a firmarla (RN-15).</div>` : ""}
    <details>
      <summary style="cursor:pointer; font-size:.82rem; color:var(--accent); font-weight:500">
        Leer el documento</summary>
      <div class="doc-cuerpo" style="margin-top:.6rem">
        ${d.cuerpo.map(s => `<h4>${esc(s.h)}</h4><ul>${s.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}
      </div>
    </details>
    ${firma
      ? `<p class="firmado">Firmado por ${esc(firma.nombreFirma)} · ${esc(fechaLarga(firma.fecha))}, ${esc(firma.horaTexto)}</p>`
      : `<form class="firma" data-firmar="${esc(d.id)}">
          <label class="campo">
            ${yo.menor ? "Nombre completo del tutor que acepta" : "Escribe tu nombre completo como firma"}
            <input type="text" name="nombre" required autocomplete="name"
              placeholder="${esc(yo.menor ? yo.tutor : yo.nombre)}">
          </label>
          <button class="btn" type="submit">Acepto ${esc(d.titulo.toLowerCase())}</button>
        </form>`}
  </article>`;
}

/* ------------------------------------------------------------ COMPETENCIAS */
function verCompetencias() {
  const futuras = COMPETENCIAS.filter(c => deYmd(c.fecha, "23:59") > ahora())
    .sort((a,b) => deYmd(a.fecha) - deYmd(b.fecha));
  const pasadas = COMPETENCIAS.filter(c => deYmd(c.fecha, "23:59") <= ahora());
  return `
  <div class="vista-titulo">
    <h2>Competencias</h2>
    <span class="sub">${futuras.length} por venir</span>
  </div>
  ${futuras.map(c => bloqueComp(c, false)).join("") || '<div class="vacio">No hay competencias programadas.</div>'}
  ${pasadas.length ? `<p class="etiqueta" style="margin-top:.5rem">Ya realizadas</p>
    ${pasadas.map(c => bloqueComp(c, true)).join("")}` : ""}
  <p style="font-size:.75rem; color:var(--ink-3)">
    Apuntarte aquí avisa al club de tu interés. La inscripción formal y el pago se hacen
    en las oficinas.</p>`;
}

function bloqueComp(c, pasada) {
  const [a,m,d] = c.fecha.split("-").map(Number);
  const inscrito = Datos.todo("inscripciones")
    .some(i => i.miembroId === yo.id && i.competenciaId === c.id);
  const cierraEn = deYmd(c.fechaCierre, "20:00");
  const abierta = !pasada && cierraEn > ahora();
  const cuantos = Datos.todo("inscripciones").filter(i => i.competenciaId === c.id).length;
  return `<article class="comp" style="${pasada ? "opacity:.7" : ""}">
    <div class="comp-cab">
      <div class="comp-fecha" ${pasada ? 'style="background:var(--line-fuerte)"' : ""}>
        <span class="d">${d}</span><span class="m">${esc(MESES[m-1].slice(0,3))}</span>
      </div>
      <div style="flex:1">
        <h3>${esc(c.nombre)}</h3>
        <p style="font-size:.8rem; color:var(--ink-2)">${esc(c.sede)} · ${esc(c.disciplina)}</p>
      </div>
      ${inscrito ? '<span class="pastilla p-ok">Anotada</span>' : ""}
    </div>
    <dl class="comp-datos">
      <div><dt>Categorías</dt><dd>${esc(c.categorias)}</dd></div>
      <div><dt>Cierre</dt><dd>${abierta
        ? esc(fechaLarga(c.fechaCierre)) : pasada ? "—" : "Cerrado"}</dd></div>
      <div><dt>Anotados</dt><dd>${cuantos}</dd></div>
    </dl>
    <p style="font-size:.8rem; color:var(--ink-2)">${esc(c.nota)}</p>
    ${pasada ? "" : abierta
      ? `<button class="btn ${inscrito ? "btn-2" : ""} btn-bloque btn-mini"
           data-comp="${esc(c.id)}">${inscrito ? "Quitar mi nombre" : "Me interesa competir"}</button>`
      : `<div class="nota">Las inscripciones ya cerraron. Habla con dirección si quieres entrar.</div>`}
  </article>`;
}

/* ----------------------------------------------------------- RECORDATORIOS */
function verRecordatorios() {
  const autos = recordatoriosAuto(yo);
  const mios = misRecordatorios(yo.id)
    .sort((a,b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"));
  const hoyClave = ymd(ahora());
  return `
  <div class="vista-titulo">
    <h2>Recordatorios</h2>
    <span class="sub">${mios.filter(r => !r.hecho).length} pendientes</span>
  </div>

  <form class="tarjeta" id="nuevo-rec" style="display:grid; gap:.6rem">
    <label class="campo">Qué no se te puede olvidar
      <input type="text" name="texto" required maxlength="140" placeholder="Llevar los electrolitos de Camelot">
    </label>
    <label class="campo">Para cuándo
      <input type="date" name="fecha" value="${hoyClave}">
    </label>
    <button class="btn" type="submit">Agregar recordatorio</button>
  </form>

  ${mios.length ? `<div class="vista">${mios.map(r => `
    <article class="rec ${r.hecho ? "hecho" : ""} ${!r.hecho && r.fecha && r.fecha < hoyClave ? "vencido" : ""}">
      <button class="marcar" data-hecho="${esc(r.id)}" aria-pressed="${!!r.hecho}"
        aria-label="Marcar como hecho">
        ${r.hecho ? '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' : ""}
      </button>
      <div class="txt">
        <div class="t">${esc(r.texto)}</div>
        <div class="f">${r.fecha ? esc(fechaLarga(r.fecha)) : "sin fecha"}${
          !r.hecho && r.fecha && r.fecha < hoyClave ? " · vencido" : ""}</div>
      </div>
      <button class="btn btn-mini btn-2" data-borrar-rec="${esc(r.id)}">Borrar</button>
    </article>`).join("")}</div>`
    : '<div class="vacio">Todavía no tienes recordatorios propios.</div>'}

  ${autos.length ? `<div>
    <p class="etiqueta" style="margin-bottom:.4rem">Del club, automáticos</p>
    <div class="vista">${autos.map(r => `
      <article class="rec auto">
        <div class="txt">
          <div class="t">${esc(r.texto)}</div>
          <div class="f">${esc(fechaLarga(ymd(r.vence)))} · ${esc(horaTexto(r.vence))}</div>
        </div>
      </article>`).join("")}</div>
    <p style="font-size:.75rem; color:var(--ink-3); margin-top:.5rem">
      Estos salen solos de tus reservas y del calendario. En el sistema final llegan
      además por WhatsApp (M12).</p>
  </div>` : ""}`;
}
</script>

<script>
"use strict";
/* ------------------------------------------------------------------ pintado */
const VISTAS = {
  inicio: verInicio, reservar: verReservar, reglamento: verReglamento,
  competencias: verCompetencias, recordatorios: verRecordatorios,
};

function pintar() {
  yo = miembro(yoId()) || MIEMBROS[0];
  $("#quien-nombre").textContent = yo.nombre;
  $("#quien-ini").textContent = yo.nombre.split(" ").map(p => p[0]).slice(0,2).join("");
  $("#v-" + vista).innerHTML = VISTAS[vista]();
  for (const nombre of Object.keys(VISTAS)) $("#v-" + nombre).hidden = nombre !== vista;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.vista === vista)));

  /* Aviso en la pestaña de reglamento cuando falta firmar (RN-15). */
  const tabReg = document.querySelector('.tab[data-vista="reglamento"]');
  tabReg.querySelector(".pip")?.remove();
  if (pendientesDeFirma(yo).length) {
    const pip = document.createElement("span");
    pip.className = "pip"; tabReg.appendChild(pip);
  }

  $("#pie-datos").textContent = Datos.compartido
    ? "Reservas compartidas: lo que aparta un jinete lo ven todos."
    : "Reservas guardadas solo en este navegador.";
}

function irA(nombre) { vista = nombre; pintar(); window.scrollTo({ top: 0, behavior: "instant" }); }

/* ------------------------------------------------------------------ eventos */
document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) irA(t.dataset.vista);
});

document.addEventListener("click", async e => {
  const ir = e.target.closest("[data-ir]");
  if (ir) return irA(ir.dataset.ir);

  const dia = e.target.closest("[data-dia]");
  if (dia) { diaSel = dia.dataset.dia; return pintar(); }

  const res = e.target.closest("[data-reservar]");
  if (res) return elegirCaballo(res.dataset.reservar);

  const can = e.target.closest("[data-cancelar]");
  if (can) return cancelar(can.dataset.cancelar);

  const comp = e.target.closest("[data-comp]");
  if (comp) {
    const id = comp.dataset.comp;
    const mia = Datos.todo("inscripciones").find(i => i.miembroId === yo.id && i.competenciaId === id);
    if (mia) { await Datos.quitar("inscripciones", mia.id); avisar("Te quitamos de la lista."); }
    else {
      await Datos.poner("inscripciones", `${id}__${yo.id}`,
        { miembroId: yo.id, competenciaId: id, cuando: new Date().toISOString() });
      avisar("Anotada. Dirección confirma tu inscripción en oficinas.");
    }
    return pintar();
  }

  const hecho = e.target.closest("[data-hecho]");
  if (hecho) {
    const r = misRecordatorios(yo.id).find(x => x.id === hecho.dataset.hecho);
    if (r) { const { id, ...resto } = r; await Datos.poner("recordatorios", id, { ...resto, hecho: !r.hecho }); }
    return pintar();
  }

  const borrar = e.target.closest("[data-borrar-rec]");
  if (borrar) { await Datos.quitar("recordatorios", borrar.dataset.borrarRec); return pintar(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "chk-direccion") {
    localStorage.setItem("cq:direccion", e.target.checked ? "1" : "0");
    avisar(e.target.checked
      ? "Modo dirección activo: puedes agendar fuera de la ventana."
      : "Modo dirección apagado.");
    pintar();
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();

  if (e.target.id === "nuevo-rec") {
    const f = new FormData(e.target);
    const texto = String(f.get("texto") || "").trim();
    if (!texto) return;
    await Datos.poner("recordatorios", "r-" + Date.now().toString(36) + "-" + yo.id,
      { miembroId: yo.id, texto, fecha: f.get("fecha") || "", hecho: false });
    avisar("Recordatorio agregado.");
    return pintar();
  }

  const firmar = e.target.dataset.firmar;
  if (firmar) {
    const d = documento(firmar);
    const nombre = String(new FormData(e.target).get("nombre") || "").trim();
    if (nombre.length < 4) return avisar("Escribe el nombre completo.");
    const cuando = ahora();
    await Datos.poner("aceptaciones", `${yo.id}__${d.id}__${d.version}`, {
      miembroId: yo.id, documentoId: d.id, version: d.version, nombreFirma: nombre,
      fecha: ymd(cuando), horaTexto: horaTexto(cuando), sello: cuando.toISOString(),
    });
    avisar(`${d.titulo} aceptado.`);
    return pintar();
  }
});

/* ------------------------------------------------------------------- perfil */
$("#btn-quien").addEventListener("click", () => {
  abrirHoja("¿Quién eres?", `
    <p style="font-size:.82rem; color:var(--ink-2)">
      Prototipo sin contraseñas: elige un perfil de ejemplo para probar el sistema con
      sus permisos y su saldo. El sistema real pide teléfono o correo (§08).</p>
    <div class="vista">
      ${MIEMBROS.map(m => `<button class="caballo" data-perfil="${m.id}" aria-pressed="${m.id === yo.id}">
        <span class="ini" aria-hidden="true">${esc(m.nombre[0])}</span>
        <span><span class="n">${esc(m.nombre)}</span>
          <span class="m">${esc(nivelNombre(m.nivel))}${m.menor ? " · menor, tutor " + esc(m.tutor) : ""}
            · ${esc(m.perfiles.join(" y "))}</span></span>
        <span class="carga">${saldo(m)}<br>clases</span>
      </button>`).join("")}
    </div>`,
    cerrar => {
      $("#hoja-cuerpo").addEventListener("click", e => {
        const b = e.target.closest("[data-perfil]");
        if (!b) return;
        localStorage.setItem("cq:yo", b.dataset.perfil);
        cerrar(); irA("inicio");
      });
    });
});

$("#btn-reiniciar").addEventListener("click", () => {
  abrirHoja("Borrar datos de prueba", `
    <p style="font-size:.88rem">Se borran las reservas, firmas, recordatorios e inscripciones
      ${Datos.compartido ? "guardadas en este navegador. Lo compartido con el club no se toca."
        : "de este navegador."}</p>
    <button class="btn btn-peligro btn-bloque" id="ok-borrar">Borrar</button>`,
    cerrar => {
      $("#ok-borrar").onclick = async () => {
        await Datos.limpiarLocal();
        localStorage.removeItem("cq:direccion");
        cerrar(); avisar("Datos locales borrados."); pintar();
      };
    });
});

/* -------------------------------------------------------------------- inicio */
Datos.alCambiar = () => pintar();
pintar();
Datos.iniciar();
setInterval(pintar, 60000);   /* los límites de 10 h se mueven solos */
</script>
