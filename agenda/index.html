  const ctx = pdfBase("Semana de clases", `${MAESTROS[perfil].nombre} · ${rangoSemana(lunes)}${filtroPista !== "todas" ? " · " + PISTAS[filtroPista] : ""} · ${plural(cs.length, "clase")}`);
  const { doc, W, H, C } = ctx;

    const sel = document.getElementById("c-caballo"); const v = sel.value;
    sel.innerHTML = opcionesCaballo(v, lunesVista, Number(val("c-dia")), val("c-hora"));
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled) sel.value = "";
  };
  /* Solo se escoge pista cuando el alumno tiene más de una para esa fecha. */
  const refrescarPista = () => {
    const a = S.alumnos[val("c-alumno")]; const f = iso(sumarDias(lunes, Number(val("c-dia"))));
    const ops = pistasAlumno(a, f);
    document.getElementById("c-pista").innerHTML = opcionesPista(pistaAlumno(a, f), ops);
    document.getElementById("c-pista-c").hidden = ops.length < 2;
  };
  /* Los lunes no hay clases y el domingo es solo para propietarios. */
  const refrescarDias = () => {
    const a = S.alumnos[val("c-alumno")]; const sel = document.getElementById("c-dia");
    [...sel.options].forEach(o => { o.disabled = !diaPermitido(a, Number(o.value)); });
    if (sel.selectedOptions[0] && sel.selectedOptions[0].disabled) {
      const ok = [...sel.options].find(o => !o.disabled);
      if (ok) { sel.value = ok.value; sel.dispatchEvent(new Event("change")); }
    }
  };
  document.getElementById("c-alumno").addEventListener("change", () => { refrescarDias(); refrescarPista(); info(); });
  document.getElementById("c-repo").addEventListener("change", info);
  document.getElementById("c-dia").addEventListener("change", e => {
    const sel = document.getElementById("c-hora"); const v = sel.value; sel.innerHTML = opcionesHora(v, Number(e.target.value)); refrescarCaballos(); refrescarPista();
  });
  document.getElementById("c-hora").addEventListener("change", refrescarCaballos);
  refrescarDias(); refrescarCaballos(); refrescarPista(); info();
  document.getElementById("f-clase").addEventListener("submit", async e => {
    e.preventDefault();
    const ps = document.getElementById("c-pista");
    const al = S.alumnos[val("c-alumno")];
    if (!diaPermitido(al, Number(val("c-dia")))) { brindis(`${al.nombre} solo monta ${diasTxt(al)}.`); return; }
    const c = { alumnoId: val("c-alumno"), dia: Number(val("c-dia")), hora: val("c-hora"), estado:"programada",
      pista: ps.value || pistaAlumno(S.alumnos[val("c-alumno")], iso(sumarDias(lunes, Number(val("c-dia"))))), repo: document.getElementById("c-repo").checked && !esProp(al), caballoId: val("c-caballo"), caballo:"", nota:"" };
    const sem = clon(S.semanas[lunesVista] || { lunes: lunesVista, clases:{} });
    sem.clases = sem.clases || {};
    if (Object.values(sem.clases).some(x => x.alumnoId === c.alumnoId && x.dia === c.dia && x.hora === c.hora)) { brindis("Ese alumno ya tiene clase a esa hora."); return; }
    sem.lunes = lunesVista; sem.clases[nuevoId()] = c;
    cerrarHoja(); diaSel = c.dia;
    try { await Store.guardarSemana(lunesVista, sem); brindis("Clase agregada");
      registrar(`Agregó ${c.repo ? "reposición" : "clase"} de ${nomA(c.alumnoId)} el ${cuandoTxt(lunesVista, c)}`); } catch (e2) {}
    render();
  });
}

/* ---------- llenar semana con horarios fijos ---------- */
function nuevasDelHorario(lunes) {
  const existentes = Object.values((S.semanas[lunes] || {}).clases || {});
  const r = [];
  for (const a of alumnosActivos()) for (const h of (a.horario || []))
    if (diaPermitido(a, h.dia) && !existentes.some(c => c.alumnoId === a.id && c.dia === h.dia && c.hora === h.hora)) r.push({ a, h });
  return r;
}
function hojaLlenar() {
  const nuevas = nuevasDelHorario(lunesVista);
  if (!nuevas.length) { brindis("La semana ya tiene todos los horarios fijos."); return; }
  abrirHoja(`${cabHoja("Llenar la semana", rangoSemana(lunesVista))}
    <p class="sub">Se agregan ${plural(nuevas.length, "clase")} del horario fijo de cada alumno. Las que ya están no se duplican.</p>
    <div class="tabla-wrap"><table><tbody>${nuevas.map(({ a, h }) => { const k = cuenta(a.id); return `<tr><td>${DIAS[h.dia]} ${fmtHora(h.hora)}</td><td>${esc(a.nombre)}${
      h.caballoId && S.caballos[h.caballoId] ? ` · ${esc(S.caballos[h.caballoId].nombre)}` : ""}</td><td>${
      k.libres <= 0 ? `<span class="pastilla e-falta">Sin clases en paquete</span>` : `<span class="sub">le quedan ${k.saldo}</span>`}</td></tr>`; }).join("")}</tbody></table></div>
    <button class="btn btn-bloque" data-act="confirmar-llenar">Agregar ${plural(nuevas.length, "clase")}</button>`);
}
async function llenar() {
  const lunes = lunesVista;
  const sem = clon(S.semanas[lunes] || { lunes, clases:{} }); sem.lunes = lunes; sem.clases = sem.clases || {};
  const nuevas = nuevasDelHorario(lunes);
  for (const { a, h } of nuevas) sem.clases[nuevoId()] = { alumnoId:a.id, dia:h.dia, hora:h.hora, estado:"programada",
    pista:pistaAlumno(a, iso(sumarDias(deIso(lunes), h.dia))), repo:false, caballoId:(h.caballoId && S.caballos[h.caballoId]) ? h.caballoId : "", caballo:"", nota:"" };
  cerrarHoja();

    registrar(`Llenó la semana del ${rangoSemana(lunes)} con ${plural(nuevas.length, "clase")} del horario fijo`); } catch (e) {}

}

/* ==========================================================================
   Asistente: el maestro escribe en sus palabras, Claude devuelve operaciones
   y la página las aplica sola. Lo último aplicado se puede deshacer.
   ========================================================================== */
const Chat = { abierto:false, mensajes:[], pensando:false, ctl:null, deshacer:null, borrador:"", imagenes:[], miniaturas:{} };

function instruccionesIA() {
  return `Eres el asistente de la agenda de clases de equitación de Equus. Te escribe ${MAESTROS[perfil].nombre}, maestro(a), en español informal, para cambiar su agenda. Conviertes su mensaje en operaciones sobre los DATOS y le contestas en una o dos frases.

Responde SOLO con un objeto JSON: {"respuesta": string, "operaciones": [ ... ]}
- "respuesta": en español, breve y amable; di qué hiciste o qué te falta saber. Si el mensaje es una pregunta ("¿quién tiene reposiciones?"), contéstala con los DATOS y deja "operaciones" vacío.
- Si falta información, el alumno es ambiguo o no existe, NO inventes: pregunta en "respuesta" y deja "operaciones" vacío. Nunca des de alta a alguien que no te pidieron dar de alta.
- Si te piden cambiar el diseño de la página o algo que no está en estas operaciones, explica que eso no lo puedes hacer desde el chat.

Operaciones (campo "tipo" y sus campos; "?" = opcional):
- {"tipo":"agregar_clase","alumnoId","fecha":"AAAA-MM-DD","hora":"HH:MM","caballoId"?,"repo"?:bool,"pista"?,"nota"?}
- {"tipo":"editar_clase","ref","estado"?,"fecha"?,"hora"?,"caballoId"?,"repo"?:bool,"nota"?,"pista"?}   (ref sale de "clases"; fecha u hora mueven la clase)
- {"tipo":"quitar_clase","ref"}
- {"tipo":"alta_alumno","nombre","telefono"?,"nivel"?,"tutor"?,"etiquetas"?:[...],"la_silla"?:bool,"horario"?:[{"dia":"Martes","hora":"HH:MM","caballoId"?}],"paquete"?:{"clases":n,"pagado":bool,"monto"?,"vence"?}}
- {"tipo":"editar_alumno","alumnoId","nombre"?,"telefono"?,"nivel"?,"tutor"?,"notas"?,"la_silla"?:bool,"poner_etiquetas"?:[...],"quitar_etiquetas"?:[...],"horario"?:[...],"baja"?:bool}   ("horario" reemplaza todo su horario fijo)
- {"tipo":"cargar_paquete","alumnoId","clases":n,"pagado":bool,"fecha"?,"monto"?,"vence"?,"forma_pago"?:"efectivo"|"transferencia","comprobante_imagen"?:n}
- {"tipo":"marcar_pago","alumnoId","mes":"AAAA-MM","pagado":bool,"forma_pago"?:"efectivo"|"transferencia","comprobante_imagen"?:n}   (pagan en efectivo o por transferencia; un comprobante de transferencia o depósito es "transferencia")
- {"tipo":"editar_caballo","caballoId"?,"nombre"?,"uso"?:"escuelita"|"propietario","dueno"?,"estatus"?:"activo"|"descanso"|"lesionado","maxDia"?,"maxSemana"?,"notas"?}   (sin caballoId = caballo nuevo)
- {"tipo":"borrar_alumno","alumnoId"}   (lo manda a la papelera; se borra por completo con sus clases en 2 días. Solo si lo piden claramente. Si ya no viene, mejor editar_alumno con "baja": true)
- {"tipo":"borrar_caballo","caballoId"}
- {"tipo":"agregar_pendiente","seccion":"caballos"|"cancelaciones"|"prueba"|"general","texto"?,"fecha"?:"AAAA-MM-DD","hora"?:"HH:MM","caballoId"?,"monta"?:"tania"|"edwin","alumnoId"?,"nombre"?,"telefono"?,"compartir"?:bool}   (anota un pendiente del día. "caballos" = un caballo que hay que montar o trabajar y quién lo monta; "cancelaciones" = alguien canceló o avisó; "prueba" = clase de prueba o alumno nuevo, con su nombre y teléfono; "general" = lo demás. Sin fecha = hoy. "compartir": true si pide que lo vea el otro maestro; si lo monta el otro maestro, compártelo)
- {"tipo":"completar_pendiente","pendienteId","hecho"?:bool}   (marca un pendiente como hecho; "hecho": false lo regresa a pendiente)

Propietarios y alumnos: los alumnos con la etiqueta "propietario" montan de martes a domingo, no tienen límite de clases ni reposiciones (nunca les agendes una reposición). Los demás alumnos montan de martes a sábado y usan paquete y reposiciones. Los lunes no hay clases.
IMÁGENES: el mensaje puede traer fotos o capturas, numeradas 1, 2… en el orden en que llegan.
- Si es un horario, transcríbelo: cada alumno con su día, hora y caballo. Úsalo con agregar_clase para las fechas de esa semana (o la que diga el maestro), o con editar_alumno "horario" si dice que es su horario fijo. Si un alumno o caballo de la imagen no está en DATOS, no lo inventes: dilo en "respuesta" y pregunta si lo das de alta. Si algo no se lee bien, dilo.
- Si es un comprobante de pago (transferencia, depósito, ticket), lee alumno, monto y fecha si se ven, y usa cargar_paquete o marcar_pago con "comprobante_imagen": el número de la imagen. Si no sabes de qué alumno es o cuántas clases, pregunta.
- En "respuesta" resume brevemente lo que leíste.
Estados de una clase: "programada" (por dar), "asistio", "aviso" (faltó pero avisó: no descuenta y deja una reposición), "falta" (faltó sin avisar: descuenta), "cancelada" (la canceló el maestro o el clima: deja una reposición). Una reposición es una clase nueva con "repo": true.

Reglas:
- Usa los ids y refs exactos de los DATOS; busca a los alumnos y caballos por su nombre.
- Fechas relativas ("hoy", "mañana", "el jueves") se calculan desde "hoy". Un día de la semana sin más es el de esta semana (lunes a domingo); si habla en pasado ("faltó el martes") es el que ya pasó; si es para agendar y ese día ya pasó, es el de la semana siguiente.
- Horas en 24 h. Las clases de 7 a 10 son en la mañana y de 4 a 6 en la tarde ("a las 5" = "17:00", "a las 8" = "08:00").
- "Pasar lista" o "todos vinieron" = un editar_clase con estado por cada clase de ese día.
- Si mueve a un alumno de hora y no dice el caballo, conserva el que tenía.
- Etiquetas válidas: ${etiquetasPerfil().join(", ")}. Niveles: cuerdita, principiantes, intermedio, avanzado.
- Pistas: ${pistasDe(perfil).map(p => `${p} (${PISTAS[p]})`).join(", ")}. La pista se pone sola: ${perfil === "tania"
    ? `los alumnos van a Hípico Mty (mty) hasta el 1 de noviembre de 2026 y a Equus (equus) desde el 2; solo los alumnos con "la_silla": true pueden ir a La Silla (silla), que es la suya por omisión`
    : "todas las clases son en Equus"}. No mandes "pista" salvo que te pidan una distinta.`;
}

  const clases = todasLasClases();
  return {
    hoy: hoyIso(), dia_de_hoy: DIAS[diaHoy()], maestro: MAESTROS[perfil].nombre,
    alumnos: alumnosActivos().map(a => { const k = cuenta(a.id, clases); return {
      id:a.id, nombre:a.nombre, telefono:a.telefono || "", nivel:a.nivel || "", tutor:a.tutor || "",
      etiquetas: etiquetasPerfil().filter(t => a[t]), ...(pistasDe(perfil).includes("silla") ? { la_silla:tieneSilla(a) } : {}),
      horario_fijo: (a.horario || []).map(h => `${DIAS[h.dia]} ${h.hora}${h.caballoId && S.caballos[h.caballoId] ? " con " + S.caballos[h.caballoId].nombre : ""}`),
      le_quedan:k.ilimitado ? "sin límite" : k.saldo, reposiciones_pendientes:k.ilimitado ? "no aplica" : k.repoPend,
      paquetes:(a.paquetes || []).map(p => ({ fecha:p.fecha, clases:p.clases, pagado:!!p.pagado, monto:p.monto || null, forma_pago:p.metodo || "", comprobante:!!p.comprobante })) }; }),
    dados_de_baja: Object.entries(S.alumnos).filter(([, a]) => a.baja).map(([id, a]) => ({ id, nombre:a.nombre })),
    caballos: caballosLista().map(c => ({ id:c.id, nombre:c.nombre, uso:usoDe(c), dueno:c.dueno || "", estatus:c.estatus, maxDia:c.maxDia || 0, maxSemana:c.maxSemana || 0 })),
    otro_maestro: { id:otro(perfil), nombre:MAESTROS[otro(perfil)].nombre },
    pendientes: Object.values(S.pendientes || {}).filter(visiblePend).filter(t => !t.hecho || t.fecha >= hoyIso())
      .filter(t => t.fecha <= iso(sumarDias(new Date(), 14))).map(t => ({ id:t.id, seccion:t.seccion, fecha:t.fecha, hora:t.hora || "", texto:t.texto || "",
        caballo:t.caballoId && S.caballos[t.caballoId] ? S.caballos[t.caballoId].nombre : "", monta:t.monta || "", alumno:t.alumnoId && S.alumnos[t.alumnoId] ? S.alumnos[t.alumnoId].nombre : "",
        nombre:t.nombre || "", hecho:!!t.hecho, de:MAESTROS[t.autor] ? MAESTROS[t.autor].nombre : "", compartido:!!t.compartido })),
    clases: clases.filter(c => semanas.has(c.lunes)).map(c => ({
      ref:`${c.lunes}/${c.id}`, fecha:c.fecha, dia:DIAS[c.dia], hora:c.hora, alumno:(S.alumnos[c.alumnoId] || {}).nombre || "?", alumnoId:c.alumnoId,
      estado:c.estado, repo:!!c.repo, caballo:nombreCaballo(c) || null, ...(variasPistas() ? { pista:c.pista } : {}) })),
  };
}

function turnosIA(texto) {
  const previos = Chat.mensajes.slice(-8).map(m => ({ role: m.rol === "yo" ? "user" : "assistant", content: String(m.texto || "…") }));
  while (previos.length && previos[0].role !== "user") previos.shift();
  return [{ role:"user", content: instruccionesIA() }, ...previos,
    { role:"user", content:`DATOS (JSON):\n${JSON.stringify(contextoIA())}\n\nMENSAJE DE ${MAESTROS[perfil].nombre.toUpperCase()}:\n${texto}` }];
}

const normaliza = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const diaDe = x => {
  if (typeof x === "number" && x >= 0 && x <= 6) return x;
  const i = DIAS.findIndex(d => normaliza(d) === normaliza(x));
  if (i < 0) throw new Error(`día no válido (${x})`);
  return i;
};
const horaDe = h => {
  const m = String(h ?? "").match(/^(\d{1,2})(?::(\d{2}))?/);
  if (!m || Number(m[1]) > 23) throw new Error(`hora no válida (${h})`);
  return `${m[1].padStart(2, "0")}:${m[2] || "00"}`;
};
const fechaDe = f => { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(f))) throw new Error(`fecha no válida (${f})`); return String(f); };
const ubicar = f => { const d = deIso(f); return { l: iso(lunesDe(d)), dia: (d.getDay() + 6) % 7 }; };

/* Aplica las operaciones sobre una copia; devuelve la copia, qué documentos
   tocó y un renglón por operación. Nada se guarda aquí. */
function aplicarOperaciones(ops, comps) {
  comps = comps || {};
  const comprobanteDe = op => op.comprobante_imagen != null ? comps[Number(op.comprobante_imagen)] || null : null;
  const metodoDe = op => ["efectivo", "transferencia"].includes(normaliza(op.forma_pago)) ? normaliza(op.forma_pago) : "";
  const D = { semanas:clon(S.semanas), alumnos:clon(S.alumnos), caballos:clon(S.caballos), pendientes:clon(S.pendientes || {}) };
  const T = { semanas:new Set(), alumnos:new Set(), caballos:new Set(), pendientes:new Set() };
  const res = [];
  const alumno = id => { const a = D.alumnos[id]; if (!a) throw new Error("no encontré a ese alumno"); return a; };
  const semana = l => { D.semanas[l] = D.semanas[l] || { lunes:l, clases:{} }; D.semanas[l].clases = D.semanas[l].clases || {}; T.semanas.add(l); return D.semanas[l]; };
  const buscaClase = ref => {
    const [l, id] = String(ref || "").split("/");
    const c = D.semanas[l] && (D.semanas[l].clases || {})[id];
    if (!c) throw new Error("no encontré esa clase");
    return { l, id, c };
  };
  const pistaDe = p => p && pistasDe(perfil).includes(p) ? p : null;
  const caballoLibre = (cid, l, dia, hora, excl) => {
    if (!cid) return { id:"", nota:"" };
    const k = D.caballos[cid]; if (!k) return { id:"", nota:" (no encontré ese caballo)" };
    const u = usoCaballo(cid, l, dia, hora, excl ? { id:excl } : null, clasesDeCaballos(D.semanas));
    const maxD = Number(k.maxDia) || 0, maxS = Number(k.maxSemana) || 0;
    const motivo = k.estatus && k.estatus !== "activo" ? `en ${ESTATUS_CABALLO[k.estatus].toLowerCase()}`
      : u.aLaHora ? "ocupado a esa hora" : maxD && u.dia >= maxD ? `lleno ese día (${u.dia}/${maxD})`

  const etiquetasValidas = l => (Array.isArray(l) ? l : []).map(normaliza).filter(t => etiquetasPerfil().includes(t));
  const horarioDe = l => (Array.isArray(l) ? l : []).map(h => ({ dia:diaDe(h.dia), hora:horaDe(h.hora), caballoId: D.caballos[h.caballoId] ? h.caballoId : "" }));

            if (c.pista && !pistasAlumno(D.alumnos[c.alumnoId], f).includes(c.pista)) c.pista = pistaAlumno(D.alumnos[c.alumnoId], f);
            p.push(`pasa al ${fechaLarga(f)} a las ${fmtHora(hora)}`);
          }
          if (op.estado) { if (!ESTADOS[op.estado]) throw new Error(`estado no válido (${op.estado})`); c.estado = op.estado; p.push(ESTADOS[op.estado].nombre.toLowerCase()); }
          if (op.caballoId !== undefined) { const cab = caballoLibre(op.caballoId, l, c.dia, c.hora, id); c.caballoId = cab.id; p.push(cab.id ? `con ${D.caballos[cab.id].nombre}` : cab.nota.trim() || "sin caballo"); }
          if (op.repo !== undefined) { c.repo = !!op.repo && !esProp(D.alumnos[c.alumnoId]); p.push(c.repo ? "es reposición" : "no es reposición"); }

        }
        case "quitar_clase": {

        case "alta_alumno": {

          const id = nuevoId();

          if (op.paquete && Number(op.paquete.clases) > 0) a.paquetes.push({ id:nuevoId(), clases:Number(op.paquete.clases), fecha:hoyIso(),
            vence:op.paquete.vence ? fechaDe(op.paquete.vence) : "", monto:Number(op.paquete.monto) || null, pagado:!!op.paquete.pagado });

        }
        case "editar_alumno": {
          const a = alumno(op.alumnoId); const p = [];
          for (const k of ["nombre","telefono","tutor","notas"]) if (op[k] !== undefined) { a[k] = String(op[k] || "").trim(); p.push(k === "telefono" ? "teléfono" : k); }
          if (op.nivel !== undefined && (op.nivel === "" || NIVELES.some(n => n.id === op.nivel))) { a.nivel = op.nivel; p.push("nivel"); }
          if (op.la_silla !== undefined) { a.silla = !!op.la_silla; p.push(a.silla ? "La Silla habilitada" : "sin La Silla"); }
          etiquetasValidas(op.poner_etiquetas).forEach(t => { a[t] = true; p.push(`+ ${ETIQUETAS[t].nombre}`); });
          etiquetasValidas(op.quitar_etiquetas).forEach(t => { a[t] = false; p.push(`− ${ETIQUETAS[t].nombre}`); });
          if (op.horario !== undefined) { a.horario = horarioDe(op.horario); p.push("horario fijo"); }
          if (op.baja !== undefined) { a.baja = !!op.baja; a.bajaEn = a.baja ? hoyIso() : ""; p.push(a.baja ? "dado de baja" : "reactivado"); }
          const fuera = (a.horario || []).filter(h => !diaPermitido(a, h.dia)).length;
          if (fuera) { a.horario = a.horario.filter(h => diaPermitido(a, h.dia)); p.push(`quité ${plural(fuera, "día")} del horario fuera de ${diasTxt(a)}`); }
          T.alumnos.add(op.alumnoId);

          break;

        case "cargar_paquete": {
          const a = alumno(op.alumnoId); const n = Number(op.clases); if (!(n > 0)) throw new Error("número de clases no válido");
          a.paquetes = a.paquetes || [];
          a.paquetes.push({ id:nuevoId(), clases:n, fecha:op.fecha ? fechaDe(op.fecha) : hoyIso(), vence:op.vence ? fechaDe(op.vence) : "",
            monto:Number(op.monto) || null, pagado:!!op.pagado, metodo:metodoDe(op), comprobante:comprobanteDe(op) });
          T.alumnos.add(op.alumnoId);
          res.push({ ok:true, texto:`Paquete de ${n} clases para ${a.nombre} (${op.pagado ? "pagado" : "pago pendiente"})${comprobanteDe(op) ? " con comprobante" : ""}` });
          break;
        }
        case "marcar_pago": {
          const a = alumno(op.alumnoId); const mes = String(op.mes || hoyIso()).slice(0, 7);
          const del = (a.paquetes || []).filter(p => (p.fecha || "").startsWith(mes));
          if (!del.length) throw new Error(`${a.nombre} no tiene paquete cargado en ${MESES_LARGO[Number(mes.slice(5, 7)) - 1] || mes}`);
          del.forEach(p => { p.pagado = op.pagado !== false; if (metodoDe(op)) p.metodo = metodoDe(op); });
          if (comprobanteDe(op)) del[del.length - 1].comprobante = comprobanteDe(op);
          T.alumnos.add(op.alumnoId);
          res.push({ ok:true, texto:`${a.nombre}: ${op.pagado !== false ? "pagado" : "pago pendiente"} en ${MESES_LARGO[Number(mes.slice(5, 7)) - 1] || mes}${comprobanteDe(op) ? ", con comprobante" : ""}` });
          break;

          const k = nuevo ? { id, nombre:"", uso:"escuelita", estatus:"activo", maxDia:0, maxSemana:0, notas:"" } : D.caballos[id];

          break;
        }
        case "agregar_pendiente": {

            fecha:op.fecha ? fechaDe(op.fecha) : hoyIso(), hora:op.hora ? horaDe(op.hora) : "", compartido:!!op.compartir,
            caballoId:"", monta:"", alumnoId:"", nombre:"", telefono:"" };

            if (x.monta !== perfil) x.compartido = true;
          }
          if (sec === "cancelaciones" && op.alumnoId) { if (!D.alumnos[op.alumnoId]) throw new Error("no encontré a ese alumno"); x.alumnoId = op.alumnoId; }
          if (sec === "prueba") { x.nombre = String(op.nombre || "").trim(); x.telefono = String(op.telefono || "").trim(); }
          if (!x.texto && !x.caballoId && !x.alumnoId && !x.nombre) throw new Error("el pendiente quedó vacío");
          D.pendientes[x.id] = x; T.pendientes.add(x.id);
          const quien = sec === "caballos" ? `${D.caballos[x.caballoId].nombre} (lo monta ${MAESTROS[x.monta].nombre})` : sec === "prueba" ? (x.nombre || x.texto) : sec === "cancelaciones" && x.alumnoId ? D.alumnos[x.alumnoId].nombre : x.texto;
          res.push({ ok:true, texto:`Anoté en Pendientes (${SECCIONES_PEND.find(z => z.id === sec).nombre}) para el ${fechaLarga(x.fecha)}: ${quien}${x.compartido ? `, compartido con ${MAESTROS[otro(perfil)].nombre}` : ""}` });

        }
        case "completar_pendiente": {

          const h = op.hecho !== false; Object.assign(t, { hecho:h, hechoPor:h ? perfil : "", hechoEn:h ? Date.now() : 0 }); T.pendientes.add(t.id);
          res.push({ ok:true, texto:`${h ? "Marqué como hecho" : "Regresé a pendiente"}: ${t.texto || t.nombre || (D.caballos[t.caballoId] || {}).nombre || "el pendiente"}` });
          break;
        }

      }
    } catch (e) { res.push({ ok:false, texto:e.message }); }

}

async function guardarCambios(D, T) {
  const previo = { semanas:{}, alumnos:{}, caballos:{}, pendientes:{} };
  for (const l of T.semanas) { previo.semanas[l] = S.semanas[l] ? clon(S.semanas[l]) : null; await Store.guardarSemana(l, D.semanas[l]); }
  for (const id of T.alumnos) { previo.alumnos[id] = S.alumnos[id] ? clon(S.alumnos[id]) : null; D.alumnos[id] ? await Store.guardarAlumno({ ...D.alumnos[id], id }) : await Store.borrarAlumno(id); }
  for (const id of T.caballos) { previo.caballos[id] = S.caballos[id] ? clon(S.caballos[id]) : null; D.caballos[id] ? await Store.guardarCaballo({ ...D.caballos[id], id }) : await Store.borrarCaballo(id); }
  for (const id of T.pendientes || []) { previo.pendientes[id] = S.pendientes[id] ? clon(S.pendientes[id]) : null; D.pendientes[id] ? await Store.guardarPendiente(D.pendientes[id]) : await Store.borrarPendiente(id); }
  return previo;
}
async function restaurar(previo) {
  for (const [l, s] of Object.entries(previo.semanas)) s ? await Store.guardarSemana(l, s) : await Store.borrarSemana(l);
  for (const [id, a] of Object.entries(previo.alumnos)) a ? await Store.guardarAlumno({ ...a, id }) : await Store.borrarAlumno(id);
  for (const [id, k] of Object.entries(previo.caballos)) k ? await Store.guardarCaballo({ ...k, id }) : await Store.borrarCaballo(id);
  for (const [id, t] of Object.entries(previo.pendientes || {})) t ? await Store.guardarPendiente(t) : await Store.borrarPendiente(id);
}

const guardarChatSilencioso = () => Store.guardarChat(Chat.mensajes).catch(() => {});

async function enviarChat(texto) {
  texto = String(texto || "").trim();
  const imgs = Chat.imagenes.map(x => x.file);
  if ((!texto && !imgs.length) || Chat.pensando) return;
  if (!Store.sample) { brindis("El asistente funciona con la agenda conectada a la nube."); return; }
  if (!texto) texto = imgs.length > 1 ? "Revisa estas imágenes y pásalas a la agenda." : "Revisa esta imagen y pásala a la agenda.";
  const turnos = turnosIA(imgs.length ? `${texto}\n\n(Van ${plural(imgs.length, "imagen", "imágenes")} adjunta${imgs.length > 1 ? "s" : ""}, numeradas en orden.)` : texto);
  const t = Date.now();
  Chat.miniaturas[t] = Chat.imagenes.map(x => x.url);
  Chat.mensajes = [...Chat.mensajes, { rol:"yo", texto, t, imagenes:imgs.length }];
  Chat.borrador = ""; Chat.imagenes = []; Chat.pensando = true; Chat.ctl = new AbortController();
  renderChat(); guardarChatSilencioso();
  let r;
  try { r = await Store.sample.json(turnos, { modelTier:"default", cache:false, signal:Chat.ctl.signal, ...(imgs.length ? { images:imgs } : {}) }); }
  catch (e) {
    Chat.pensando = false;
    Chat.mensajes = [...Chat.mensajes, { rol:"ia", texto:ERRORES_IA[e && e.code] || "No pude procesar el mensaje. Intenta de nuevo.", t:Date.now(), error:true }];
    renderChat(); guardarChatSilencioso(); return;
  }
  const ops = Array.isArray(r && r.operaciones) ? r.operaciones : [];
  let cambios = [];
  const tr = Date.now();
  if (ops.length) {
    /* Las imágenes que el asistente marcó como comprobante se suben antes de aplicar. */
    const comps = {}; const avisos = [];
    for (const n of [...new Set(ops.map(o => o && o.comprobante_imagen).filter(x => x != null).map(Number))]) {
      const f = imgs[n - 1]; if (!f) continue;
      try { comps[n] = await subirComprobante(f); } catch (e) { avisos.push({ ok:false, texto:`Comprobante de la imagen ${n}: ${e.message}` }); }
    }
    const { D, T, res } = aplicarOperaciones(ops, comps); cambios = [...res, ...avisos];
    if (res.some(x => x.ok)) {
      try { Chat.deshacer = { t:tr, previo: await guardarCambios(D, T) }; registrar(res.filter(x => x.ok).map(x => `Con el asistente: ${x.texto}`)); }
      catch (e) { cambios = [...cambios, { ok:false, texto:"No se pudo guardar en la nube" }]; }
    }
  }
  Chat.pensando = false;
  Chat.mensajes = [...Chat.mensajes, { rol:"ia", texto:String((r && r.respuesta) || "Listo."), t:tr, cambios }];
  render(); renderChat(); guardarChatSilencioso();
}

async function deshacerChat() {
  const d = Chat.deshacer; if (!d) return;
  Chat.deshacer = null;
  try { await restaurar(d.previo); registrar("Deshizo los últimos cambios del asistente"); Chat.mensajes = [...Chat.mensajes, { rol:"ia", texto:"Listo, deshice esos cambios.", t:Date.now() }]; }
  catch (e) { Chat.mensajes = [...Chat.mensajes, { rol:"ia", texto:"No pude deshacer todos los cambios. Revisa la semana.", t:Date.now(), error:true }]; }
  render(); renderChat(); guardarChatSilencioso();
}

    ${Store.sample && Chat.imagenes.length ? `<div class="adjuntos">${Chat.imagenes.map((x, i) => `<div class="adj"><img src="${x.url}" alt="${esc(x.file.name)}"><button type="button" data-act="chat-img-quitar" data-i="${i}" aria-label="Quitar imagen">×</button></div>`).join("")}</div>` : ""}
    ${Store.sample ? `<form class="chat-in" id="f-chat">${Store.limitesImg ? `<button type="button" class="btn btn-2 clip" data-act="chat-img" aria-label="Adjuntar foto de horario o comprobante" title="Adjuntar foto de horario o comprobante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4L15.6 7"/></svg></button>` : ""}<textarea id="chat-txt" rows="2" placeholder="${Chat.imagenes.length ? "Agrega una indicación (opcional)" : `Ej. ${esc(sugerencias[0])}`}" aria-label="Mensaje para el asistente">${esc(Chat.borrador)}</textarea>
        <button class="btn" type="submit" ${Chat.pensando ? "disabled" : ""}>Enviar</button></form>`
      : `<p class="nota" style="margin:.75rem">El asistente funciona con la agenda conectada a la nube.</p>`}`;
  const box = document.getElementById("chat-msgs"); box.scrollTop = box.scrollHeight;
  const ta = document.getElementById("chat-txt");
  if (ta && act) { ta.focus(); ta.setSelectionRange(sel[0], sel[1]); }
}

/* ==========================================================================
   Eventos

let confirmando = null;
function confirmarDosVeces(btn, clave, texto) {
  if (confirmando === clave) { confirmando = null; return true; }
  confirmando = clave; btn.textContent = texto;
  setTimeout(() => { if (confirmando === clave) confirmando = null; }, 4000);
  return false;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "velo") { if (e.target === b) cerrarHoja(); return; }
  switch (act) {
    case "perfil": elegirPerfil(b.dataset.p); break;
    case "cambiar": elegirPerfil(null); break;
    case "vista": vista = b.dataset.v; render(); window.scrollTo(0, 0); break;
    case "semana": {
      const d = Number(b.dataset.d);
      lunesVista = d === 0 ? lunesHoy() : iso(sumarDias(deIso(lunesVista), d));
      diaSel = lunesVista === lunesHoy() ? diaHoy() : 1; render(); break;
    }
    case "dia": diaSel = Number(b.dataset.dia); render(); break;
    case "modo-cal": {
      modoCal = b.dataset.k;
      if (modoCal === "mes") mesCal = iso(sumarDias(deIso(lunesVista), Math.min(diaSel, 6))).slice(0, 7);
      render(); break;
    }
    case "mes-cal": {
      const d = Number(b.dataset.d);
      if (d === 0) mesCal = hoyIso().slice(0, 7);
      else { const [y, m] = mesCal.split("-").map(Number); const x = new Date(y, m - 1 + d, 1); mesCal = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`; }
      render(); break;
    }
    case "ir-dia": {
      const d = deIso(b.dataset.f); lunesVista = iso(lunesDe(d)); diaSel = (d.getDay() + 6) % 7; modoCal = "semana";
      render(); window.scrollTo(0, 0); break;
    }
    case "pista": filtroPista = b.dataset.k; render(); break;
    case "filtro-tag": filtroTag = b.dataset.k; render(); break;
    case "mes": {
      const [y, m] = mesPagos.split("-").map(Number); const d = new Date(y, m - 1 + Number(b.dataset.d), 1);
      mesPagos = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; render(); break;
    }
    case "salud-hecho": {
      const c = S.caballos[b.dataset.id]; if (!c) break; const x = SALUD.find(z => z.id === b.dataset.t);
      const c2 = clon(c); c2.salud = c2.salud || {}; c2.salud[x.id] = { ...(c2.salud[x.id] || {}), ultima:hoyIso(), cada:Number((c2.salud[x.id] || {}).cada) || x.cada };
      Store.guardarCaballo({ ...c2, id:b.dataset.id }).then(() => { brindis(`${x.nombre} de ${c.nombre}: anotado hoy`); registrar(`Anotó ${x.nombre.toLowerCase()} de ${c.nombre} el ${fechaLarga(hoyIso())}`); render(); }).catch(() => {});
      break;
    }
    case "rep-sec": alternarSeccion(b.dataset.k); render(); break;
    case "rep-mes": { const [y2, m2] = mesRep.split("-").map(Number); const d = new Date(y2, m2 - 1 + Number(b.dataset.d), 1); mesRep = iso(d).slice(0, 7); render(); break; }
    case "ir": vista = b.dataset.v; if (b.dataset.v === "semana") { lunesVista = lunesHoy(); diaSel = diaHoy(); modoCal = "semana"; } if (b.dataset.v === "pendientes") pendDia = hoyIso(); render(); window.scrollTo(0, 0); break;
    case "cerrar": cerrarHoja(); break;
    case "nueva-clase": hojaNuevaClase({ dia:b.dataset.dia, alumnoId:b.dataset.alumno, repo:b.dataset.repo === "1", hora:b.dataset.hora }); break;
    case "clase": hojaClase(b.dataset.l, b.dataset.id); break;
    case "estado": {
      hoja.querySelectorAll(".estado-btn").forEach(x => x.setAttribute("aria-pressed", x === b));
      document.getElementById("e-estado").value = b.dataset.e; break;
    }
    case "marcar-rapido": cambiarEstado(b.dataset.l, b.dataset.id, b.dataset.e); break;
    case "lista": hojaLista(Number(b.dataset.dia)); break;
    case "lista-estado": {
      const f = b.closest(".lista-fila"); const ya = b.getAttribute("aria-pressed") === "true";
      f.querySelectorAll(".lo").forEach(x => x.setAttribute("aria-pressed", "false"));
      if (!ya) b.setAttribute("aria-pressed", "true");
      f.dataset.e = ya ? "programada" : b.dataset.e; break;
    }
    case "lista-todos": {
      hoja.querySelectorAll(".lista-fila").forEach(f => {
        if (f.dataset.e !== "programada") return;
        f.dataset.e = "asistio"; f.querySelectorAll(".lo").forEach(x => x.setAttribute("aria-pressed", x.dataset.e === "asistio"));
      }); break;
    }
    case "lista-guardar": guardarLista(); break;
    case "borrar-clase": {
      if (!confirmarDosVeces(b, "c" + b.dataset.id, "Toca otra vez para quitar")) return;
      const s2 = clon(S.semanas[b.dataset.l]); const cq = s2.clases[b.dataset.id]; delete s2.clases[b.dataset.id]; cerrarHoja();
      try { await Store.guardarSemana(b.dataset.l, s2); brindis("Clase quitada");
        if (cq) registrar(`Quitó la clase de ${nomA(cq.alumnoId)} del ${cuandoTxt(b.dataset.l, cq)}`); } catch (e2) {}
      render(); break;
    }
    case "nuevo-alumno": hojaAlumno(); break;
    case "pend-nuevo": hojaPendiente(null, b.dataset.sec); break;
    case "pend-sec": alternarSeccion(b.dataset.k); render(); break;
    case "pago-sec": alternarSeccion(b.dataset.k); render(); break;
    case "pago-ver": pagoDetalle = pagoDetalle === b.dataset.id ? null : b.dataset.id; render(); break;
    case "cab-ver": cabDetalle = cabDetalle === b.dataset.id ? null : b.dataset.id; render(); break;
    case "sem-resumen": resumenSem = !resumenSem; render(); break;
    case "sem-mas": masSem = !masSem; render(); break;
    case "pend-ver": pendDetalle = pendDetalle === b.dataset.id ? null : b.dataset.id; render(); break;
    case "pend-editar": hojaPendiente(b.dataset.id); break;
    case "pend-dia": { const d = Number(b.dataset.d); pendDia = d === 0 ? hoyIso() : iso(sumarDias(deIso(pendDia), d)); render(); break; }
    case "pend-hecho": {
      const t = S.pendientes[b.dataset.id]; if (!t) break;
      const x = { ...t, hecho:!t.hecho, hechoPor:!t.hecho ? perfil : "", hechoEn:!t.hecho ? Date.now() : 0 };
      Store.guardarPendiente(x).then(() => { render(); if (x.hecho) registrar(`Marcó como hecho un pendiente: ${x.texto || x.nombre || (S.caballos[x.caballoId] || {}).nombre || ""}`.trim()); }).catch(() => {});
      render(); break;
    }
    case "pend-compartir": {
      const t = S.pendientes[b.dataset.id]; if (!t || t.autor !== perfil) break;
      const x = { ...t, compartido:!t.compartido };
      Store.guardarPendiente(x).then(() => { brindis(x.compartido ? `Compartido con ${MAESTROS[otro(perfil)].nombre}` : "Ya no se comparte"); render(); }).catch(() => {});
      break;
    }
    case "pend-borrar": {
      const t = S.pendientes[b.dataset.id]; if (!t) break;
      Store.borrarPendiente(t.id).then(() => { cerrarHoja(); brindis("Pendiente borrado"); render(); }).catch(() => {});
      break;
    }
    case "pend-ir": { const d = deIso(b.dataset.f); lunesVista = iso(lunesDe(d)); diaSel = (d.getDay() + 6) % 7; modoCal = "semana"; vista = "semana"; render(); window.scrollTo(0, 0); break; }
    case "pend-alta": {
      const t = S.pendientes[b.dataset.id]; if (!t) break;
      altaDesdePrueba = t.id; hojaAlumno();
      const n = document.getElementById("a-nombre"), tel = document.getElementById("a-tel"), no = document.getElementById("a-notas");
      if (n) n.value = t.nombre || ""; if (tel) tel.value = t.telefono || ""; if (no && t.texto) no.value = `Clase de prueba: ${t.texto}`;
      break;
    }
    case "editar-alumno": hojaAlumno(b.dataset.id); break;
    case "ficha": hojaFicha(b.dataset.id, b.dataset.paquete === "1"); break;
    case "tag": {
      const a2 = clon(S.alumnos[b.dataset.id]); a2[b.dataset.t] = !a2[b.dataset.t];
      try { await Store.guardarAlumno(a2); brindis(`${ETIQUETAS[b.dataset.t].nombre}: ${a2[b.dataset.t] ? "sí" : "no"}`);
        registrar(`${a2[b.dataset.t] ? "Puso" : "Quitó"} la etiqueta ${ETIQUETAS[b.dataset.t].nombre} a ${a2.nombre}`); } catch (e2) {}
      render(); hojaFicha(b.dataset.id); break;
    }
    case "mas-horario": document.getElementById("a-horario").insertAdjacentHTML("beforeend", filaHorario({ dia:1, hora:"17:00" })); break;
    case "quitar-horario": b.closest(".horario-fila").remove(); break;
    case "toggle-paq": { const f = document.getElementById("f-paq"); f.hidden = !f.hidden; break; }
    case "pago": {
      const a2 = clon(S.alumnos[b.dataset.id]); const p = a2.paquetes.find(x => x.id === b.dataset.p); if (!p) return;
      p.pagado = !p.pagado;
      try { await Store.guardarAlumno(a2); registrar(`Marcó el paquete de ${p.clases} clases de ${a2.nombre} como ${p.pagado ? "pagado" : "sin pagar"}`); } catch (e2) {}
      render(); hojaFicha(b.dataset.id); break;
    }
    case "pago-mes": {
      const a2 = clon(S.alumnos[b.dataset.id]); const del = (a2.paquetes || []).filter(p => (p.fecha || "").startsWith(mesPagos));
      const todos = del.every(p => p.pagado); del.forEach(p => { p.pagado = !todos; });
      try { await Store.guardarAlumno(a2); brindis(todos ? "Marcado como pendiente" : `${primerNombre(a2.nombre)} ya pagó`);
        registrar(`Marcó a ${a2.nombre} como ${todos ? "pago pendiente" : "pagado"} en ${MESES_LARGO[Number(mesPagos.slice(5, 7)) - 1]}`); } catch (e2) {}
      render(); break;
    }
    case "borrar-paq": {
      if (!confirmarDosVeces(b, "p" + b.dataset.p, "¿Seguro?")) return;
      const a2 = clon(S.alumnos[b.dataset.id]); const pb = a2.paquetes.find(x => x.id === b.dataset.p);
      if (pb && pb.comprobante && Store.assets) Store.assets.delete(pb.comprobante.id).catch(() => {});
      a2.paquetes = a2.paquetes.filter(x => x.id !== b.dataset.p);
      try { await Store.guardarAlumno(a2); brindis("Paquete borrado"); registrar(`Borró un paquete de ${a2.nombre}`); } catch (e2) {}
      render(); hojaFicha(b.dataset.id); break;
    }
    case "baja": {
      const a2 = clon(S.alumnos[b.dataset.id]); a2.baja = !a2.baja; a2.bajaEn = a2.baja ? hoyIso() : ""; cerrarHoja();
      try { await Store.guardarAlumno(a2); brindis(a2.baja ? `${a2.nombre} quedó dado de baja (su historial se conserva)` : "Reactivado");
        registrar(`${a2.baja ? "Dio de baja" : "Reactivó"} a ${a2.nombre}`); } catch (e2) {}
      render(); break;
    }
    case "borrar-alumno": {
      if (!confirmarDosVeces(b, "a" + b.dataset.id, "¿Mandar a la papelera?")) return;
      const a2 = clon(S.alumnos[b.dataset.id]); if (!a2) return; a2.borrado = Date.now(); cerrarHoja();
      try { await Store.guardarAlumno(a2); brindis(`${a2.nombre} está en la papelera: se borra por completo en 2 días`); registrar(`Mandó a ${a2.nombre} a la papelera`); } catch (e2) {}
      render(); break;
    }
    case "restaurar-alumno": {
      const a2 = clon(S.papelera[b.dataset.id]); if (!a2) return; delete a2.borrado;
      try { await Store.guardarAlumno(a2); brindis(`${a2.nombre} regresó a la lista`); registrar(`Sacó a ${a2.nombre} de la papelera`); } catch (e2) {}
      render(); break;
    }
    case "purgar-alumno": {
      if (!confirmarDosVeces(b, "x" + b.dataset.id, "Toca otra vez: ya no se podrá recuperar")) return;
      try { await purgarAlumno(b.dataset.id, false); brindis("Borrado por completo"); } catch (e2) {}
      render(); break;
    }
    case "restaurar-caballo": {
      const k2 = clon(S.caballosPapelera[b.dataset.id]); if (!k2) return; delete k2.borrado; k2.id = b.dataset.id;
      try { await Store.guardarCaballo(k2); brindis(`${k2.nombre} regresó`); registrar(`Sacó el caballo ${k2.nombre} de la papelera`); } catch (e2) {}
      render(); break;
    }
    case "purgar-caballo": {
      if (!confirmarDosVeces(b, "y" + b.dataset.id, "Toca otra vez: ya no se podrá recuperar")) return;
      try { await purgarCaballo(b.dataset.id, false); brindis("Borrado por completo"); } catch (e2) {}
      render(); break;
    }
    case "pdf-alumno": pdfAlumno(b.dataset.id, b.dataset.l); break;
    case "pdf-semana": pdfSemana(lunesVista); break;
    case "llenar": hojaLlenar(); break;
    case "hist-mas": histMostrar += 150; render(); break;
    case "chat-abrir": Chat.abierto = true; renderChat(); { const t = document.getElementById("chat-txt"); if (t) t.focus(); } break;
    case "chat-cerrar": Chat.abierto = false; renderChat(); break;
    case "chat-stop": if (Chat.ctl) Chat.ctl.abort(); break;
    case "chat-sug": Chat.borrador = b.dataset.t; renderChat(); { const t = document.getElementById("chat-txt"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } } break;
    case "chat-deshacer": deshacerChat(); break;
    case "chat-img": {
      const lim = Store.limitesImg; if (!lim) return;
      const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = (lim.mediaTypes || ["image/*"]).join(",");
      inp.addEventListener("change", () => {
        for (const f of [...(inp.files || [])]) {
          if (Chat.imagenes.length >= (lim.maxCount || 5)) { brindis(`Máximo ${lim.maxCount} imágenes por mensaje.`); break; }
          if (lim.maxInputBytes && f.size > lim.maxInputBytes) { brindis(`${f.name} pesa demasiado.`); continue; }
          if (lim.mediaTypes && f.type && !lim.mediaTypes.includes(f.type)) { brindis(`${f.name}: ese tipo de archivo no se puede leer.`); continue; }
          Chat.imagenes.push({ file:f, url:URL.createObjectURL(f) });
        }
        renderChat(); const t = document.getElementById("chat-txt"); if (t) t.focus();
      });
      inp.click(); break;
    }
    case "chat-img-quitar": { const i = Number(b.dataset.i); const x = Chat.imagenes[i]; if (x) URL.revokeObjectURL(x.url); Chat.imagenes.splice(i, 1); renderChat(); break; }
    case "subir-comp": elegirComprobante(b.dataset.id, b.dataset.p); break;
    case "excel": excelPagos(); break;
    case "salir": if (window.EquusNube) EquusNube.salir(); break;
    case "drive-sync": clearTimeout(Drive.timer); Drive.fallo = null; if (Store.mcp && Store.mcp.conectar) Store.mcp.conectar().catch(() => {}); sincronizarDrive(true); break;
    case "confirmar-llenar": llenar(); break;
    case "nuevo-caballo": hojaCaballo(); break;
    case "caballo": hojaCaballo(b.dataset.id); break;
    case "borrar-caballo": {
      if (!confirmarDosVeces(b, "k" + b.dataset.id, "¿A la papelera?")) return;
      const nk = (S.caballos[b.dataset.id] || {}).nombre || "un caballo";
      const k2 = clon(S.caballos[b.dataset.id]); if (!k2) return; k2.borrado = Date.now(); k2.id = b.dataset.id;
      cerrarHoja(); try { await Store.guardarCaballo(k2); brindis(`${nk} está en la papelera: se borra por completo en 2 días`); registrar(`Mandó el caballo ${nk} a la papelera`); } catch (e2) {}
      render(); break;
    }
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "f-chat") { e.preventDefault(); enviarChat(val("chat-txt")); }
});
document.addEventListener("input", e => {
  if (e.target.id === "chat-txt") Chat.borrador = e.target.value;
  if (e.target.id === "buscar") {
    busqueda = e.target.value; const pos = e.target.selectionStart; render();
    const i = document.getElementById("buscar"); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  }
});
document.addEventListener("change", e => {
  if (e.target.classList.contains("metodo-sel")) {
    const { id, p: pid } = e.target.dataset; const a2 = clon(S.alumnos[id]); const p = a2 && (a2.paquetes || []).find(x => x.id === pid); if (!p) return;
    p.metodo = e.target.value;
    Store.guardarAlumno(a2).then(() => { brindis(p.metodo ? `Forma de pago: ${metodoTxt(p.metodo)}` : "Forma de pago sin anotar");
      registrar(`Anotó la forma de pago del paquete de ${p.clases} clases de ${a2.nombre}: ${metodoTxt(p.metodo) || "sin anotar"}`); render();
      if (!hoja.hidden && hoja.querySelector("#f-paq")) hojaFicha(id); }).catch(() => {});
    return;
  }
  if (e.target.classList.contains("h-dia")) {
    const f = e.target.closest(".horario-fila"); const h = f.querySelector(".h-hora"); const v = h.value;
    h.innerHTML = opcionesHora(v, Number(e.target.value));
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chat-txt" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); enviarChat(e.target.value); return; }
  if (e.key === "Escape") { if (!hoja.hidden) cerrarHoja(); else if (Chat.abierto) { Chat.abierto = false; renderChat(); } }
});

let tBrindis;
function brindis(t) {
  const el = document.getElementById("brindis"); el.textContent = t; el.hidden = false;
  clearTimeout(tBrindis); tBrindis = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ==========================================================================
   Arranque
   ========================================================================== */
document.body.className = perfil ? "p-" + perfil : "";
render();
Store.iniciar().then(() => { if (perfil) Store.abrir(perfil); else render(); });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
