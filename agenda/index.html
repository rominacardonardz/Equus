<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equus · Agenda de alumnos</title>
<meta name="theme-color" content="#1B3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="nube.js"></script>
<style>
/* Equus — agenda semanal de Tania y Edwin.
   La portada lleva los azules y dorados de Equus. Al entrar, toda la página
   toma la paleta del maestro: Tania en aquas, Edwin en azul marino y plata.
   Layout: encabezado en degradado con pestañas; la semana es una cuadrícula
   hora × día en pantalla ancha y una tira de días con la agenda del día en
   el celular. */
:root {
  --azul:#1B3A5F; --oro:#C9A227;
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E9EFF7;
  --ink:#0F1A2B; --ink-2:#4A5670; --ink-3:#7B869C;
  --line:#D9E2EE; --line-fuerte:#BFCCDF;
  --perfil:#1B3A5F; --perfil-2:#C9A227; --perfil-bg:#E9EFF7; --on-perfil:#FFFFFF;
  --cab-1:#1B3A5F; --cab-2:#2E5C8A; --cab-ink:#FFFFFF; --cab-ink-2:rgba(255,255,255,.72); --cab-acento:#C9A227;

  /* Muestras de cada paleta para la portada. */
  --tania-1:#0F8B8D; --tania-2:#5ED3C9; --edwin-1:#1B2A4A; --edwin-2:#B8C1CE;

  --n1:#0E7490; --n1-bg:#DBF0F6; --n2:#2F7A46; --n2-bg:#DFF0E3;
  --n3:#9A6410; --n3-bg:#F8EED5; --n4:#8A3A63; --n4-bg:#F7E2EC;
  --ok:#1F6B4F; --ok-bg:#DFF0E7;
  --alerta:#A33227; --alerta-bg:#FBE6E2;
  --aviso:#7A5A10; --aviso-bg:#FAF0D4;
  --info:#4A5A78; --info-bg:#E6EAF1;
  --oro-tinta:#8A6A15; --oro-fondo:#F6ECC9; --oro-borde:#E0C878;
  --prop:#6B3FA0; --prop-bg:#EEE5F8;

  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px; --r-sm:10px;
  --sombra:0 1px 2px rgba(15,26,43,.05), 0 12px 30px -22px rgba(15,26,43,.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0A1120; --surface:#121C2C; --surface-2:#1A2536;
    --ink:#E9EEF7; --ink-2:#A6B2C7; --ink-3:#76829A;
    --line:#243043; --line-fuerte:#35435C;
    --perfil:#8FB4E0; --perfil-bg:#1A2536; --on-perfil:#0A1120;
    --cab-1:#0E1F36; --cab-2:#1B3A5F;
    --n1:#6FC6DC; --n1-bg:#0E2C34; --n2:#7FC795; --n2-bg:#132B1C;
    --n3:#DFB763; --n3-bg:#2E2512; --n4:#E091B6; --n4-bg:#2E1622;
    --ok:#7FC7A4; --ok-bg:#12281F; --alerta:#E9A08D; --alerta-bg:#331B18;
    --aviso:#D9B95C; --aviso-bg:#2C2513; --info:#A9B5CB; --info-bg:#1C2434;
    --oro-tinta:#D6AE4A; --oro-fondo:#2A2313; --oro-borde:#5C4B1C;
    --prop:#C9A6EE; --prop-bg:#271B3A;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -24px rgba(0,0,0,.9);
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo .clara{display:none}
  :root:not([data-theme="light"]) .logo .oscura{display:block}
}
:root[data-theme="dark"] {
  --bg:#0A1120; --surface:#121C2C; --surface-2:#1A2536;
  --ink:#E9EEF7; --ink-2:#A6B2C7; --ink-3:#76829A;
  --line:#243043; --line-fuerte:#35435C;
  --perfil:#8FB4E0; --perfil-bg:#1A2536; --on-perfil:#0A1120;
  --cab-1:#0E1F36; --cab-2:#1B3A5F;
  --n1:#6FC6DC; --n1-bg:#0E2C34; --n2:#7FC795; --n2-bg:#132B1C;
  --n3:#DFB763; --n3-bg:#2E2512; --n4:#E091B6; --n4-bg:#2E1622;
  --ok:#7FC7A4; --ok-bg:#12281F; --alerta:#E9A08D; --alerta-bg:#331B18;
  --aviso:#D9B95C; --aviso-bg:#2C2513; --info:#A9B5CB; --info-bg:#1C2434;
  --oro-tinta:#D6AE4A; --oro-fondo:#2A2313; --oro-borde:#5C4B1C;
  --prop:#C9A6EE; --prop-bg:#271B3A;
  color-scheme:dark;
}
:root[data-theme="dark"] .logo .clara{display:none}
:root[data-theme="dark"] .logo .oscura{display:block}

/* ---------- Tania: aquas ---------- */
body.p-tania{
  --bg:#EEF9F8; --surface:#FFFFFF; --surface-2:#DDF3F1;
  --ink:#0B2B2C; --ink-2:#3C6466; --ink-3:#6B8F91;
  --line:#C9E9E6; --line-fuerte:#9DD5D0;
  --perfil:#0F8B8D; --perfil-2:#2EC4B6; --perfil-bg:#D2F4F0; --on-perfil:#FFFFFF;
  --cab-1:#0B6E72; --cab-2:#2EC4B6; --cab-ink:#FFFFFF; --cab-ink-2:rgba(255,255,255,.8); --cab-acento:#C8FFF8;
}
/* ---------- Edwin: azul marino y plata ---------- */
body.p-edwin{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E5E9EF;
  --ink:#0E1A2E; --ink-2:#45526A; --ink-3:#77829A;
  --line:#D5DBE3; --line-fuerte:#AEB8C6;
  --perfil:#1B2A4A; --perfil-2:#A9B4C2; --perfil-bg:#E3E8F0; --on-perfil:#FFFFFF;
  --cab-1:#0F1B33; --cab-2:#2A3D66; --cab-ink:#E9EDF2; --cab-ink-2:rgba(214,221,230,.78); --cab-acento:#C9D1DC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body.p-tania{
    --bg:#061A1B; --surface:#0B2628; --surface-2:#113436; --ink:#E0F6F4; --ink-2:#9CC8C5; --ink-3:#6E9C99;
    --line:#1B4547; --line-fuerte:#2A5E60; --perfil:#4FD6CB; --perfil-2:#2EC4B6; --perfil-bg:#10393A; --on-perfil:#04191A;
    --cab-1:#073F42; --cab-2:#0F7C7C;
  }
  :root:not([data-theme="light"]) body.p-edwin{
    --bg:#080D18; --surface:#101828; --surface-2:#172238; --ink:#E6EAF0; --ink-2:#A9B3C3; --ink-3:#7A8599;
    --line:#232F47; --line-fuerte:#34425E; --perfil:#C3CCD8; --perfil-2:#8C9AB0; --perfil-bg:#1C2843; --on-perfil:#0B1220;
    --cab-1:#070D1C; --cab-2:#1B2A4A;
  }
}
:root[data-theme="dark"] body.p-tania{
  --bg:#061A1B; --surface:#0B2628; --surface-2:#113436; --ink:#E0F6F4; --ink-2:#9CC8C5; --ink-3:#6E9C99;
  --line:#1B4547; --line-fuerte:#2A5E60; --perfil:#4FD6CB; --perfil-2:#2EC4B6; --perfil-bg:#10393A; --on-perfil:#04191A;
  --cab-1:#073F42; --cab-2:#0F7C7C;
}
:root[data-theme="dark"] body.p-edwin{
  --bg:#080D18; --surface:#101828; --surface-2:#172238; --ink:#E6EAF0; --ink-2:#A9B3C3; --ink-3:#7A8599;
  --line:#232F47; --line-fuerte:#34425E; --perfil:#C3CCD8; --perfil-2:#8C9AB0; --perfil-bg:#1C2843; --on-perfil:#0B1220;
  --cab-1:#070D1C; --cab-2:#1B2A4A;
}

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--cab-1)}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.15; margin:0; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
a{color:inherit}
:where(button,a,input,select,textarea,summary):focus-visible{outline:2px solid var(--perfil-2); outline-offset:2px; border-radius:6px}
/* Cormorant trae números antiguos; en una agenda se leen mejor alineados. */
.num,.stat .n,.saldo .q,.hg-hora,.bh-h,.rango,.mes,.chip-dia b,.kpis .n,.lista-fila .h{font-variant-numeric:lining-nums tabular-nums}

.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- encabezado ---------- */
.cab{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; color:var(--cab-ink);
  background:linear-gradient(115deg, var(--cab-1), var(--cab-2)); box-shadow:0 6px 24px -18px rgba(0,0,0,.6)}
.cab-fila{display:flex; align-items:center; gap:.75rem; padding-block:.6rem .35rem; max-width:76rem; margin:0 auto}
.marca{display:flex; align-items:center; gap:.6rem; margin-right:auto; min-width:0}
.logo img{height:2.2rem; width:auto; display:block}
.logo .oscura{display:none}
.cab .logo .clara{display:none!important}
.cab .logo .oscura{display:block!important}
.marca b{font-family:var(--serif); font-size:1.2rem; letter-spacing:.02em; white-space:nowrap; font-weight:700}
.marca small{display:block; font-size:.66rem; color:var(--cab-ink-2); letter-spacing:.1em; text-transform:uppercase}
.yo{display:flex; align-items:center; gap:.45rem; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
  border-radius:999px; padding:.25rem .7rem .25rem .3rem; font-size:.84rem; font-weight:600; color:var(--cab-ink)}
.yo .ini{background:var(--cab-acento); color:var(--cab-1)}
.yo .cambiar{font-weight:500; color:var(--cab-ink-2); font-size:.74rem; border-left:1px solid rgba(255,255,255,.3); padding-left:.45rem}
.ini{display:grid; place-items:center; width:1.65rem; height:1.65rem; border-radius:50%; background:var(--perfil); color:var(--on-perfil); font-size:.76rem; font-weight:700; flex:none}
.pestanas{display:flex; gap:.15rem; max-width:76rem; margin:0 auto; overflow-x:auto; scrollbar-width:none}
.pestana{padding:.6rem .8rem .55rem; font-size:.86rem; color:var(--cab-ink-2); border-bottom:3px solid transparent; white-space:nowrap}
.pestana:hover{color:var(--cab-ink)}
.pestana[aria-selected="true"]{color:var(--cab-ink); border-bottom-color:var(--cab-acento); font-weight:600}
.pestana .cuenta{display:inline-grid; place-items:center; min-width:1.2rem; height:1.2rem; padding:0 .3rem; margin-left:.3rem;
  border-radius:99px; background:#E5533F; color:#fff; font-size:.66rem; font-weight:700}

main{max-width:76rem; margin:0 auto; padding-block:1.1rem 5rem; display:grid; gap:1rem}
.pie{font-size:.72rem; color:var(--ink-3); text-align:center; padding-block:.5rem 2rem; display:flex; justify-content:center; align-items:center; gap:.4rem}
.pie i{width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; flex:none}
.pie.local i{background:var(--aviso)}

/* ---------- piezas ---------- */
.titulo{display:flex; align-items:flex-end; justify-content:space-between; gap:.75rem; flex-wrap:wrap}
.titulo h2{font-size:1.8rem}
.sub{font-size:.8rem; color:var(--ink-3)}
.etiqueta{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.tarjeta{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem; display:grid; gap:.7rem; min-width:0}
.fila{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.fila.entre{justify-content:space-between}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:.4rem; background:var(--perfil); color:var(--on-perfil);
  border-radius:10px; padding:.55rem .95rem; font-size:.86rem; font-weight:600; transition:filter .15s; text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-2{background:var(--surface); color:var(--ink); border:1px solid var(--line-fuerte); font-weight:500}
.btn-wa{background:#1A8D48; color:#fff}
.btn-peligro{background:none; color:var(--alerta); border:1px solid var(--alerta); font-weight:500}
.btn-mini{padding:.32rem .65rem; font-size:.76rem; border-radius:8px}
.btn-bloque{width:100%}
.btn svg{width:16px; height:16px; flex:none}

.pastilla{display:inline-flex; align-items:center; gap:.25rem; font-size:.68rem; font-weight:600; padding:.15rem .5rem; border-radius:999px; white-space:nowrap; line-height:1.4}
.e-programada{background:var(--surface-2); color:var(--ink-2)}
.e-asistio{background:var(--ok-bg); color:var(--ok)}
.e-aviso{background:var(--aviso-bg); color:var(--aviso)}
.e-falta{background:var(--alerta-bg); color:var(--alerta)}
.e-cancelada{background:var(--info-bg); color:var(--info)}
.repo{background:var(--oro-fondo); color:var(--oro-tinta); border:1px solid var(--oro-borde)}
.t-prop{background:var(--prop-bg); color:var(--prop)}
.t-cuerdita{background:var(--n1-bg); color:var(--n1)}
.t-pista{background:var(--perfil-bg); color:var(--perfil)}
.t-silla{background:transparent; color:var(--perfil); box-shadow:inset 0 0 0 1px var(--perfil)}
.n1{background:var(--n1-bg); color:var(--n1)} .n2{background:var(--n2-bg); color:var(--n2)}
.n3{background:var(--n3-bg); color:var(--n3)} .n4{background:var(--n4-bg); color:var(--n4)}
.alerta-txt{color:var(--alerta)} .ok-txt{color:var(--ok)} .aviso-txt{color:var(--aviso)}

input[type="text"],input[type="date"],input[type="number"],input[type="tel"],textarea,select{width:100%; font:inherit; font-size:.9rem;
  color:var(--ink); background:var(--surface); border:1px solid var(--line-fuerte); border-radius:9px; padding:.5rem .65rem}
textarea{resize:vertical; min-height:3.8rem}
label.campo{display:grid; gap:.25rem; font-size:.76rem; color:var(--ink-2); min-width:0}
.dos{display:grid; gap:.6rem}
@media (min-width:30rem){.dos{grid-template-columns:1fr 1fr}}
.check{display:flex; align-items:center; gap:.5rem; font-size:.86rem}
.check input{width:1.1rem; height:1.1rem; accent-color:var(--perfil)}
.segmento{display:inline-flex; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:.15rem; gap:.1rem; justify-self:start}
.segmento button{padding:.3rem .7rem; font-size:.78rem; border-radius:8px; color:var(--ink-2)}
.segmento button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--sombra)}

.vacio{text-align:center; padding:1.8rem 1rem; color:var(--ink-3); border:1px dashed var(--line-fuerte); border-radius:var(--r);
  font-size:.88rem; display:grid; gap:.6rem; justify-items:center; background:var(--surface)}
.vacio b{color:var(--ink); font-family:var(--serif); font-size:1.25rem}
.nota{padding:.7rem .85rem; border-radius:var(--r-sm); font-size:.82rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2)}
.nota b{color:var(--ink)}
.nota.aviso{background:var(--aviso-bg); border-color:transparent; color:var(--aviso)} .nota.aviso b{color:var(--aviso)}
.nota.alerta{background:var(--alerta-bg); border-color:transparent; color:var(--alerta)} .nota.alerta b{color:var(--alerta)}

/* ---------- portada ---------- */
.portada{max-width:40rem; margin:0 auto; padding-block:2.5rem 3rem; display:grid; gap:1.5rem; text-align:center}
.portada .logo img{height:auto; width:min(13rem,60%); margin:0 auto}
.portada h1{font-size:2.3rem}
.perfiles{display:grid; gap:.9rem}
@media (min-width:34rem){.perfiles{grid-template-columns:1fr 1fr}}
.perfil{display:grid; gap:.55rem; justify-items:center; padding:0 0 1.3rem; border-radius:var(--r); background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--sombra); overflow:hidden; transition:transform .15s}
.perfil:hover{transform:translateY(-3px)}
.perfil .franja{width:100%; height:4.2rem; background:linear-gradient(115deg, var(--c1), var(--c2)); margin-bottom:-2rem}
.perfil .grande{display:grid; place-items:center; width:3.8rem; height:3.8rem; border-radius:50%; background:var(--surface); color:var(--c1);
  font-family:var(--serif); font-size:1.9rem; font-weight:700; border:3px solid var(--c2)}
.perfil b{font-family:var(--serif); font-size:1.55rem}
.perfil span{font-size:.8rem; color:var(--ink-3)}

/* ---------- semana ---------- */
.sem-cab{display:grid; gap:.9rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem; box-shadow:var(--sombra)}
.navsem{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.navsem .rango{font-family:var(--serif); font-size:1.55rem; font-weight:700; padding:0 .2rem}
.flecha{width:2.1rem; height:2.1rem; border-radius:50%; border:1px solid var(--line-fuerte); display:grid; place-items:center; font-size:1.1rem; background:var(--surface)}
.flecha:hover{border-color:var(--perfil); color:var(--perfil)}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem 1rem}
@media (min-width:40rem){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{display:grid; gap:.1rem; padding-left:.7rem; border-left:3px solid var(--perfil-2)}
.stat .n{font-family:var(--serif); font-size:1.85rem; font-weight:700; line-height:1}
.stat .t{font-size:.72rem; color:var(--ink-3)}
.stat.alerta{border-left-color:var(--alerta)} .stat.alerta .n{color:var(--alerta)}
.marcadas{display:grid; gap:.3rem}
.barra{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.barra span{display:block; height:100%; background:linear-gradient(90deg, var(--perfil), var(--perfil-2)); border-radius:99px}

.solo-ancho{display:none!important}
@media (min-width:64rem){.solo-ancho{display:grid!important} .solo-angosto{display:none!important}}

/* Cuadrícula hora × día */
.hg{grid-template-columns:4.9rem repeat(7, minmax(0,1fr)); background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; box-shadow:var(--sombra)}
.hg-dia{padding:.6rem .5rem .55rem; border-bottom:1px solid var(--line); border-left:1px solid var(--line); display:grid; gap:.15rem; align-content:start}
.hg-dia .dn{font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.hg-dia .num{font-family:var(--serif); font-size:1.7rem; font-weight:700; line-height:1}
.hg-dia small{font-size:.68rem; color:var(--ink-3)}
.hg-dia.hoy{background:linear-gradient(180deg, var(--perfil-bg), var(--surface))}
.hg-dia.hoy .num, .hg-dia.hoy .dn{color:var(--perfil)}
.lista-btn{justify-self:start; margin-top:.25rem; font-size:.68rem; font-weight:600; color:var(--perfil); border:1px solid var(--line-fuerte); border-radius:7px; padding:.15rem .45rem}
.lista-btn:hover{border-color:var(--perfil); background:var(--perfil-bg)}
.hg-esq{border-bottom:1px solid var(--line)}
.hg-hora{font-family:var(--serif); font-size:1rem; white-space:nowrap; font-weight:700; padding:.5rem .45rem; color:var(--ink-2); border-bottom:1px solid var(--line); text-align:right}
.hg-celda{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:.3rem; display:grid; gap:.3rem; align-content:start; min-height:3.2rem; min-width:0}
.cupo{justify-self:end; font-size:.66rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.cupo.lleno{color:var(--alerta); font-weight:700}
.hg-celda.hoy{background:color-mix(in srgb, var(--perfil-bg) 45%, transparent)}
.hg-celda .mas{opacity:0; font-size:.7rem; color:var(--ink-3); border:1px dashed var(--line-fuerte); border-radius:7px; padding:.1rem}

<body>

<div id="app"></div>
<div id="hoja" hidden></div>
<div id="chat" hidden role="dialog" aria-label="Asistente"></div>
<div id="brindis" class="brindis" role="status" hidden></div>

<template id="logo-tpl"><span class="logo" aria-hidden="true"><img class="clara" alt="" src="iconos/logo-clara.png"><img class="oscura" alt="" src="iconos/logo-oscura.png"></span></template>

<script>
"use strict";
/* ==========================================================================
   Catálogos
   ========================================================================== */
const PISTAS = { mty:"Hípico Mty", equus:"Equus", silla:"La Silla" };
/* Tania da clases en Hípico Mty, Equus y La Silla; Edwin solo en Equus.
   La etiqueta de cuerdita solo la usa Edwin; la de propietario, los dos. */
const MAESTROS = {
  tania: { nombre:"Tania", pistas:["mty","equus","silla"], etiquetas:["propietario"] },
  edwin: { nombre:"Edwin", pistas:["equus","silla"], etiquetas:["propietario","cuerdita"] },
};
const ETIQUETAS = {
  propietario: { nombre:"Propietario", cls:"t-prop" },
  cuerdita:    { nombre:"Cuerdita",    cls:"t-cuerdita" },
};
const etiquetasPerfil = () => MAESTROS[perfil].etiquetas;
/* Alumnos por hora y maestro; el domingo el horario es variable y no lleva cupo. */
const CUPO_HORA = 8;
const pistasDe = p => MAESTROS[p].pistas;
const variasPistas = () => pistasDe(perfil).length > 1;
/* La pista sale sola de la fecha y del alumno. Los alumnos de Tania montan en
   Hípico Mty hasta el 1 de noviembre de 2026 y en Equus desde el 2. La Silla
   solo la tienen habilitada los alumnos marcados (Romina y Nico), y es la suya
   por omisión. Los de Edwin, siempre en Equus. */
const CAMBIO_A_EQUUS = "2026-11-02";
const pistaBase = fecha => perfil === "tania" && String(fecha || hoyIso()) < CAMBIO_A_EQUUS ? "mty" : "equus";
const tieneSilla = a => !!(a && a.silla && pistasDe(perfil).includes("silla"));
/* Cualquier clase se puede poner en otra pista del maestro (por ejemplo, entrenar en La Silla la
   semana de una competencia). La primera es la que se pone sola. Hípico Mty ya no se ofrece después del cambio a Equus. */
const pistasAlumno = (a, fecha) => { const base = pistaAlumno(a, fecha);
  return [base, ...pistasDe(perfil).filter(x => x !== base && !(x === "mty" && String(fecha || hoyIso()) >= CAMBIO_A_EQUUS))]; };
const pistaAlumno = (a, fecha) => tieneSilla(a) ? "silla" : pistaBase(fecha);
const NIVELES = [
  { id:"cuerdita", nombre:"Cuerdita", c:"n1" }, { id:"principiantes", nombre:"Principiantes", c:"n2" },
  { id:"intermedio", nombre:"Intermedio", c:"n3" }, { id:"avanzado", nombre:"Avanzado", c:"n4" },
];
const nivel = id => NIVELES.find(n => n.id === id) || NIVELES[1];
const PAQUETES = [4, 8, 10, 15];
const fmtHora = h => {
  const [H, M] = String(h || "").split(":").map(Number);
  if (isNaN(H)) return h || "";
  return `${H % 12 || 12}:${String(M || 0).padStart(2, "0")} ${H < 12 ? "am" : "pm"}`;
};
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIAS_CORTO = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_LARGO = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
/* Horas del club en Reservas, por día (lunes = 0). La lista deja escoger otras. */
const ENTRE_SEMANA = ["07:00","08:00","09:00","16:00","17:00","18:00"];
const HORAS_DIA = [[], ENTRE_SEMANA, ENTRE_SEMANA, ENTRE_SEMANA, ENTRE_SEMANA, ["07:00","08:00","09:00","10:00"], ["07:00","08:00","09:00"]];
const TODAS_HORAS = (() => { const r = []; for (let h = 6; h <= 20; h++) for (const m of ["00","30"]) r.push(String(h).padStart(2,"0") + ":" + m); return r; })();

/* Qué pasa con el paquete en cada estado. Asistió y falta sin aviso
   descuentan; avisó o cancelación del maestro no descuentan y dejan una
   reposición pendiente. */
const ESTADOS = {
  programada: { nombre:"Por dar",          corto:"Por dar", ayuda:"Aún no se marca" },
  asistio:    { nombre:"Asistió",          corto:"Asistió", ayuda:"Descuenta 1 clase" },
  aviso:      { nombre:"Faltó · avisó",    corto:"Avisó",   ayuda:"No descuenta, queda reposición" },
  falta:      { nombre:"Faltó sin avisar", corto:"Faltó",   ayuda:"Descuenta 1 clase" },
  cancelada:  { nombre:"Cancelé yo",       corto:"Cancelé", ayuda:"Clima o maestro: queda reposición" },
};

/* Propietarios: de martes a domingo, sin límite de clases y sin reposiciones.
   Los demás alumnos: de martes a sábado, con paquete y reposiciones. Los lunes no hay clases. */
const esProp = a => !!(a && a.propietario);
const diaPermitido = (a, dia) => dia >= 1 && (dia <= 5 || (dia === 6 && esProp(a)));
const diasTxt = a => esProp(a) ? "de martes a domingo" : "de martes a sábado";
const AYUDA_PROP = { programada:"Aún no se marca", asistio:"Montó", aviso:"Avisó que no viene", falta:"No vino", cancelada:"Clima o maestro" };

/* ==========================================================================
   Fechas (siempre en hora local)

const Nombres = {}; const nombresPedidos = new Set();
function resolverNombres(ids) {
  const faltan = ids.filter(id => !nombresPedidos.has(id));
  if (!faltan.length || !Store.user) return;
  faltan.forEach(id => nombresPedidos.add(id));

/* ------------------------------------------------------------------ papelera */
const DOS_DIAS = 2 * 24 * 3600 * 1000;
const venceTxt = t => { const d = new Date(t + DOS_DIAS); return `${fechaLarga(iso(d))} a las ${fmtHora(`${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`)}`; };
async function purgarAlumno(id, auto) {
  const a = S.papelera[id]; if (!a) return;
  for (const [l, sm] of Object.entries(S.semanas)) {
    if (!Object.values((sm && sm.clases) || {}).some(c => c.alumnoId === id)) continue;
    const s2 = clon(sm); for (const [cid, c] of Object.entries(s2.clases)) if (c.alumnoId === id) delete s2.clases[cid];
    await Store.guardarSemana(l, s2);
  }
  if (Store.assets) (a.paquetes || []).forEach(p => { if (p.comprobante) Store.assets.delete(p.comprobante.id).catch(() => {}); });
  await Store.borrarAlumno(id);
  registrar(auto ? `Se borró por completo a ${a.nombre}: pasaron 2 días en la papelera` : `Borró por completo a ${a.nombre}`);
}
async function purgarCaballo(id, auto) {
  const k = S.caballosPapelera[id]; if (!k) return;
  await Store.borrarCaballo(id);
  registrar(auto ? `Se borró por completo el caballo ${k.nombre}: pasaron 2 días en la papelera` : `Borró por completo el caballo ${k.nombre}`);
}
let purgaHecha = null;
async function purgarVencidos() {
  if (!S.cargado || !perfil || purgaHecha === perfil || Store.puede === false) return;
  purgaHecha = perfil;
  const ahora = Date.now();
  for (const [id, a] of Object.entries(S.papelera)) if (ahora - a.borrado > DOS_DIAS) { try { await purgarAlumno(id, true); } catch (e) {} }
  for (const [id, k] of Object.entries(S.caballosPapelera)) if (ahora - k.borrado > DOS_DIAS) { try { await purgarCaballo(id, true); } catch (e) {} }
  render();
}

function vistaMes(clases) {
  const [y, m] = mesCal.split("-").map(Number);
  const inicio = lunesDe(new Date(y, m - 1, 1));
  const fin = sumarDias(lunesDe(new Date(y, m, 0)), 6);
  const hoy = hoyIso();
  const visibles = clases.filter(c => filtroPista === "todas" || c.pista === filtroPista);
  const delMes = visibles.filter(c => c.fecha.startsWith(mesCal));
  const n = k => delMes.filter(c => c.estado === k).length;

  return `<section class="sem-cab">
    <div class="titulo">

function vistaSemana(clases) {
  if (modoCal === "mes") return vistaMes(clases);
  const lunes = deIso(lunesVista);
  const deSemana = clasesSemana(clases, lunesVista);
  const hoy = hoyIso();
  const activos = alumnosActivos();
  const conHorario = activos.filter(a => (a.horario || []).length);
  const n = k => deSemana.filter(c => c.estado === k).length;
  const repoTotal = activos.reduce((s, a) => s + cuenta(a.id, clases).repoPend, 0);
  const marcadas = deSemana.filter(c => c.estado !== "programada").length;
  const pctMarcadas = deSemana.length ? Math.round(marcadas / deSemana.length * 100) : 0;
  const esEsta = lunesVista === lunesHoy();

  const cab = `<section class="sem-cab">
    <div class="titulo">
      <div class="navsem">
        <button class="flecha" data-act="semana" data-d="-7" aria-label="Semana anterior">‹</button>

        ${deSemana.length ? `<button class="btn btn-2" data-act="pdf-semana">${ICONO_PDF}PDF de la semana</button>` : ""}
        ${conHorario.length ? `<button class="btn btn-2" data-act="llenar">Llenar con horarios fijos</button>` : ""}</span>
      </div>
    </div>
    ${selectorPista()}
    <div class="resumen-linea"><span>${plural(deSemana.length, "clase")} · ${n("asistio")} asistencias${repoTotal ? ` · <b class="aviso-txt">${repoTotal} repo por agendar</b>` : ""}</span>
      <button data-act="sem-resumen" aria-expanded="${resumenSem}">${resumenSem ? "Ocultar" : "Ver resumen"}</button></div>
    <div class="resumen ${resumenSem ? "" : "cerrado"}" style="display:grid; gap:.8rem">
    <div class="stats">
      <div class="stat"><span class="n">${deSemana.length}</span><span class="t">clases</span></div>
      <div class="stat"><span class="n">${n("asistio")}</span><span class="t">asistencias</span></div>
      <div class="stat ${n("falta") ? "alerta" : ""}"><span class="n">${n("aviso") + n("falta")}</span><span class="t">faltas (${n("aviso")} con aviso)</span></div>
      <div class="stat"><span class="n">${deSemana.filter(c => c.repo).length}</span><span class="t">reposiciones</span></div>
      <div class="stat ${repoTotal ? "alerta" : ""}"><span class="n">${repoTotal}</span><span class="t">reposiciones por agendar</span></div>
    </div>
    ${deSemana.length ? `<div class="marcadas"><div class="fila entre sub"><span>Asistencia marcada</span><span>${marcadas} de ${deSemana.length}</span></div>
      <div class="barra"><span style="width:${pctMarcadas}%"></span></div></div>` : ""}
    </div>
  </section>`;

  if (!activos.length) return cab + `<div class="vacio"><b>Aún no tienes alumnos</b>Da de alta a cada alumno con su teléfono, paquete y horario fijo; luego llenas la semana con un botón.
    <button class="btn" data-act="nuevo-alumno">+ Agregar alumno</button></div>`;

  /* Cuadrícula hora × día (pantalla ancha) */
  const horas = [...new Set(deSemana.map(c => c.hora))].sort();

      return `<div class="hg-dia ${f === hoy ? "hoy" : ""}"><span class="dn">${DIAS_CORTO[i]}</span><span class="num">${deIso(f).getDate()}</span>
        <small>${cs.length ? `${plural(cs.length, "clase")} · ${mk} marcada${mk === 1 ? "" : "s"}` : i === 0 ? "Se abre agenda" : "Sin clases"}</small>
        ${cs.length ? `<button class="lista-btn" data-act="lista" data-dia="${i}">Pasar lista</button>` : ""}</div>`; }).join("")}
    ${horas.length ? horas.map((h, hi) => { const ult = hi === horas.length - 1 ? "hg-ult" : "";
      return `<div class="hg-hora ${ult}">${fmtHora(h)}</div>${DIAS.map((_, i) => {
        const f = iso(sumarDias(lunes, i));
        const cs = porDia(i).filter(c => c.hora === h && c.estado !== "cancelada");
        const todas = porDia(i).filter(c => c.hora === h);
        return `<div class="hg-celda ${f === hoy ? "hoy" : ""} ${ult}">${todas.length ? `<span class="cupo ${i !== 6 && cs.length > CUPO_HORA ? "lleno" : ""}">${
          i === 6 ? plural(cs.length, "alumno") : `${cs.length}/${CUPO_HORA}`}</span>` : ""}${todas.map(c => pastillaClase(c, hoy)).join("")}
          <button class="mas" data-act="nueva-clase" data-dia="${i}" data-hora="${h}" aria-label="Agregar clase el ${DIAS[i]} a las ${h}">+</button></div>`;
      }).join("")}`; }).join("")
      : `<div class="hg-hora hg-ult"></div><div class="hg-celda hg-ult" style="grid-column:span 7; place-content:center; color:var(--ink-3); font-size:.85rem">Semana sin clases. Usa “Llenar con horarios fijos” o “+ Clase”.</div>`}
  </div>`;

  /* Tira de días y agenda del día (celular) */
  const csDia = porDia(diaSel);
  const fSel = iso(sumarDias(lunes, diaSel));
  const horasDia = [...new Set(csDia.map(c => c.hora))].sort();
  const asist = csDia.filter(c => c.estado === "asistio").length;
  const movil = `<div class="movil solo-angosto">

        <small>${DIAS_CORTO[i]}</small><b>${deIso(f).getDate()}</b><span class="pts">${"<i></i>".repeat(Math.min(k, 4))}</span></button>`; }).join("")}</div>

          <button class="btn btn-2 btn-mini" data-act="nueva-clase" data-dia="${diaSel}">+ Clase</button></div></div>
      ${horasDia.map(h => `<div class="bloque-hora"><div class="bh-h">${fmtHora(h)}</div><div class="bh-lista">${
        csDia.filter(c => c.hora === h).map(c => tarjetaClase(c, hoy, clases)).join("")}</div></div>`).join("")}
    </section>
  </div>`;
  return cab + grid + movil;
}

function etiquetasDe(a) {
  if (!a) return "";
  return etiquetasPerfil().filter(t => a[t]).map(t => `<span class="pastilla ${ETIQUETAS[t].cls}">${ETIQUETAS[t].nombre}</span>`).join("");
}
const nombresEtiquetas = a => a ? etiquetasPerfil().filter(t => a[t]).map(t => ETIQUETAS[t].nombre) : [];
function pastillaClase(c, hoy) {
  const a = S.alumnos[c.alumnoId];
  const sinMarcar = c.estado === "programada" && c.fecha < hoy;
  /* En la tarjeta va lo que se busca de un vistazo: el caballo, y la pista solo cuando no es la de esa fecha (La Silla). */
  const det = [nombreCaballo(c), variasPistas() && c.pista !== pistaBase(c.fecha) ? PISTAS[c.pista] : ""].filter(Boolean).join(" · ");
  return `<button class="pc st-${c.estado} ${sinMarcar ? "sin-marcar" : ""}" data-act="clase" data-l="${c.lunes}" data-id="${c.id}"
      title="${esc((a ? a.nombre : "") + " · " + (sinMarcar ? "Sin marcar" : ESTADOS[c.estado].nombre))}">
    <span class="nm"><span class="punto"></span>${esc(a ? a.nombre : "Alumno borrado")}${c.repo ? `<span class="repo-m">REPO</span>` : ""}</span>
    ${det ? `<span class="dt">${esc(det)}</span>` : ""}</button>`;
}
function tarjetaClase(c, hoy, clases) {
  const a = S.alumnos[c.alumnoId];
  const sinMarcar = c.estado === "programada" && c.fecha < hoy;
  const k = a ? cuenta(c.alumnoId, clases) : null;
  /* Solo lo que se busca de un vistazo; el resto (y los botones de estado) al tocar la clase. */
  const estado = sinMarcar ? `<span class="pastilla e-programada">Sin marcar</span>` : c.estado !== "programada" ? `<span class="pastilla e-${c.estado}">${ESTADOS[c.estado].corto}</span>` : "";
  const det = [nombreCaballo(c), c.repo ? "reposición" : "", variasPistas() && c.pista !== pistaBase(c.fecha) ? PISTAS[c.pista] : "",
    k && !k.ilimitado && k.saldo <= 0 ? "sin clases" : ""].filter(Boolean).join(" · ");
  return `<button class="clase st-${c.estado} ${sinMarcar ? "sin-marcar" : ""}" data-act="clase" data-l="${c.lunes}" data-id="${c.id}">
    <span class="linea"><span class="a">${esc(a ? a.nombre : "Alumno borrado")}</span>${estado}</span>
    ${det ? `<span class="m">${esc(det)}</span>` : ""}
  </button>`;
}

/* ---------------------------------------------------------------- hoy
   Lo primero al abrir: clases, pendientes, cobros y caballos de hoy. */
function vistaHoy(clases) {
  const hoy = hoyIso(), m = MAESTROS[perfil];
  const deHoy = clases.filter(c => c.fecha === hoy && (filtroPista === "todas" || c.pista === filtroPista));
  const tareas = tareasDelDia(hoy).filter(t => !t.hecho);

  const deben = activos.filter(a => { const dm = (a.paquetes || []).filter(p => (p.fecha || "").startsWith(mes)); return dm.length && !dm.every(p => p.pagado); });
  const pocas = activos.map(a => ({ a, k:cuenta(a.id, clases) })).filter(({ a, k }) => !k.ilimitado && k.saldo <= 1 && !deben.includes(a));
  const salud = alertasSalud();
  const debenComp = Object.values(S.inscripciones || {}).filter(i => i.maestro === perfil && S.competencias[i.competenciaId])

  const cabs = clasesDeCaballos().filter(c => c.fecha === hoy);
  const llenos = caballosLista().filter(c => Number(c.maxDia) && cabs.filter(x => x.caballoId === c.id).length > Number(c.maxDia));
  const tituloTarea = t => t.seccion === "caballos" ? `${(S.caballos[t.caballoId] || {}).nombre || "Caballo"}${t.monta && t.monta !== perfil ? ` · lo monta ${MAESTROS[t.monta].nombre}` : ""}`
    : t.seccion === "prueba" ? `Prueba: ${t.nombre || t.texto}` : t.seccion === "cancelaciones" && S.alumnos[t.alumnoId] ? `Canceló ${S.alumnos[t.alumnoId].nombre}` : t.texto;

          <button class="ver" data-act="comp-abrir" data-id="${c.id}">Ver competencia ›</button></section>`; }).join("")}</div>`; })()}
    <div class="hoy-grid">
      <section class="hoy-card hc-clases"><header><h3>Clases de hoy</h3><span class="big">${deHoy.length}</span></header>
        ${deHoy.length ? deHoy.map(c => { const a = S.alumnos[c.alumnoId];
          return `<button class="renglon" data-act="clase" data-l="${c.lunes}" data-id="${c.id}"><span class="h">${fmtHora(c.hora)}</span><span class="t">${esc(a ? a.nombre : "—")}</span><span class="x">${esc(nombreCaballo(c) || (c.estado !== "programada" ? ESTADOS[c.estado].corto : ""))}</span></button>`; }).join("")
          : `<p class="sub">${diaHoy() === 0 ? "Los lunes no hay clases." : "No hay clases hoy."}</p>`}
        <button class="ver" data-act="ir" data-v="semana">Ver calendario ›</button></section>
      <section class="hoy-card hc-pend"><header><h3>Pendientes</h3><span class="big">${tareas.length}</span></header>

          ...debenComp.map(({ i, c, k }) => `<button class="renglon" data-act="comp-abrir" data-id="${c.id}"><span class="t">${esc((alumnoDe(i.alumnoId) || {}).nombre || "")}</span><span class="x">${esc(c.nombre)}: ${dinero$(k.saldo)}</span></button>`),

}

/* ---------------------------------------------------------------- reporte
   Para la dueña: el mes de los dos maestros, clases de prueba y salud de caballos. */
let mesRep = hoyIso().slice(0, 7);
function numerosMaestro(alumnos, semanas, mes) {
  const cs = [];
  for (const [lunes, sem] of Object.entries(semanas || {})) for (const c of Object.values((sem && sem.clases) || {})) {
    const f = iso(sumarDias(deIso(lunes), c.dia)); if (f.startsWith(mes) && alumnos[c.alumnoId] && !alumnos[c.alumnoId].borrado) cs.push(c);
  }
  const n = e => cs.filter(c => c.estado === e).length;
  const als = Object.values(alumnos || {}).filter(a => !a.borrado);
  const paqs = als.flatMap(a => (a.paquetes || []).filter(p => (p.fecha || "").startsWith(mes)));
  const suma = xs => xs.reduce((t, p) => t + (Number(p.monto) || 0), 0);
  const asistio = n("asistio"), aviso = n("aviso"), falta = n("falta");
  return { clases:asistio, aviso, falta, cancelada:n("cancelada"), porDar:n("programada"),
    asistencia: asistio + aviso + falta ? Math.round(asistio / (asistio + aviso + falta) * 100) : null,
    cobrado:suma(paqs.filter(p => p.pagado)), porCobrar:suma(paqs.filter(p => !p.pagado)),
    efectivo:suma(paqs.filter(p => p.pagado && p.metodo === "efectivo")), transferencia:suma(paqs.filter(p => p.pagado && p.metodo === "transferencia")),
    paquetes:paqs.length, nuevos:als.filter(a => (a.alta || "").startsWith(mes)), bajas:als.filter(a => a.baja && (a.bajaEn || "").startsWith(mes)),
    activos:als.filter(a => !a.baja).length };
}
function vistaReporte() {
  const [y, mm] = mesRep.split("-").map(Number);
  const mios = numerosMaestro(S.alumnos, S.semanas, mesRep), otros = numerosMaestro(S.otrosAlumnos, S.otras, mesRep);
  const porM = { [perfil]:mios, [otro(perfil)]:otros };
  const orden = ["tania", "edwin"];
  const dinero = v => "$" + Math.round(v).toLocaleString("es-MX");
  const tot = k => mios[k] + otros[k];
  const asis = (() => { const a = mios.clases + otros.clases, b = a + mios.aviso + otros.aviso + mios.falta + otros.falta; return b ? Math.round(a / b * 100) : null; })();
  const nuevos = [...mios.nuevos.map(a => ({ a, m:perfil })), ...otros.nuevos.map(a => ({ a, m:otro(perfil) }))];
  const bajas = [...mios.bajas.map(a => ({ a, m:perfil })), ...otros.bajas.map(a => ({ a, m:otro(perfil) }))];
  /* Clases de prueba del mes: las anotadas en Pendientes (de los dos) y las altas que vinieron de una. */
  const pruebas = Object.values(S.pendientes || {}).filter(t => t.seccion === "prueba" && (t.fecha || "").startsWith(mesRep));
  const todosAl = { ...S.otrosAlumnos, ...S.alumnos };
  const convertida = t => t.convertidoA || Object.values(todosAl).some(a => a.pruebaId === t.id);
  const conv = pruebas.filter(convertida).length;
  const origenes = Object.entries(ORIGENES).map(([k, n]) => [n, nuevos.filter(x => x.a.origen === k).length]).filter(([, v]) => v);
  const sinOrigen = nuevos.filter(x => !x.a.origen).length;
  const fila = (t, f) => `<tr><td>${t}</td>${orden.map(m => `<td>${f(porM[m])}</td>`).join("")}<td>${f({ ...Object.fromEntries(Object.keys(mios).map(k => [k, typeof mios[k] === "number" ? tot(k) : null])), asistencia:asis })}</td></tr>`;
  const caballos = caballosLista();
  return `
    <div class="titulo"><div><h2>Reporte</h2></div>
      <div class="navsem"><button class="flecha" data-act="rep-mes" data-d="-1" aria-label="Mes anterior">‹</button>
        <span class="mes">${MESES_LARGO[mm - 1]} ${y}</span>
        <button class="flecha" data-act="rep-mes" data-d="1" aria-label="Mes siguiente">›</button></div></div>
    <div class="kpis-rep">
      <div class="kpi"><b>${dinero(tot("cobrado"))}</b><span>cobrado · ${dinero(tot("porCobrar"))} por cobrar</span></div>
      <div class="kpi"><b>${tot("clases")}</b><span>clases dadas</span></div>
      <div class="kpi"><b>${asis === null ? "—" : asis + "%"}</b><span>asistencia</span></div>
      <div class="kpi"><b>${nuevos.length}</b><span>alumnos nuevos${bajas.length ? ` · ${bajas.length} bajas` : ""}</span></div>
    </div>
    <div>
    ${acordeon("rep-maestros", "maestros", "Por maestro", 0, `<div class="tabla-wrap"><table class="tabla-rep">
      <thead><tr><th></th>${orden.map(m => `<th>${MAESTROS[m].nombre}</th>`).join("")}<th>Total</th></tr></thead><tbody>
      ${fila("Clases dadas", x => x.clases)}
      ${fila("Faltó con aviso", x => x.aviso)}
      ${fila("Faltó sin avisar", x => x.falta)}
      ${fila("Canceladas", x => x.cancelada)}
      ${fila("Asistencia", x => x.asistencia === null ? "—" : x.asistencia + "%")}
      ${fila("Paquetes vendidos", x => x.paquetes)}
      ${fila("Cobrado", x => dinero(x.cobrado))}
      ${fila("· efectivo", x => dinero(x.efectivo))}
      ${fila("· transferencia", x => dinero(x.transferencia))}
      ${fila("Por cobrar", x => dinero(x.porCobrar))}
      ${fila("Alumnos activos", x => x.activos)}
      </tbody></table></div>
      <p class="sub">Las clases cuentan por la fecha en que se dieron; el dinero, por la fecha en que se compró el paquete.</p>`, "rep-sec")}
    ${acordeon("rep-pruebas", "pruebas", "Clases de prueba y nuevos", pruebas.length, `
      <div class="kpis-rep" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi"><b>${pruebas.length}</b><span>clases de prueba</span></div>
        <div class="kpi"><b>${conv}</b><span>se quedaron</span></div>
        <div class="kpi"><b>${pruebas.length ? Math.round(conv / pruebas.length * 100) + "%" : "—"}</b><span>se convierten</span></div></div>
      ${pruebas.length ? pruebas.sort((a, b) => a.fecha.localeCompare(b.fecha)).map(t => { const al = t.convertidoA && todosAl[t.convertidoA];
        return `<div class="salud-fila"><div><b>${esc(t.nombre || t.texto || "Sin nombre")}</b><br><span class="sub">${fechaLarga(t.fecha)} · ${esc(MAESTROS[t.autor] ? MAESTROS[t.autor].nombre : "")}</span></div>
          <span class="pastilla ${convertida(t) ? "p-okk" : "p-pronto"}">${convertida(t) ? (al ? "Se quedó" : "Se quedó") : "No se ha quedado"}</span></div>`; }).join("")
        : `<p class="sub">Las clases de prueba se anotan en Pendientes → Clases de prueba. Al tocar “Dar de alta” en una, cuenta como que se quedó.</p>`}
      ${nuevos.length ? `<p class="sub-av">Cómo llegaron los alumnos nuevos</p>
        <p class="sub">${origenes.map(([n, v]) => `${n}: <b>${v}</b>`).join(" · ")}${sinOrigen ? `${origenes.length ? " · " : ""}Sin anotar: ${sinOrigen}` : ""}</p>
        <p class="sub">${nuevos.map(({ a, m }) => `${esc(a.nombre)} (${MAESTROS[m].nombre})`).join(", ")}</p>` : ""}
      ${bajas.length ? `<p class="sub-av">Bajas del mes</p><p class="sub">${bajas.map(({ a, m }) => `${esc(a.nombre)} (${MAESTROS[m].nombre})`).join(", ")}</p>` : ""}`, "rep-sec")}
    ${(() => { const cs = Object.values(S.competencias || {}).filter(c => (c.inicio || "").startsWith(mesRep) || (c.fin || "").startsWith(mesRep));
      const filas = cs.map(c => { const ins = inscritosDe(c.id); const ks = ins.map(i => cuentaInscripcion(i, c));
        const res = ins.flatMap(i => (i.pruebas || []).filter(p => p.resultado && /^[1-3]º$/.test(p.resultado)));
        return { c, ins:ins.length, pruebas:ins.reduce((t, i) => t + (i.pruebas || []).length, 0), total:ks.reduce((t, k) => t + k.total, 0), pagado:ks.reduce((t, k) => t + k.pagado, 0), podios:res.length }; });
      return acordeon("rep-comp", "comp", "Competencias del mes", cs.length, cs.length ? `<div class="tabla-wrap"><table class="tabla-rep"><thead><tr><th>Competencia</th><th>Alumnos</th><th>Pruebas</th><th>Podios</th><th>Cobrado</th><th>Falta</th></tr></thead><tbody>
        ${filas.map(f => `<tr><td>${esc(f.c.nombre)}</td><td>${f.ins}</td><td>${f.pruebas}</td><td>${f.podios}</td><td>${dinero$(f.pagado)}</td><td>${dinero$(f.total - f.pagado)}</td></tr>`).join("")}</tbody></table></div>
        <p class="sub">Podios = 1º, 2º y 3º lugar. El dinero de competencias va aparte del de clases.</p>` : `<p class="sub">No hubo competencias este mes.</p>`, "rep-sec"); })()}
    ${acordeon("rep-salud", "salud", "Salud de caballos", alertasSalud().length, caballos.length ? caballos.map(c => saludDe(c).map(x => `<div class="salud-fila">
        <div><b>${esc(c.nombre)} · ${x.nombre}</b><br><span class="sub">${x.ultima ? `Última: ${fechaLarga(x.ultima)} · toca el ${fechaLarga(x.proxima)}` : "Sin fecha anotada"}</span></div>
        <div style="display:flex; gap:.3rem; align-items:center; flex-wrap:wrap; justify-content:flex-end">
          ${x.estado === "vencido" ? `<span class="pastilla p-vencido">Vencido</span>` : x.estado === "pronto" ? `<span class="pastilla p-pronto">Esta semana</span>` : x.estado === "ok" ? `<span class="pastilla p-okk">Al día</span>` : ""}
          <button class="btn btn-2 btn-mini" data-act="salud-hecho" data-id="${c.id}" data-t="${x.id}">Hecho hoy</button></div></div>`).join("")).join("")
        + `<p class="sub">Para cambiar una fecha o cada cuántos días toca, abre el caballo en Caballos → Editar.</p>`
        : `<p class="sub">Agrega caballos para llevar sus fechas de herraje, vacunas y desparasitación.</p>`, "rep-sec")}
    ${acordeon("rep-respaldo", "respaldo", "Respaldo de datos", haceDias(ultimoRespaldo) === null || haceDias(ultimoRespaldo) > 30 ? 1 : 0, `
      <p class="sub">${ultimoRespaldo ? `Último respaldo: <b>${haceDias(ultimoRespaldo) === 0 ? "hoy" : `hace ${plural(haceDias(ultimoRespaldo), "día")}`}</b>.` : "Todavía no hay ningún respaldo."}
        Descarga uno al mes y guárdalo en tu Google Drive o iCloud.</p>

      <p class="sub">Trae los alumnos, semanas, pagos, caballos, pendientes e historial de Tania y Edwin. Las fotos de los comprobantes no van en el archivo: se quedan guardadas en la nube.</p>`, "rep-sec")}
    </div>`;
}

/* ---------------------------------------------------------------- respaldo
   Un archivo con todo lo que guarda la agenda (de los dos maestros). Los
   comprobantes (fotos y PDF) no van dentro: se quedan en Supabase. */
const COLS_RESPALDO = () => [...Object.keys(MAESTROS).flatMap(m => [`maestros/${m}/alumnos`, `maestros/${m}/semanas`, `maestros/${m}/historial`, `maestros/${m}/chat`]),
  "caballos", "pendientes", "competencias", "inscripciones", "config", "usuarios"];
const RUTA_VALIDA = p => /^(maestros\/(tania|edwin)\/(alumnos|semanas|historial|chat)|caballos|pendientes|competencias|inscripciones|config|usuarios)\/[A-Za-z0-9_\-.~:@+]{1,200}$/.test(p);
let ultimoRespaldo = null;
async function descargarRespaldo() {
  const docs = {};
  try {
    if (Store.db) {
      for (const col of COLS_RESPALDO()) {
        const sn = await Store.db.collection(col).get();
        sn.docs.forEach(d => { docs[`${col}/${d.id}`] = d.data(); });
      }
    } else {
      const L = Store.local();
      for (const m of Object.keys(MAESTROS)) { const x = L[m] || {};
        Object.entries(x.alumnos || {}).forEach(([id, v]) => { docs[`maestros/${m}/alumnos/${id}`] = v; });
        Object.entries(x.semanas || {}).forEach(([id, v]) => { docs[`maestros/${m}/semanas/${id}`] = v; });
        Object.entries(x.historial || {}).forEach(([id, v]) => { docs[`maestros/${m}/historial/${id}`] = v; }); }
      Object.entries(L.caballos || {}).forEach(([id, v]) => { docs[`caballos/${id}`] = v; });
      Object.entries(L.pendientes || {}).forEach(([id, v]) => { docs[`pendientes/${id}`] = v; });
      Object.entries(L.competencias || {}).forEach(([id, v]) => { docs[`competencias/${id}`] = v; });

function contarPendientes(clases) {
  let n = 0;
  for (const a of alumnosActivos()) {
    const k = cuenta(a.id, clases);
    if (k.repoPend) n++;
    if (k.saldo <= 1 || k.vencido) n++;

}

function avisosAgenda(clases) {

  const repos = datos.filter(d => d.k.repoPend);

        <button class="btn btn-2 btn-mini" data-act="clase" data-l="${c.lunes}" data-id="${c.id}">Otro…</button></div></div>`).join("")}` : ""}
    ${repos.length ? `<p class="sub-av">Reposiciones por agendar</p>
      ${repos.map(({ a, k }) => `<div class="aviso-fila"><div><b>${esc(a.nombre)}</b><br><span>${plural(k.repoPend, "reposición", "reposiciones")} · por ${k.origenRepo.slice(-k.repoPend).map(c => fechaCorta(c.fecha)).join(", ")}</span></div>
        <div class="acc"><button class="btn btn-mini" data-act="nueva-clase" data-alumno="${a.id}" data-repo="1">Agendar</button></div></div>`).join("")}` : ""}
    ${renovar.length ? `<p class="sub-av">Paquetes por renovar</p>
      ${renovar.map(({ a, k }) => `<div class="aviso-fila"><div><b>${esc(a.nombre)}</b><br><span>${
          k.saldo <= 0 ? (k.saldo < 0 ? `Debe ${plural(-k.saldo, "clase")}` : "Sin clases") : k.saldo === 1 ? "Le queda 1 clase" : `Le quedan ${k.saldo}`}${
          k.vencido ? ` · vencido` : k.venceProx ? ` · vence ${fechaCorta(k.ultimo.vence)}` : ""}</span></div>
        <div class="acc"><a class="btn btn-wa btn-mini" href="${linkWa(a.telefono, mensajePago(a.id, k))}" target="_blank" rel="noopener">${ICONO_WA}Avisar</a>
        <button class="btn btn-2 btn-mini" data-act="ficha" data-id="${a.id}" data-paquete="1">Cargar paquete</button></div></div>`).join("")}` : ""}`;
  return acordeon("avisos", "avisos", "Avisos de la agenda", total, cuerpo);
}

/* ==========================================================================
   PDF (jsPDF) y descarga
   ========================================================================== */
const PDF_COLOR = {
  tania: { fuerte:[11,110,114], medio:[46,196,182], suave:[221,243,241], texto:[11,43,44] },
  edwin: { fuerte:[15,27,51], medio:[169,180,194], suave:[229,233,239], texto:[14,26,46] },
};
const PDF_ESTADO = { programada:"Por dar", asistio:"Asistió", aviso:"Faltó (avisó)", falta:"Faltó sin avisar", cancelada:"Cancelada" };
/* Las fuentes básicas del PDF solo traen Latin-1: se cambian guiones largos y comillas tipográficas. */
const pdfTxt = s => String(s ?? "").replace(/[–—]/g, "-").replace(/[“”]/g, '"').replace(/[^\x20-\xFF\n]/g, "");
const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();

function pdfBase(titulo, subtitulo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const W = doc.internal.pageSize.getWidth();
  const C = PDF_COLOR[perfil];
  doc.setFillColor(...C.fuerte); doc.rect(0, 0, W, 104, "F");
  doc.setFillColor(...C.medio); doc.rect(0, 104, W, 4, "F");
  try { const img = document.getElementById("logo-tpl").content.querySelector(".oscura").src; doc.addImage(img, "PNG", 40, 18, 78, 69); } catch (e) {}
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.text(pdfTxt(titulo), 134, 50);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text(pdfTxt(subtitulo), 134, 72, { maxWidth: W - 174 });
  return { doc, W, H: doc.internal.pageSize.getHeight(), C };
}
function pdfPie(doc, W, H) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(120, 130, 145);
    doc.text(pdfTxt(`Equus · Agenda de ${MAESTROS[perfil].nombre} · hecho el ${fechaLarga(hoyIso())}`), 40, H - 28);
    if (n > 1) doc.text(`${i} / ${n}`, W - 40, H - 28, { align:"right" });
  }
}
function pdfTabla(ctx, y, cols, filas) {
  const { doc, W, H, C } = ctx;
  const head = () => {
    doc.setFillColor(...C.fuerte); doc.roundedRect(40, y, W - 80, 24, 4, 4, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
    cols.forEach(c => doc.text(pdfTxt(c.t), c.x + 8, y + 16)); y += 24;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  };
  head();
  filas.forEach((f, i) => {
    if (y > H - 80) { doc.addPage(); y = 50; head(); }
    if (i % 2 === 0) { doc.setFillColor(...C.suave); doc.rect(40, y, W - 80, 24, "F"); }
    doc.setTextColor(...C.texto);
    cols.forEach((c, j) => doc.text(pdfTxt(f[j]).slice(0, c.max || 26), c.x + 8, y + 16));
    y += 24;
  });
  return y;
}
async function guardarArchivo(nombre, blob, que = "PDF") {
  if (!Store.dl) { brindis("No se pudo preparar la descarga."); return; }
  try { await Store.dl.save({ filename:nombre, data:blob }); brindis(`${que} descargado`); }
  catch (e) {
    if (e && e.code === "declined") return;
    brindis(e && e.code === "rate_limited" ? "Ya hay una descarga esperando. Inténtalo en un momento." : `No se pudo descargar el ${que}.`);
  }
}

/* ------------------------------------------------------------ comprobantes
   Se guardan como archivos del artifact; en el paquete queda solo su id. */
const TIPOS_COMP = ["image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf"];
async function subirComprobante(file) {
  if (!Store.assets) throw new Error("Solo quien puede editar la agenda puede subir comprobantes.");
  let type = file.type;
  if (!TIPOS_COMP.includes(type)) {
    if (/\.pdf$/i.test(file.name)) type = "application/pdf";
    else if (/\.jpe?g$/i.test(file.name)) type = "image/jpeg";
    else if (/\.png$/i.test(file.name)) type = "image/png";
    else throw new Error("El comprobante tiene que ser foto (JPG o PNG) o PDF.");
  }
  try {
    const r = await Store.assets.upload(file, { type });
    return { id:r.id, tipo:r.contentType, nombre:file.name || "comprobante", fecha:hoyIso() };
  } catch (e) {
    throw new Error(e && e.code === "too_large" ? "El archivo pesa más de 20 MB." : e && e.code === "quota_or_state" ? "Se llenó el espacio para comprobantes." : "No se pudo subir el comprobante. Intenta de nuevo.");
  }
}
const selMetodo = (p, aid) => `<select class="metodo-sel" data-id="${aid}" data-p="${p.id}" aria-label="Forma de pago">
  <option value="" ${!p.metodo ? "selected" : ""}>Forma de pago…</option><option value="efectivo" ${p.metodo === "efectivo" ? "selected" : ""}>Efectivo</option>
  <option value="transferencia" ${p.metodo === "transferencia" ? "selected" : ""}>Transferencia</option></select>`;
const compHtml = (p, aid) => p.comprobante
  ? `<a class="comp" href="${esc(Store.assets ? Store.assets.url(p.comprobante.id) : "#")}" target="_blank" rel="noopener" title="${esc(p.comprobante.nombre)}">${
      String(p.comprobante.tipo).startsWith("image/") ? `<img src="${esc(Store.assets ? Store.assets.url(p.comprobante.id) : "#")}" alt="">` : `<span class="pdf">PDF</span>`}Ver</a>`
  : Store.assets ? `<button class="btn btn-2 btn-mini" data-act="subir-comp" data-id="${aid}" data-p="${p.id}">+ Comprobante</button>` : `<span class="sub">—</span>`;
/* Abre el selector de archivos y adjunta el comprobante a ese paquete. */
function elegirComprobante(aid, pid) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*,application/pdf";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    brindis("Subiendo comprobante…");
    try {
      const comp = await subirComprobante(f);
      const a2 = clon(S.alumnos[aid]); const p = (a2.paquetes || []).find(x => x.id === pid); if (!p) return;
      p.comprobante = comp;
      await Store.guardarAlumno(a2); brindis("Comprobante guardado");
      registrar(`Subió el comprobante de pago del paquete de ${p.clases} clases de ${a2.nombre}`);
    } catch (e) { brindis(e.message || "No se pudo subir el comprobante."); }
    render(); if (!hoja.hidden && hoja.querySelector("#f-paq")) hojaFicha(aid);
  });
  inp.click();
}

/* ------------------------------------------------------------ Excel de pagos
   Un libro con colores del maestro: Resumen (un renglón por mes con su total),
   una hoja por mes con cada compra de paquete y su CIERRE DEL MES, y los saldos
   de los alumnos. En cada mes, ¿Pagó?, Forma de pago y Monto son las celdas
   amarillas: se cambian con la flechita y los totales se recalculan solos. */
const XL = {
  tania: { fuerte:"0B6E72", medio:"2EC4B6", suave:"E8F7F5", tinta:"0B2B2C" },
  edwin: { fuerte:"1B2A4A", medio:"AEB8C6", suave:"EEF1F5", tinta:"0E1A2E" },
};
const XC = { verde:"1F6B4F", verdeBg:"DFF0E7", rojo:"A33227", rojoBg:"FBE6E2", amarillo:"FFF4CC", gris:"7B869C", linea:"D5DBE3", blanco:"FFFFFF" };
const argb = h => ({ argb:"FF" + h });
const relleno = h => ({ type:"pattern", pattern:"solid", fgColor:argb(h) });
const borde = { top:{ style:"thin", color:argb(XC.linea) }, bottom:{ style:"thin", color:argb(XC.linea) }, left:{ style:"thin", color:argb(XC.linea) }, right:{ style:"thin", color:argb(XC.linea) } };
const DINERO = '"$"#,##0';
const metodoTxt = m => m === "efectivo" ? "Efectivo" : m === "transferencia" ? "Transferencia" : "";
const nombreMesXL = m => `${MESES_LARGO[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`;
const fechaXL = s => { if (!s) return ""; const d = deIso(s); return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); };

function bandaXL(ws, fila, ultimaCol, texto, opts) {
  ws.mergeCells(fila, 1, fila, ultimaCol);
  const c = ws.getCell(fila, 1);
  c.value = texto;
  c.font = { name:"Calibri", size:opts.size || 12, bold:opts.bold !== false, italic:!!opts.italic, color:argb(opts.color || XC.blanco) };
  c.fill = relleno(opts.fondo);
  c.alignment = { vertical:"middle", horizontal:"left", indent:1, wrapText:true };
  ws.getRow(fila).height = opts.alto || 24;
}
function encabezadosXL(ws, fila, titulos, C) {
  const r = ws.getRow(fila);
  titulos.forEach((t, i) => { const c = r.getCell(i + 1); c.value = t;
    c.font = { name:"Calibri", size:11, bold:true, color:argb(C.tinta) }; c.fill = relleno(C.medio); c.border = borde;
    c.alignment = { vertical:"middle", horizontal:"center", wrapText:true }; });
  r.height = 30;
}

function hojaMesXL(wb, m, fs, C) {
  const ws = wb.addWorksheet(nombreMesXL(m).slice(0, 31), { properties:{ tabColor:argb(C.medio) }, views:[{ state:"frozen", ySplit:4, showGridLines:false }] });
  ws.columns = [13, 22, 15, 13, 10, 13, 11, 16, 13, 12, 10, 12, 14].map(width => ({ width }));
  bandaXL(ws, 1, 12, `Pagos de ${MAESTROS[perfil].nombre} · ${nombreMesXL(m)}`, { size:18, fondo:C.fuerte, alto:38 });
  bandaXL(ws, 2, 12, "Las celdas amarillas se cambian aquí con la flechita: ¿Pagó? (Sí / No), Forma de pago y Monto. Lo demás se llena solo desde la agenda.",
    { size:10, bold:false, italic:true, fondo:C.suave, color:C.tinta, alto:30 });
  encabezadosXL(ws, 4, ["Fecha", "Alumno", "Teléfono", "Tipo", "Clases", "Monto", "¿Pagó?", "Forma de pago", "Comprobante", "Vence", "Usadas", "Le quedan", "Clave (no tocar)"], C);
  ws.getColumn(13).hidden = true;
  const r1 = 5;
  fs.sort((x, y) => (x.p.fecha || "").localeCompare(y.p.fecha || "") || (x.a.nombre || "").localeCompare(y.a.nombre || ""));
  fs.forEach(({ a, p, k }, i) => {
    const r = ws.getRow(r1 + i);
    r.values = [fechaXL(p.fecha), a.nombre || "", a.telefono || "", esProp(a) ? "Propietario" : "Alumno", p.clases,
      p.monto == null ? null : Number(p.monto), p.pagado ? "Sí" : "No", metodoTxt(p.metodo), p.comprobante ? "Sí" : "No",
      fechaXL(p.vence), p.usadas, k.ilimitado ? "Sin límite" : Math.max(0, p.clases - p.usadas), p.id];
    r.height = 22;
    for (let col = 1; col <= 12; col++) {
      const c = r.getCell(col);
      c.border = borde; c.alignment = { vertical:"middle", horizontal:col === 2 || col === 3 ? "left" : "center" };
      c.font = { name:"Calibri", size:11, color:argb(C.tinta), bold:col === 2 };
      c.fill = relleno([6, 7, 8].includes(col) ? XC.amarillo : i % 2 ? C.suave : XC.blanco);
    }
    r.getCell(1).numFmt = "dd/mm/yyyy"; r.getCell(10).numFmt = "dd/mm/yyyy"; r.getCell(6).numFmt = DINERO;
    r.getCell(7).dataValidation = { type:"list", allowBlank:false, formulae:['"Sí,No"'], showErrorMessage:true, errorTitle:"¿Pagó?", error:"Elige Sí o No." };
    r.getCell(8).dataValidation = { type:"list", allowBlank:true, formulae:['"Efectivo,Transferencia"'], showErrorMessage:true, errorTitle:"Forma de pago", error:"Elige Efectivo o Transferencia." };
    r.getCell(9).font = { name:"Calibri", size:11, color:argb(p.comprobante ? XC.verde : XC.gris) };
    r.getCell(13).font = { name:"Calibri", size:8, color:argb(XC.gris) };
  });
  let r2 = r1 + fs.length - 1;
  if (!fs.length) {
    r2 = r1;
    ws.mergeCells(r1, 1, r1, 12);
    const c = ws.getCell(r1, 1); c.value = "Sin paquetes cargados este mes.";
    c.font = { name:"Calibri", size:11, italic:true, color:argb(XC.gris) }; c.alignment = { horizontal:"center", vertical:"middle" };
    ws.getRow(r1).height = 26;
  } else {
    ws.addConditionalFormatting({ ref:`G${r1}:G${r2}`, rules:[
      { type:"cellIs", operator:"equal", formulae:['"Sí"'], priority:1, style:{ fill:{ type:"pattern", pattern:"solid", bgColor:argb(XC.verdeBg) }, font:{ bold:true, color:argb(XC.verde) } } },
      { type:"cellIs", operator:"equal", formulae:['"No"'], priority:2, style:{ fill:{ type:"pattern", pattern:"solid", bgColor:argb(XC.rojoBg) }, font:{ bold:true, color:argb(XC.rojo) } } },
    ] });
  }
  /* Cierre del mes: fórmulas, para que cambie solo si editan ¿Pagó? o la forma de pago. */
  const R = col => `${col}${r1}:${col}${r2}`;
  const pagados = fs.filter(f => f.p.pagado);
  const suma = l => l.reduce((s, f) => s + (Number(f.p.monto) || 0), 0);
  const ef = suma(pagados.filter(f => f.p.metodo === "efectivo")), tr = suma(pagados.filter(f => f.p.metodo === "transferencia")), tot = suma(pagados);
  const t = r2 + 3;
  bandaXL(ws, t, 12, `CIERRE DEL MES · ${nombreMesXL(m).toUpperCase()}`, { size:13, fondo:C.fuerte, alto:28 });
  const lineas = [
    ["Paquetes vendidos", `COUNTA(${R("M")})`, fs.length, false],
    ["Pagados", `COUNTIF(${R("G")},"Sí")`, pagados.length, false],
    ["Sin pagar", `COUNTIF(${R("G")},"No")`, fs.length - pagados.length, false],
    ["Cobrado en efectivo", `SUMIFS(${R("F")},${R("G")},"Sí",${R("H")},"Efectivo")`, ef, true],
    ["Cobrado por transferencia", `SUMIFS(${R("F")},${R("G")},"Sí",${R("H")},"Transferencia")`, tr, true],
    ["Pagado sin forma de pago anotada", `SUMIFS(${R("F")},${R("G")},"Sí")-F${t + 4}-F${t + 5}`, tot - ef - tr, true],
    ["Por cobrar (no han pagado)", `SUMIFS(${R("F")},${R("G")},"No")`, suma(fs.filter(f => !f.p.pagado)), true],
  ];
  const celdas = {};
  lineas.forEach(([txt, formula, res, dinero], i) => {
    const f = t + 1 + i; ws.mergeCells(f, 2, f, 5);
    const l = ws.getCell(f, 2); l.value = txt; l.font = { name:"Calibri", size:11, color:argb(C.tinta) }; l.alignment = { vertical:"middle", indent:1 };
    const v = ws.getCell(f, 6); v.value = { formula, result:res }; v.font = { name:"Calibri", size:11, bold:true, color:argb(C.tinta) };
    v.alignment = { horizontal:"center", vertical:"middle" }; if (dinero) v.numFmt = DINERO;
    for (let col = 2; col <= 6; col++) { ws.getCell(f, col).fill = relleno(i % 2 ? XC.blanco : C.suave); ws.getCell(f, col).border = borde; }
    ws.getRow(f).height = 22;
    celdas[["paquetes", "pagados", "sinPagar", "efectivo", "transfer", "sinForma", "porCobrar"][i]] = `F${f}`;
  });
  const ft = t + 1 + lineas.length;
  ws.mergeCells(ft, 2, ft, 5);
  const lt = ws.getCell(ft, 2); lt.value = "TOTAL FINAL DEL MES"; lt.font = { name:"Calibri", size:15, bold:true, color:argb(XC.blanco) };
  lt.alignment = { vertical:"middle", indent:1 };
  const vt = ws.getCell(ft, 6); vt.value = { formula:`SUMIFS(${R("F")},${R("G")},"Sí")`, result:tot }; vt.numFmt = DINERO;
  vt.font = { name:"Calibri", size:15, bold:true, color:argb(XC.blanco) }; vt.alignment = { horizontal:"center", vertical:"middle" };
  for (let col = 2; col <= 6; col++) ws.getCell(ft, col).fill = relleno(C.fuerte);
  ws.getRow(ft).height = 34;
  celdas.total = `F${ft}`;
  return { hoja:ws.name, celdas, valores:{ paquetes:fs.length, pagados:pagados.length, sinPagar:fs.length - pagados.length, efectivo:ef, transfer:tr, sinForma:tot - ef - tr, porCobrar:suma(fs.filter(f => !f.p.pagado)), total:tot } };
}

/* Meses del libro: de este mes hacia atrás hasta el primer paquete (máximo 24), más cualquier mes con paquetes. */
function mesesXL(filas) {
  const hoyM = hoyIso().slice(0, 7);
  const conPaq = new Set(filas.map(f => (f.p.fecha || "").slice(0, 7)).filter(Boolean));
  const primero = [...conPaq].sort()[0] || hoyM;
  const meses = new Set(conPaq);
  for (let d = new Date(Number(hoyM.slice(0, 4)), Number(hoyM.slice(5, 7)) - 1, 1), n = 0; n < 24; d.setMonth(d.getMonth() - 1), n++) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; meses.add(k); if (k <= primero) break;
  }
  return [...meses].sort().reverse();
}

async function libroPagos() {
  if (!window.ExcelJS) return null;
  const C = XL[perfil]; const clases = todasLasClases();
  const filas = [];
  for (const [id, a] of Object.entries(S.alumnos)) { const k = cuenta(id, clases); for (const p of k.paqs) filas.push({ a, p, k }); }
  const wb = new ExcelJS.Workbook(); wb.creator = "Equus · Agenda de alumnos"; wb.created = new Date();
  const resumen = wb.addWorksheet("Resumen", { properties:{ tabColor:argb(C.fuerte) }, views:[{ state:"frozen", ySplit:4, showGridLines:false }] });
  const refs = mesesXL(filas).map(m => hojaMesXL(wb, m, filas.filter(f => (f.p.fecha || "").startsWith(m)), C));
  hojaResumenXL(resumen, refs, C);
  hojaSaldosXL(wb, clases, C);
  return await wb.xlsx.writeBuffer();
}
async function excelPagos() {
  brindis("Preparando el Excel…");
  let buf = null; try { buf = await libroPagos(); } catch (e) { buf = null; }
  if (!buf) { brindis("No cargó el generador de Excel. Revisa tu conexión."); return; }
  guardarArchivo(`pagos-${perfil}-${hoyIso()}.xlsx`, new Blob([buf]), "Excel");
}

const nombreHojaXL = (t, usados) => { let b = String(t).replace(/[\\/?*[\]:]/g, " ").trim().slice(0, 28) || "Competencia", n = b, k = 2;
  while (usados.has(n.toLowerCase())) n = `${b.slice(0, 26)} ${k++}`; usados.add(n.toLowerCase()); return n; };
async function libroCompetencias(m) {

  /* --- una hoja por competencia */

    bandaXL(ws, 3, 16, "¿Pagó?: verde = ya pagó todo · amarillo = pagó una parte · rojo = no ha pagado. El total y lo que falta se calculan solos.", { size:10, bold:false, italic:true, fondo:XC.blanco, color:XC.gris, alto:20 });
    /* Títulos de grupo: lo importante y el desglose del total */

    ws.mergeCells(4, 8, 4, 9); celda(ws, 4, 8, "PRUEBAS", { bold:true, size:10, color:MOR.tinta, fondo:MOR.suave });

    const ft = r2 + 2;

/* ------------------------------------------------------------ Excel siempre al día
   Cada cambio en la agenda vuelve a generar los Excel (unos segundos después)
   y los guarda en Supabase con el mismo nombre. Cada uno tiene un enlace fijo
   (/api/excel) que siempre da la versión más reciente. El enlace lleva una
   clave; quien lo tenga puede ver el Excel, así que solo se comparte con
   quien deba verlo. La dueña puede cambiar la clave. */
const ExcelVivo = { cfg:null, leido:false, timer:null, trabajando:false };
const mesesVivos = () => { const hoy = hoyIso(), r = new Set([hoy.slice(0, 7)]);
  Object.values(S.competencias || {}).forEach(c => { if ((c.fin || c.inicio || "") >= iso(sumarDias(new Date(), -62))) { r.add(String(c.inicio).slice(0, 7)); r.add(String(c.fin || c.inicio).slice(0, 7)); } });
  return [...r].filter(m => /^\d{4}-\d{2}$/.test(m)); };
function programarExcelVivo(espera = 12000) {
  if (!Store.vivo || !Store.db) return;
  clearTimeout(ExcelVivo.timer); ExcelVivo.timer = setTimeout(actualizarExcelVivo, espera);
}
async function actualizarExcelVivo() {
  if (!Store.vivo || !S.cargado || !perfil || !window.ExcelJS) return;
  if (ExcelVivo.trabajando) { programarExcelVivo(); return; }
  ExcelVivo.trabajando = true;
  try {
    const cfg = { ...(ExcelVivo.cfg || {}) };
    if (!cfg.clave) cfg.clave = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
    const p = await libroPagos(); if (p) await Store.vivo.subir(`pagos-${perfil}.xlsx`, new Blob([p]));
    for (const m of mesesVivos()) { const b = await libroCompetencias(m); if (b) await Store.vivo.subir(`competencias-${m}.xlsx`, new Blob([b])); }
    cfg.actualizado = { ...(cfg.actualizado || {}), [`pagos-${perfil}`]:Date.now(), competencias:Date.now() };
    await Store.db.doc("config/excel").set(cfg);
  } catch (e) { console.error("Excel al día:", e); }
  ExcelVivo.trabajando = false;
}
/* Al abrir la agenda: si los Excel de este perfil no existen o tienen más de 6 horas, se generan. */
function revisarExcelVivo() {
  if (!S.cargado || !ExcelVivo.leido || ExcelVivo.revisado || !Store.vivo) return;
  ExcelVivo.revisado = true;
  const a = ExcelVivo.cfg && ExcelVivo.cfg.actualizado;
  if (!a || !a[`pagos-${perfil}`] || Date.now() - a[`pagos-${perfil}`] > 6 * 3600e3) programarExcelVivo(4000);
}
const enlaceExcel = (f, mes) => ExcelVivo.cfg && ExcelVivo.cfg.clave ? `${location.origin}/api/excel?f=${f}${mes ? `&mes=${mes}` : ""}&k=${ExcelVivo.cfg.clave}` : "";
function tarjetaExcelVivo(soloComp) {
  if (!Store.vivo) return "";
  const act = (ExcelVivo.cfg && ExcelVivo.cfg.actualizado) || {};
  const fila = (t, f, clave, mes) => { const u = enlaceExcel(f, mes);
    return `<div class="renglon" style="flex-wrap:wrap"><span class="t"><b>${t}</b><br><span class="sub">${act[clave] ? `Al día · ${haceCuanto(act[clave])}` : "Se crea con el próximo cambio"}</span></span>
      ${u ? `<a class="btn btn-mini" href="${esc(u)}" target="_blank" rel="noopener">Abrir</a><button class="btn btn-2 btn-mini" data-act="copiar-enlace" data-u="${esc(u)}">Copiar enlace</button>` : ""}</div>`; };
  return `<section class="hoy-card sec-hoja" style="margin-top:.6rem"><header><h3>Excel siempre al día</h3></header>
    <p class="sub">Estos enlaces no cambian: cada vez que alguien cambia algo en la agenda, el Excel se actualiza solo. Guárdalos en favoritos o compártelos con quien deba verlos.</p>
    ${soloComp ? "" : fila("Pagos de Tania", "pagos-tania", "pagos-tania") + fila("Pagos de Edwin", "pagos-edwin", "pagos-edwin")}
    ${fila(`Competencias de ${MESES_LARGO[Number(hoyIso().slice(5, 7)) - 1]}`, "competencias", "competencias")}
    ${soloComp && mesPagos !== hoyIso().slice(0, 7) ? fila(`Competencias de ${MESES_LARGO[Number(mesPagos.slice(5, 7)) - 1]}`, "competencias", "competencias", mesPagos) : ""}
    <div style="display:flex; gap:.4rem; flex-wrap:wrap"><button class="btn btn-2 btn-mini" data-act="excel-vivo-ya">Actualizar ahora</button>
      ${Store.esDueno && ExcelVivo.cfg && ExcelVivo.cfg.clave ? `<button class="btn btn-2 btn-mini" data-act="excel-vivo-clave">Cambiar enlaces</button>` : ""}</div>
    <p class="sub">Los pagos de cada maestro se actualizan desde su perfil. Si un enlace dice que no hay Excel, abre la agenda en ese perfil y toca “Actualizar ahora”.</p></section>`;

/* ------------------------------------------------------------ Google Drive
   La dueña conecta su Google Drive una vez. La página crea la carpeta
   "Equus · Pagos" con la hoja de cada maestro. Tania y Edwin pueden cambiar
   ahí ¿Pagó?, Forma de pago y Monto: cada vez que la dueña abre la agenda (y
   cada 10 minutos mientras la tiene abierta) se leen esos cambios y se pasan
   a la agenda. Si en la agenda cambió algo, se sube una hoja nueva al día y
   la anterior se va a la papelera; el enlace de la carpeta no cambia. */
const DRIVE = "Google Drive";
const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const Drive = { cfg:null, sincronizando:false, error:"", fallo:null, timer:null, intervalo:null, revisadoEn:null };
const aBase64 = buf => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const deBase64 = b64 => { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
const archivoDe = r => { const p = r && r.payload; return p && (p.id ? p : p.file && p.file.id ? p.file : null); };
/* Huella de todo lo que sale en la hoja: si no cambia, no se vuelve a subir. */
function firmaPagos() {
  const clases = todasLasClases();
  const txt = JSON.stringify(Object.keys(S.alumnos).sort().map(id => { const a = S.alumnos[id]; const k = cuenta(id, clases);
    return [id, a.nombre, a.telefono, !!a.propietario, !!a.baja, k.usadas, k.repoPend, k.faltas,
      (a.paquetes || []).map(p => [p.id, p.clases, p.fecha, p.monto, !!p.pagado, p.metodo || "", p.vence, !!p.comprobante])]; }));
  let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
  return String(h >>> 0);
}
/* Lo que se subió en la última hoja, para saber qué cambiaron ahí después. */
const exportadosDe = () => { const o = {}; for (const a of Object.values(S.alumnos)) for (const p of (a.paquetes || [])) o[p.id] = [!!p.pagado, p.metodo || "", p.monto == null ? null : Number(p.monto)]; return o; };
const valorCelda = v => v == null ? "" : typeof v === "object" && !(v instanceof Date)
  ? (v.result != null ? v.result : v.richText ? v.richText.map(t => t.text).join("") : v.text != null ? v.text : "") : v;
function mensajeDrive(e) {
  const c = e && e.code;
  return c === "needs_reauth" ? "La conexión con Google Drive se vence cada hora. Toca “Actualizar ahora” para volver a conectarla."
    : c === "popup_closed" ? "Se cerró la ventana de Google sin dar permiso. Vuelve a tocar el botón y elige tu cuenta."
    : c === "not_in_manifest" ? "No diste permiso a la agenda para usar Google Drive. Puedes darlo desde el menú de permisos de la página."
    : c === "approval_required" ? "Hace falta tu aprobación para usar Google Drive. Toca “Actualizar ahora”."
    : c === "blocked_by_policy" ? "Tu organización no permite usar Google Drive desde aquí."
    : c === "server_unavailable" ? "Google Drive no respondió. Intenta en un momento."
    : c === "sin_excel" ? "No cargó el generador de Excel. Revisa tu conexión."
    : c === "tool_error" ? "Google Drive no aceptó el archivo. Intenta de nuevo con “Actualizar ahora”."
    : "No se pudo actualizar la hoja en Google Drive.";
}

/* Lee la hoja que está en Drive y trae a la agenda lo que cambiaron ahí. Gana la hoja
   solo en lo que se cambió en ella desde la última subida. */
async function importarHoja(arch) {
  if (!arch || !arch.id || !window.ExcelJS) return [];
  const r = await Store.mcp.callTool(DRIVE, "download_file_content", { fileId:arch.id, exportMimeType:XLSX_MIME });
  const b64 = r && r.payload && (r.payload.content || r.payload.base64Content);
  if (!b64 || typeof b64 !== "string") return [];
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(deBase64(b64));
  const hoja = {};
  wb.eachSheet(ws => {
    if (String(valorCelda(ws.getCell("M4").value)).indexOf("Clave") !== 0) return;
    for (let i = 5; i <= ws.rowCount; i++) {
      const clave = String(valorCelda(ws.getCell(i, 13).value) || "").trim(); if (!clave) continue;
      hoja[clave] = { monto:valorCelda(ws.getCell(i, 6).value), pagado:valorCelda(ws.getCell(i, 7).value), metodo:valorCelda(ws.getCell(i, 8).value) };
    }
  });
  const exp = arch.exportados || {}; const porAlumno = {}; const lineas = [];
  for (const [id, a] of Object.entries(S.alumnos)) for (const p of (a.paquetes || [])) {
    const h = hoja[p.id], e = exp[p.id]; if (!h || !e) continue;
    const ps = normaliza(h.pagado), ms = normaliza(h.metodo);
    const pag = ps === "si" ? true : ps === "no" ? false : null;
    const met = ms === "efectivo" || ms === "transferencia" ? ms : ms === "" ? "" : null;
    let mon; if (h.monto === "" || h.monto == null) mon = null; else { const n = Number(String(h.monto).replace(/[^\d.]/g, "")); if (!isNaN(n)) mon = n; }
    const c = {};
    if (pag !== null && pag !== e[0] && pag !== !!p.pagado) c.pagado = pag;
    if (met !== null && met !== e[1] && met !== (p.metodo || "")) c.metodo = met;
    if (mon !== undefined && mon !== e[2] && mon !== (p.monto == null ? null : Number(p.monto))) c.monto = mon;
    if (!Object.keys(c).length) continue;
    (porAlumno[id] = porAlumno[id] || []).push([p.id, c]);
    lineas.push(`Desde la hoja de Drive: ${a.nombre}, paquete de ${p.clases} clases (${p.fecha ? fechaCorta(p.fecha) : "sin fecha"}): ${[
      c.pagado !== undefined ? (c.pagado ? "pagado" : "sin pagar") : "", c.metodo !== undefined ? (metodoTxt(c.metodo) || "sin forma de pago") : "",
      c.monto !== undefined ? (c.monto == null ? "sin monto" : `$${c.monto.toLocaleString("es-MX")}`) : ""].filter(Boolean).join(", ")}`);
  }
  for (const [id, lista] of Object.entries(porAlumno)) {
    const a2 = clon(S.alumnos[id]);
    lista.forEach(([pid, c]) => { const p = (a2.paquetes || []).find(x => x.id === pid); if (p) Object.assign(p, c); });
    await Store.guardarAlumno(a2);
  }
  if (lineas.length) registrar(lineas);
  return lineas;
}

async function sincronizarDrive(manual) {
  if (!Store.mcp || !Store.esDueno || !Store.db || Drive.sincronizando || !perfil || !S.cargado) return;
  const cfg = clon(Drive.cfg || {});
  if (!cfg.conectado && !manual) return;
  const prf = perfil;
  Drive.sincronizando = true; Drive.error = ""; if (vista === "pagos") render();
  try {
    const arch = cfg.archivos && cfg.archivos[prf];
    const agendaCambio = !arch || arch.firma !== firmaPagos();
    let traidos = [];
    if (arch) { try { traidos = await importarHoja(arch); } catch (e) { if (e && e.code && e.code !== "tool_error") throw e; } }
    if (arch && !agendaCambio && !manual) {
      /* Solo cambió la hoja (o nada): no se reemplaza, para no cortar a quien la esté editando. */
      cfg.archivos[prf] = { ...arch, revisado:Date.now(), ...(traidos.length ? { firma:firmaPagos(), exportados:exportadosDe() } : {}) };
    } else {
      if (!cfg.conectado) {
        try {

        if (u.aLaHora || (Number(k.maxDia) && u.dia >= Number(k.maxDia)) || (Number(k.maxSemana) && u.semana + extra >= Number(k.maxSemana)) || (k.estatus && k.estatus !== "activo")) { caballoId = ""; sinCaballo.push(`${DIAS[dia]} ${fmtHora(hora)} (${k.nombre})`); }
      }
      const c = { alumnoId:aid, dia, hora, estado:"programada", pista: ps.value && pistas.includes(ps.value) ? ps.value : pistaAlumno(al, f),
        repo:repoSel, caballoId, caballo:"", nota:"" };
      sem.clases[nuevoId()] = c; nuevas.push(c);
    }
    if (!nuevas.length) { brindis("Ese alumno ya tiene clase a esa hora en esos días."); return; }
    nuevas.sort((x, y) => (x.dia - y.dia) || x.hora.localeCompare(y.hora));
    cerrarHoja(); diaSel = nuevas[0].dia;
    try {
      await Store.guardarSemana(lunesVista, sem);
      brindis(`${nuevas.length > 1 ? `${nuevas.length} clases agregadas` : "Clase agregada"}${repetidas.length ? ` · ya tenía ${repetidas.join(", ")}` : ""}${
        sinCaballo.length ? ` · sin caballo: ${sinCaballo.join(", ")} (ocupado o lleno)` : ""}`);
      registrar(`Agregó ${nuevas.length > 1 ? `${nuevas.length} clases` : repoSel ? "reposición" : "clase"} de ${nomA(aid)}: ${nuevas.map(c => cuandoTxt(lunesVista, c)).join(", ")}`);
    } catch (e2) {}
    render();
  });
}

function nuevasDelHorario(lunes) {
  const existentes = Object.values((S.semanas[lunes] || {}).clases || {});

  for (const a of alumnosActivos()) for (const h of (a.horario || []))
    if (diaPermitido(a, h.dia) && !existentes.some(c => c.alumnoId === a.id && c.dia === h.dia && c.hora === h.hora)) r.push({ a, h });
  return r;
}
function hojaLlenar() {

async function llenar() {
